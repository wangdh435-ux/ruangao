 "管理过程：规划→实施→监控→应用"}, {"name": "⭐【25考】知识转移内容：历史运维、基础架构、应用系统、业务资料"}, {"name": "应急演练原则：结合实际、着眼实战、精心组织、统筹规划"}, {"name": "SOP 作用：保存经验、快速培训、树立形象、标准化作业"}, {"name": "【25考】知识产权保护：风险管理（分级）、争议处理（协商/诉讼）、合规管理"}, {"name": "知识产权指导原则：战略导向、领导重视、全员参与、全程管理"}]}, {"name": "第16章 资源与工具管理", "children": [{"name": "版本控制：SVN=集中式（需联网）；Git=分布式（离线可用、分支灵活）"}, {"name": "【25考】自动化测试四阶段：计划、设计、实施、执行；工具按技术分：白盒、黑盒、性能"}, {"name": "工具对号入座：UFT=功能测试；LoadRunner=性能测试；TestRail/QC=测试管理；Bugzilla=缺陷跟踪"}, {"name": "监控工具：Zabbix（开源分布式）、Nagios（告警插件）、Prometheus（拉模型、时序、云原生）"}, {"name": "⭐【25考】过程管理工具作用：实现 IT 服务可视、可管、可控、可衡量"}, {"name": "自动化工具：Ansible（SSH 无客户端）、Puppet（C/S）、SaltStack（MQ 消息）、Jenkins（持续集成）、Chef"}, {"name": "云管理四工具：CloudOS（虚拟化）、CMP（云管理）、CSM（云安全）、CPS（云专业服务）"}, {"name": "AIOps=大数据+AI 智能运维；ChatOps=以沟通为中心的 ChatBot 协作"}, {"name": "【25考】项目管理工具：PingCode、禅道（国产开源）、Jira、MS Project"}]}, {"name": "第17章 信息系统项目管理 ⭐案例题重灾区", "children": [{"name": "项目定义：创造独特成果的临时性工作；独特性+临时性=两大特征"}, {"name": "⭐项目/项目集/项目组合/运营：项目=正确地做事；项目集=协调关联项目获协同效益；项目组合=做正确的事（对齐战略）；运营=高效重复"}, {"name": "【25考】事业环境因素：内部（文化、设施、IT、资源、员工能力）+外部（市场、监管、行业标准…）；组织过程资产：过程/治理文件/数据/知识/安保"}, {"name": "PMO 三型：支持型、控制型、指令型（控制力递增）"}, {"name": "【25考】项目经理三能力：项目管理技能、战略和商务管理技能、领导力技能"}, {"name": "⭐【25考】12 项原则 🔑\"勤协作干价值，系领裁质量，复杂风险韧性变革\"（勤勉关怀/协作环境/干系人参与/聚焦价值/系统交互/领导力/裁剪/质量/驾驭复杂性/优化风险/适应韧性/驱动变革）"}, {"name": "生命周期特征：成本人力先低后高再回落；风险随推进降低；变更代价随推进增高"}, {"name": "⭐开发生命周期四型：预测型（需求前期明确、一次交付、严控变更）、迭代型（逐步细化）、增量型（渐进加功能）、适应型（动态变化、频繁交付、实时变更）"}, {"name": "⭐五大过程组 🔑\"启规执监收\"：启动、规划、执行、监控、收尾"}, {"name": "⭐十大知识领域 🔑\"整范进成质，资沟风采干\"：整合、范围、进度、成本、质量、资源、沟通、风险、采购、干系人"}, {"name": "八大绩效域 🔑\"干团开规，工交测不\"：干系人、团队、开发方法和生命周期、规划、项目工作、交付、测量、不确定性"}]}]}, {"name": "场景篇（第18-23章）", "children": [{"name": "第18章 智慧城市发展规划", "children": [{"name": "【25考】发展四阶段：初始形成（1999-2008 数字工程）→布局（2009-2015 八部门指导意见）→新型转换（2016-2018 \"三融五跨\"）→数字化发展（2020 至今）"}, {"name": "三融五跨：技术/业务/数据融合；跨层级、跨地域、跨系统、跨部门、跨业务"}, {"name": "五级成熟度 🔑\"规管协优引\"：规划级、管理级、协同级、优化级、引领级"}, {"name": "关注焦点五域：城市治理、惠民服务、生态宜居、产业发展、区域协同"}, {"name": "数字政府三网：一网协同（机关内部）、一网统管（城市治理）、一网通办（政务 n": [{"name": "表头: 题型｜得分规则｜应对"}, {"name": "理论题｜答对按点给分，多答不扣分｜按 N+1 条回答（6 分写 7 点）；背标题级内容；不会也别空，写关键词有同情分"}, {"name": "找错改错题｜送分题，主观给分｜逐句\"鸡蛋里挑骨头\"，先列确定的再补疑似的；标记阅读法（人员/时间/做法）；过程比较法（与理论要求对比）"}, {"name": "填空/选择/判断｜有标准答案；多选多填不得分、少选可部分得分｜判断不会也蒙（50% 概率）；选择看清\"正确/不正确\""}, {"name": "计算题｜不写公式/过程扣分；过程对结果错酌情扣分｜公式+过程+单位写全；最后检查有没有坑"}, {"name": "答题顺序 ：先做理论题 → 再找错改错题 → 最后计算题；每题先看问题再读题干。 作答规范 ：①②③分条、所答即所问、用教程术语、引用案例原文、结果带单位、绝不交白卷。 机考时间 ：基础知识+案例连考共 240 分钟（基础知识 120-150 分钟，剩余全给案例）。"}]}, {"name": "8.4 论文评分细则（第 1 讲官方口径）", "children": [{"name": "满分 75 分，2-3 名阅卷人评分取平均；60-75 优良 / 45-59 及格 / 0-44 不及格"}, {"name": "形式分 30%（字数 20% + 语句表达 10%）；内容分 70%（项目介绍 30% + 子题目要求 40%）"}, {"name": "评分五方面：切合题意 30%、应用深度与水平 20%、实践性 20%（非常重要）、表达能力 15%、综合分析 15%"}, {"name": "字数：正文 2000-2500 字（子题目常要求 2500-3000，建议按 2500 写，写到 3500 也行）；不要写摘要"}, {"name": "考场 120 分钟分配：选题 3 分钟 → 构思 12 分钟 → 正文 95 分钟 → 检查 10 分钟"}]}, {"name": "8.5 论文项目背景选择标准（第 1 讲）", "children": [{"name": "1. 项目规模 800-1000 万，选省部级/地市级电子政务或集团信息化项目（OA、ERP 等常见通用项目尽量不写） 2. 选近 2 年内的项目（未完工可改编） 3. 不得出现真实名称，用\"某地级市、某医院、某公司\" 4. 金额与周期、团队人数匹配（如 20 人 × 2 万/月 × 12 月 ≈ 480 万）；金额别写整数，写 467 万、489 万 5. 涉密项目可写但必须脱密"}]}, {"name": "8.6 2025 论文真题", "children": [{"name": "子题目：①持续改进与监督 5 个主要活动及目标 ②设计针对过程的测量指标 ③从人员/资源/技术/过程角度提服务改进内容"}, {"name": "风向解读：2025 落在第 12 章运营侧，2026 大概率转向规划类（七大规划），与机构三道押题方向吻合；但第 12 章\"业务关系管理\"（=押题三 IT 服务运营提升的核心素材）仍需防回马枪"}, {"name": "「服务的持续改进与监督」 （第 12 章）："}]}]}, {"name": "笔记补缺（眼熟材料）", "children": [{"name": "笔记补缺 · 总表", "children": [{"name": "数字民生建设重点：普惠、赋能、利民（第 2 章）"}, {"name": "任务目标定义原则：具体、可测量、可实现（第 4 章）"}, {"name": "定义数据类的方法：实体法、功能法（第 4 章）"}, {"name": "服务质量管理活动：服务质量策划（质量目标/职责权限/时间安排/策划文件）→服务质量检查（满意度调查、项目质量保证、内审、管理评审、日常检查、质量文化培训）→服务质量改进（确定改进方向和目标）（第 12 章）"}, {"name": "技术手册发布流程：审核、存档、发放（第 15 章）"}, {"name": "项目成功传统测量指标：时间、成本、范围、质量（第 17 章）"}, {"name": "消费群体特征：以\"90 后\"\"00 后\"为主力，注重个性化、体验感（如宠物经济、露营、剧本杀）（第 23 章）"}, {"name": "以下来自 82 页章节笔记、手册前八部分未收录的枚举点。优先级低于口诀和案例增补， 目标是综合知识选择题\"看到能选对\"，不用逐字背。⭐=笔记标注的 2025 考点。 ⭐2025 考点补记（7 条，最后扫描发现，优先看） ："}]}, {"name": "笔记补缺 · 第 1 章", "children": [{"name": "信息化的核心：在经济和社会各个领域充分应用基于信息技术的先进社会生产工具（表现为各种信息系统或软硬件产品），提高信息时代的社会生产力，并推动生产关系和上层建筑的改革（表现为法律、法规、制度 等"}, {"name": "信息化的特征：广泛性、深度性、快速性、数据量巨大、信息交流快速、信息处理能力强大、跨界整合、社会生产方式改变、信息安全问题突出"}, {"name": "我国信息化发展战略总目标（三步走）：到2020年，核心关键技术部分领域达到国际先进水平等；到2025年，建成国际领先的移动通信网络等；到21世纪中叶，信息化全面支撑富强民主文明和谐的社会主义现代化国家建设等"}, {"name": "我国信息化发展阶段：信息化研究探索阶段（1982—1992年）、信息化形成实践阶段（1993—1997年）、信息化加速推进阶段（1998—2001年）、信息化全面发展阶段（2002—2011年） 等"}, {"name": "狭义的信息系统：由计算机硬件、网络和通信设备、软件、信息资源、信息用户和规章制度组成的以处理信息流为目的的人机一体化系统"}, {"name": "⭐初始阶段：组织中只有个别人具有使用计算机的能力；一般发生在一个组织的财务部门"}, {"name": "传播阶段：数据处理能力得到快速提高；新的问题不断出现（如数据冗余等）；使用效率偏低等"}, {"name": "控制阶段：出现了计算机系统的管理组织；数据库（DB）技术得到应用；开始从计算机管理向数据管理转变"}, {"name": "集成阶段：建立集中式的数据库和相应的信息系统；增加大量硬件，预算费用随之迅速增长"}, {"name": "数据管理阶段：组织高层意识到信息战略的重要性；选定统一的数据库平台等，各部门、各系统基本实现资源整合和信息共享"}, {"name": "成熟阶段：信息系统满足组织各个层次的需求；将IT与管理过程结合，整合内外资源，提升组织竞争力和发展潜力。"}, {"name": "冯 ・ 诺依曼计算机结构五部分：控制器、运算器、存储器、输入设备和输出设备"}, {"name": "计算机软件分类：系统软件（操作系统、数据库和中间件等）、应用软件（图形图像处理软件、财务软件等）"}, {"name": "计算机网络功能：数据通信、资源共享、管理集中化、实现分布式处理和负荷均衡"}, {"name": "计算机网络分类（按作用范围）：个人局域网（PAN）、局域网（LAN）、城域网（MAN）、广域网（WAN）"}, {"name": "⭐计算机网络性能指标：。速率：连接在计算机网络上的主机或通信设备在数字信道上传送数据的速率，也称为数据率(DataRate)或比特率(BitRate)，单位是b/s 等"}, {"name": "软件定义网络（SDN）架构：数据平面、控制平面和应用平面"}, {"name": "数据存储技术架构组成：存储介质、组网方式、存储协议和类型、存储架构和连接方式"}, {"name": "连接方式分类：DAS存储、NAS存储、SAN存储。DAS/NAS/SAN对比：类型传输协议特点适用场景DASSCSI/FC直接连接主机，不共享中小组织单机存储NASTCP/IP文件级共享 等"}, {"name": "常见数据结构模型：层次模型、网状模型、关系模型"}, {"name": "数据库类型：关系型数据库（SQL）、非关系型数据库（NoSQL）"}, {"name": "数据仓库定义：一个面向主题的、集成的、非易失的且随时间变化的数据集合，用于支持管理决策"}, {"name": "信息安全技术和措施：身份认证、访问控制、入侵检测系统、防火墙、网闸、防病毒、数据加密技术等"}, {"name": "加密技术分类：对称加密（如DES算法）、非对称加密（如RSA算法）"}, {"name": "物联网定义：通过信息传感设备，按约定的协议将任何物品与互联网相连接，进行信息交换和通信，以实现智能化识别、定位、跟踪、监控和管理的网络"}, {"name": "物联网特点（本质角度）：互联、识别与通信、智能化"}, {"name": "物联网架构三层：感知层、网络层、应用层。架构层功能描述案例识别物体、采集数据（“物联网的眼睛和耳感知层温度传感器采集大棚温湿度、二维码标签标识商品朵”）传递 等"}, {"name": "物联网关键技术：传感器技术（如RFID）、传感网（如MEMS）、应用系统框架"}, {"name": "区块链特点：多中心化、多方维护、时序数据、智能合约、不可篡改、开放共识、安全可信"}, {"name": "云计算特点：超大规模、高可扩展性、虚拟化、高可靠性、通用性、廉价性、灵活定制"}, {"name": "大数据定义：无法在一定时间范围内用常规软件工具进行捕捉、管理和处理的数据集合，是需要新处理模式才能具有更强的决策力、洞察发现力和流程优化能力的海量、高增长率和多样化的信息资产"}, {"name": "人工智能定义：利用计算机或者计算机控制的机器来模拟、延伸和扩展人类的智能和感知环境的能力，从而"}, {"name": "人工智能特点：由人类设计，为人类服务，本质为计算，基础为数据；能感知环境等；有适应特性等"}, {"name": "人工智能关键技术：机器学习、自然语言处理（NLP）、计算机视觉（CV）、知识图谱、专家系统、人机交互（HCI）等"}, {"name": "⭐边缘计算定义：一种将主要处理和数据存储放在网络边缘节点的分布式计算形式，在靠近物或数据源头的网络边缘侧，融合网络、计算、存储、应用核心能力的开放平台，就近提供边缘计算服务"}, {"name": "边缘计算关键技术：边云协同、边缘计算的安全"}, {"name": "数字孪生定义：现有的或将有的物理实体对象的数字模型，通过实测、仿真和数据分析来实时感知、诊断和预测物理实体对象的状态等"}, {"name": "数字孪生发展阶段：技术准备期（1960年—21世纪初）、概念产生期（2002—2010年）、领先应用期"}, {"name": "信息基础设施内容：以5G、物联网、工业互联网、卫星互联网为代表的通信网络基础设施；以人工智能、云计算、区块链等为代表的新技术基础设施；以数据中心、智能计算中心为代表的算力基础设施等。"}]}, {"name": "笔记补缺 · 第 2 章", "children": [{"name": "第四次科技革命对应的科学范式：第一科学范式为经验范式；第二科学范式为理论范式；第三科学范式为模拟范式；第四科学范式为数据密集型研究范式"}, {"name": "社交网络信息传输特征：永生性、无限性、即时性以及方向性"}, {"name": "社会 “智慧主体”：不仅是自然人，还可以是互联网账号、自动驾驶汽车等，具备可复制性、自我修炼能力等特征"}, {"name": "传统发展模式下组织提升竞争力的方式：优化组织结构体系、提升工艺技术与装备、降低业务成本等"}, {"name": "传统发展模式的局限：决策瓶颈、变革制约、知识资产流失、需求响应延迟"}, {"name": "数字化转型的关键：能力因子定义和数字化“封装”、基于“互联网+”的调度和决策、转型控制"}, {"name": "⭐夯实数字中国建设基础的内容：打通数字基础设施大动脉、畅通数据资源大循环"}, {"name": "全面赋能经济社会发展的内容：做强做优做大数字经济、发展高效协同的数字政务、打造自信繁荣的数字文化、构建普惠便捷的数字社会、建设绿色智慧的数字生态文明"}, {"name": "数字经济技术经济范式的结构：驱动力（智能技术群）、新结构（网络效应等）、价值创造（全新价值）、经济增长（正反馈闭环）"}, {"name": "⭐产业数字化的特征：以数字科技变革生产工具、以数据资源为关键生产要素、以数字内容重构产品结构等"}, {"name": "数字化治理的内涵：对数据的治理、运用数字技术进行治理、对数字融合空间进行治理"}, {"name": "数字政府的新特征：协同化、云端化、智能化、数据化、动态化"}, {"name": "“一网统管” 的重点：一网（政务云等）、一屏（城市运行情况反映）、联动（跨部门协同）、预警（智能预警）、创新（业务流程优化）"}, {"name": "政府数字化履职能力体系：提升经济调节能力、市场监管能力、社会管理能力、公共服务能力、生态环境保护能力、政务运行效能、政务公开水平"}, {"name": "《数字乡村发展战略纲要》目标：到2035年，数字乡村建设取得长足进展；到21世纪中叶，全面建成数"}, {"name": "数字生活的体现：生活工具数字化、生活方式数字化、生活内容数字化"}, {"name": "⭐《国民经济 “十四五” 规划》提出：建立健全数据要素市场规则，包括数据资源产权、交易流通等基础制度和标准规范"}, {"name": "网络安全的定义：网络系统的硬件、软件及其系统中的数据受到保护，不因偶然或恶意原因遭受破坏、更改、泄露，系统连续可靠正常运行，网络服务不中断"}, {"name": "加强网络安全保障的举措：健全法律法规和制度标准、加强风险评估和审查、加强基础设施建设、推动教育技术产业融合、加强国际交流合作"}, {"name": "四种科学范式的关系：相辅相成、并存不悖，在不同条件和场景下发挥关键价值"}, {"name": "全球数字营商环境评价指标体系一级指标：数字支撑体系、数据开发利用与安全、数字市场准入、数字市场规则、数字创新环境"}, {"name": "数字经济新业态新模式的 15 个重点方向：包括融合化在线教育、互联网医疗、线上办公等（具体见原文）"}, {"name": "促进新业态新模式发展的考虑方面：优化业态治理方式、加强数字化转型协同、完善就业服务和保障制度、改革生产资料管理制度。"}]}, {"name": "笔记补缺 · 第 3 章", "children": [{"name": "矛盾的特殊性表现：每一种运动形式中的矛盾、每一事物发展过程中的矛盾、每一事物中矛盾及不同方面的地位均有特殊性"}, {"name": "主要矛盾：在许多矛盾构成的体系中起领导作用，规定和影响其他矛盾；矛盾的主要方面决定事物性质；矛盾同一性指矛盾双方相互依存并在一定条件下转化"}, {"name": "系统规划和管理中需解决的主要矛盾：需求与资源的矛盾、敏态与稳态的矛盾、安全与效率的矛盾、文化与技术的矛盾"}, {"name": "认识过程：从实践到感性认识，再到理性认识（第一次飞跃）；理性认识再回到实践（第二次飞跃，更重要）"}, {"name": "系统规划需遵循的原则：避免惯向思维、持续多次迭代、实验问题解决（如原型法）"}, {"name": "⭐系统的八大基本原理：系统整体性原理：系统具有独立要素所不具有的性质和功能。o系统层次性原理：系统组织在地位、作用、结构、功能上表现出等级秩序性。o系统开放性原理：系统与外界环境进行物质、能量 等"}, {"name": "系统规划的思维方式：从整体全局思考，明确系统组成、输入、输出及交互，拆解关系、梳理流程，必要时建模推演"}, {"name": "信息论相关概念：信号、信息量、信源、信宿、信道、信道容量、编码、译码"}, {"name": "四次信息技术革命：语言文字及文献出现、造纸和印刷技术、电报电话电视等通信技术、电子计算机和现代通信技术应用"}, {"name": "信息的特性：传递性、共享性、依附性、可处理性、价值相对性、时效性、真伪性"}, {"name": "信息特征在系统需求分析中的应用：考虑共享性和真伪性需处理数据安全与权限管理；考虑价值相对性需抓住核心需求；考虑依附性和可处理性需收集并处理信息"}, {"name": "控制系统组成：控制部分（传感器、控制器、执行器）和被控对象"}, {"name": "典型控制系统应用：综合自动化系统、计算机集成制造系统（CIMS）、网络化控制系统（NCS）"}, {"name": "⭐耗散结构定义：耗散结构理论是熵理论的延伸。一个远离平衡的开放系统，在外界条件达到特定阈值时，通过与外界交换物质和能量，从无序状态转化为时间、空间或功能上的有序状态"}, {"name": "耗散结构在系统中的体现：物流网络、企业管理信息系统可构造成耗散结构，通过引入负熵流提升抗干扰能力，促进系统优化"}, {"name": "信息系统中自组织系统的协同作用：自适应能力、自我修复能力、自我进化能力"}, {"name": "突变论研究内容：自然界和人类社会中连续渐变如何引起突变或飞跃，以统一数学模型描述、预测和控制这些现象"}, {"name": "突变论的应用方向：为系统规划提供思想体系，提升系统性能、稳定性及安全性；为算法设计和实际问题求解提供支撑（如系统稳定性分析、人工智能模型训练优化）"}, {"name": "复杂系统论指导下的系统规划与管理方向：整体视角、动态演化、非线性思维、多样性原则、适应性策略。"}]}, {"name": "笔记补缺 · 第 4 章", "children": [{"name": "信息系统规划的关键价值与意义：确立组织关键数字能力目标、明确组织数字能力建设路径、确保数字能力建设认识上的一致性、具象数字能力建设的关键任务、明确数字能力标准与控制措施、统筹部署与管理相关建设资源"}, {"name": "信息系统规划的特点：涉及组织发展新型概念和思想的形成，面向全局性、长远性关键问题，具有较强不确定性、系统概括性和低结构化程度"}, {"name": "⭐信息系统规划的原则：战略性（与组织战略一致）、整体性（覆盖业务、系统框架、实施、集成）、先进性（融合技术趋势与最佳实践）、指导性（为设计与实现提供依据）、柔性（适应内外部环境变化） 等"}, {"name": "信息系统发展战略的内容：发展战略与目标（包括基本趋势、指导思想、战略目标和基本方针）、发展路径与阶段"}, {"name": "发展路径选择原则：业务一致、能力主线、基础优先、稳态先行"}, {"name": "⭐系统框架演进（以工业企业为例）：以应用功能为主线的框架、以平台能力为主线的框架、以互联网为主线的框架。框架类型案例某小型服装厂：采购现成的“财务软件（用友）”“库存软件（管家婆）”,通过简单接口实以应用功能为…"}, {"name": "分系统划分原则：技术一致性、工程一致性、职能一致性、数据一致性"}, {"name": "中小型单位的信息组织体系：由信息化管理委员会和信息化团队构成，信息化团队可细分为主机组、网络组等，部分组织设信息专员"}, {"name": "业务领域的信息组织体系建设模式：在业务角色中设定具备信息技术基础的人员；对全员开展信息技术基础培育"}, {"name": "技术体系的范围：应用软件及开发技术、网络技术、数据库技术、中间件技术、计算机与存储技术、数据资源技术等"}, {"name": "技术蓝图绘制方法：逻辑结构图（基于“感-传-智-用-安”或“云-边-端-网”框架）、技术应用图"}, {"name": "资源控制方法：使用节约资源技术、减少资源无效利用、优化资源开发利用管理"}, {"name": "保障体系的内容：组织保障、人员保障、技术保障、资源保障、数据保障、安全保障"}, {"name": "人员保障重点：培养全员数字能力、强化相关部门和团队的能力培育、强化全员变革意识等"}, {"name": "内部需求挖掘的工作任务：理解组织战略、熟悉业务流程、收集用户需求、评估现有系统、感知数字环境"}, {"name": "外部需求挖掘的工作任务：国家战略导入、行业趋势分析、技术趋势研究、竞争环境分析、客户期望调研、标准与规范引用"}, {"name": "内外部需求整合与分析的内容：确定主要矛盾及关系、主要需求及优先级、关键干系人需求等"}, {"name": "⭐场景化模型分析的优点：贴近实际需求、提供指导参考、提高系统适应性；缺点：数据采集分析困难、可行性限制。"}, {"name": "成熟度等级（5 个等级）：一级（确立主要工作和基本策划）、二级（管理精细化和流程化）、三级（部分职能协同一体化）、四级（组织敏捷能力建设）、五级（生态一体化建设）"}, {"name": "诊断与评估模型的维度：业务能力维度（能力域、能力子域等）、成熟度等级维度"}, {"name": "诊断与评估实施的内容：计划与打分、权重与计算、记录与确认"}, {"name": "需求整合的维度：业务领域、能力建设、技术发展"}, {"name": "整体规划的重点：确定信息系统总体架构、发展方向和布局，确保与组织战略一致、提高协同性、优化资源配置"}, {"name": "一致性检查的内容：规划与需求及战略的一致性、规划内容间的协调一致性、科学性和可行性等"}, {"name": "信息系统规划持续改进的关注点：跟踪组织战略、感知技术发展创新、关注数据管理和信息安全、注重用户体验和参与、建立监测和评估机制"}, {"name": "组织战略集的组成：组织的使命、目标、战略和其他与信息系统有关的组织属性"}, {"name": "信息系统战略集的组成：系统目标、系统约束、系统建设战略"}, {"name": "管理功能识别依据：企业中的资源及其生命周期（产生、获得、服务、归宿）"}, {"name": "关键成功因素的来源：个别产业的结构、竞争策略及产业地位、环境因素、暂时因素"}, {"name": "⭐Zachman 框架的实施步骤：确定组织愿景和原则、现状描述分析、目标架构定义、差距与改进点分析、制"}]}, {"name": "笔记补缺 · 第 5 章", "children": [{"name": "抽象的类型：业务抽象（将复杂业务活动转化为可管控的业务区块与组件）、过程抽象（具有明确功能的指令序列）、数据抽象（描述数据对象的具体数据集合） 等"}, {"name": "模式：面向一般问题的最佳实践解决方法，常见类型有创建型模式（如工厂模式）、结构型模式（如组合模式）、行为型模式（如责任链模式）"}, {"name": "重构：重新组织技术，简化规划设计而不改变功能，优化冗余、低效算法等不足"}, {"name": "⭐客户机 / 服务器架构：两层架构：前端程序（界面、业务处理）在客户机，后台数据在数据库服务器，优点是结构简单，缺o点是维护不便。三层架构：业务处理程序提取至应用服务器，利于系统维护 等"}, {"name": "组件分布架构：突破传统客户机/服务器架构的分布限制，组件可同时作为服务器和客户机，需组件分布中间层构件（如CORBA、DCOM、EJB）支持。"}, {"name": "⭐瀑布模型特点：阶段间有顺序性和依赖性；推迟程序物理实现；每个阶段需完成规定内容并评审"}, {"name": "迭代模型优点：逐步增加功能减少用户冲击；降低失败风险；优先级高的服务先交付并接受更多测试"}, {"name": "表示体系结构的图形工具：层次图（描绘层次结构，矩形框代表模块，连线表示调用关系，带编号的为HIPO图）、结构图（类似层次图，方框注明名字或功能，箭头表示调用关系，带注释箭头表示传递信息）"}, {"name": "接口定义内容：包括功能描述、输入/输出定义、错误处理、通信方法、协议、调用方法等"}, {"name": "接口类型：用户接口（说明向用户提供的命令及语法等）、外部接口（说明与外界的接口安排）、内部接口（说明系统内各元素的接口安排）"}, {"name": "用户界面设计原则：置用户于控制之下、减少用户记忆负担、保持界面一致"}, {"name": "界面定义需考虑的问题：系统响应时间、用户求助机制、出错信息、命令方式"}, {"name": "数据定义内容：包括程序级数据结构（用伪代码定义组成、类型等）和应用级数据库（在数据库管理系统上定义结构和建立数据库）"}, {"name": "数据库定义步骤：需求分析（调查用户业务和数据使用情况）、定义概念模型（建立抽象概念数据模型）、定义逻辑模型（转换为特定数据库管理系统支持的逻辑模式） 等"}, {"name": "构件定义任务：标识问题域和基础设施域对应的类；细化不需要作为可复用构件的类；说明持久数据源并确定管理所需类；开发和细化类或构件的行为表示；细化部署图；考虑可选方案并重构"}, {"name": "初步调研内容：组织概况（规模、行业性质等）、组织环境（自然和社会经济环境等）、现行系统概况（功能、技术水平等）、各方面对新系统的态度、系统研制工作的资源情况"}, {"name": "可行性研究的四个方面：经济可行性（分析成本和效益，确保效益大于成本）、技术可行性（分析技术资源可用性和现实性，优先采用成熟技术）、社会可行性（从政策、法律等社会因素论证，含操作可行性） 等"}, {"name": "可行性研究步骤：复查系统目标和规模、研究目前使用的系统、导出新系统的高层逻辑模型、重新定义问题、导出和评价供选择的方案、推荐一个方案并说明理由、草拟开发计划、书写文档并提交审查"}, {"name": "可行性研究报告主要内容：建设任务的提出、系统的目标、初步调研概况、初步实施方案与比较、可行性研究、结论"}, {"name": "⭐详细调研范围：组织和功能业务、组织目标和发展战略、工艺流程和产品构成、数据和数据流、业务流程和工作形式、管理方式和业务管理方法、决策方式和过程、可用资源和限制条件、现存问题和改进意见"}, {"name": "详细调研的内容：收集信息、系统需求建模、需求的优先级划分、构建系统原型并检验可行性及发现问题、产生和评估候选方案、和管理部门一起复查各种建议"}, {"name": "详细调研方法：收集资料、发调研表征求意见、开调研会、访问、深入实际的调研方式（参加业务实践）"}, {"name": "系统分析过程：问题分析阶段（明确系统建设背景、目标、范围等，采用原型法、JAD会议等需求引导方法）、需求分析阶段（获取功能性需求和非功能性需求，采用结构化方法等建模） 等"}, {"name": "系统说明书内容：引言（项目名称、目标等）、概述（工作内容、现行系统情况等）、实施计划（任务分解、进度、预算等）"}, {"name": "系统设计目标：在保证实现逻辑模型功能基础上，提高系统性能，使系统安全可靠、易于理解、便于维护且经济性良好"}, {"name": "系统设计原则：系统性原则（信息代码、设计规范统一等）、灵活性原则（系统具有开放性和可变性）、可靠性原则（具备安全保密性等）、经济性原则（减少系统开销） 等"}, {"name": "系统设计内容：系统总体结构设计、处理流程设计、代码设计、人机界面设计、输出设计、输入设计、数据库设计、安全保密设计、系统物理配置方案设计、编写系统设计说明书"}, {"name": "APA 过程：收集应用系统清单、评估应用系统、分析应用系统组合、制定优化策略、实施优化计划、监测和评估"}, {"name": "TOGAF 目标：确保所有用户使用相同语言；避免被锁定到专有解决方案；节省时间和金钱；实现可观投资回报"}, {"name": "TOGAF9 组件：架构开发方法（ADM）、ADM指南和技术、内容框架、企业连续体和工具、TOGAF参考模型、架构能力框架"}, {"name": "ADM 全生命周期阶段（10个）：阶段核心活动预备阶段定义组织架构、原则和工具需求阶段识别、保管、交付需求架构愿景确定范围、创建架构愿景业务架构开发基线与目标业务架构 等"}, {"name": "SOA 定义：广义是新的组织应用和IT基础架构，可实现离散系统互连；狭义是软件架构，可通过网络对松散耦合的粗粒度应用组件进行部署、组合和使用"}, {"name": "SOA 设计原则：明确的接口定义、自包含与模块化、粗粒度、松耦合、互操作性等"}, {"name": "⭐软件工厂构成：专业人员、基础设施和硬件、工具和技术、流程规范和方法论、质量管理。"}, {"name": "敏捷交付关键实践：采用敏捷开发方法、使用用户需求和产品回溯日志、迭代开发、自动化测试、持续集成和持续交付、关注产品质量和用户反馈、团队协作和沟通、可视化和透明度"}, {"name": "流水线作业内容：环节划分、任务定义、流转规则、并行处理、自动化支持、监控和优化"}, {"name": "安全可靠保障措施：安全开发实践（安全需求分析等）、数据和隐私保护（数据加密等）、持续集成和持续交付、团队安全培训和安全意识"}, {"name": "组织建设策略：确定组织结构、制定明确岗位和职责、设计有效流程和规范、优化沟通渠道和协作工具、培养领导力和团队文化、定期评估和改进"}, {"name": "资源部署策略：项目规划和优先级、人员分配和技能匹配、工作量估计和调整、工具和设备支持、项目管理和协调、优先级和变更管理"}, {"name": "业务管理模块：项目管理模块、资源管理模块、质量管理模块、绩效管理模块、沟通与协作模块、数据分析与报告模块"}, {"name": "体系保障内容：建立质量管理体系、制定流程规范、合理资源配置、实施质量控制、持续改进、完善文档和记录体系"}, {"name": "软件开发组织应用：嵌入式软件开发（建立规范化流程等）、桌面应用软件开发（配置适合的集成开发环境等）、Web应用软件开发、移动应用软件开发"}, {"name": "软件项目交付内容：发布管理（安全流程与规范等）、安全性检查（病毒扫描等）、事件响应计划；发布后运营包括安全监控、安全运营、风险评估、应急响应、升级与变更管理、服务与技术支持、运营反馈。"}]}, {"name": "笔记补缺 · 第 6 章", "children": [{"name": "云资源规划的重要性和目标：提高效率（避免资源浪费和过度购买，避免瓶颈和性能问题）、降低成本（优化资源配置，精确预测和控制成本）、确保可扩展性（满足业务增长需求，防止过度或不足投入） 等"}, {"name": "云资源规划的关键要素：业务需求分析（确定目标、预测需求等）、资源评估和规划（确定资源数量、类型等）、预算管理（制订计划、预测成本等）、安全和合规性（确保数据保护等） 等"}, {"name": "云资源规划的基本流程：需求收集（理解业务目标、收集数据等）、资源评估和规划（评估当前使用情况、预测需求等）、预算管理（制订计划、评估定价等）、设计与实施（设计架构、选择提供商等） 等"}, {"name": "云计算服务类型（按部署划分）：公有云：第三方提供商提供，通过互联网使用，核心属性是共享资源服务，优势是成本低、扩展性o好。私有云：为单个客户构建，提供对数据等的有效控制，核心属性是专有资源池 等"}, {"name": "⭐云计算外部特征：可靠性和可用性（部署冗余系统，确保服务持续）、安全性（采用多层次安全措施，保护数据和应用）、网络连接性（提供高速可靠连接，保障访问和传输）、成本效益（按需分配资源 等"}, {"name": "⭐计算资源的形态：虚拟机（仿真计算环境，有独立操作系统等）、容器（轻量级虚拟化技术，打包应用及依赖）、裸金属（物理机形态，面向高性能需求场景）、GPU（高性能图形处理器，用于并行计算等） 等"}, {"name": "计算资源规划的范围：硬件资源规划（确定规格、数量等）、虚拟化（划分虚拟资源池，动态分配资源）、容器化（提供独立运行环境，便于部署和移植）、弹性扩展和负载均衡（动态调整资源，分配请求优化性能） 等"}, {"name": "⭐计算资源规划的方法和技术：容量规划（基于历史数据和趋势分析预测需求）、性能优化（调整资源分配等提高系统性能）、负载均衡（分布工作负载到多个资源，提高效率）、弹性伸缩（动态调整资源应对负载变化） 等"}, {"name": "存储资源规划的内容：存储类型选择（根据访问模式等选择块存储等类型）、存储容量规划（分析数据量和增长趋势确定容量）、数据备份和冗余（选择备份机制等确保安全可靠） 等"}, {"name": "存储资源规划的关键过程：收集需求（获取数据量等信息）、分析和评估需求（预测增长趋势等）、技术选择（根据需求选择存储技术）、架构设计（确定设备布局等）、安全规划（制定加密等策略） 等"}, {"name": "云数据中心规划的目标：可靠性和可用性（采用冗余设计等保障连续性）、可扩展性（适应用户需求增长）、性能和效率（优化架构等提升性能）、安全和合规性（确保数据安全等）"}, {"name": "云数据中心设计原则：可用性和冗余性（冗余电源等降低故障风险）、弹性和可扩展性（弹性分配资源等）、性能优化（优化网络等提供高性能服务）、安全和隐私（物理安全等保护数据） 等"}, {"name": "云数据中心五大要素：面向服务（以服务为导向提供资源）、资源池化（整合资源形成统一资源池）、高效智能（基于虚拟化等技术实现高效处理）、按需供给（动态供给资源满足需求）、低碳环保（实现绿色节能目标）"}, {"name": "云数据中心网络架构设计要素：良好的可扩展性（容纳更多设备）、多路径容错能力（路径多样性应对故障）、低时延（满足实时服务需求）、高带宽网络传输能力（保证大数据传输）、模块化设计（降低扩展复杂度） 等"}, {"name": "常用虚拟化技术：硬件仿真技术（仿真硬件供客户机使用）、全虚拟化技术（呈现与真实硬件相同的环境，兼容性好）、半虚拟化技术（暴露修改过的硬件抽象） 等"}, {"name": "云数据中心建设项目分类：建筑工程（机房楼等土建及装饰等工程）、机房空调与配电工程（防静电地板等工程）、供电系统工程（列头配电等工程）、机房工艺工程（服务器机柜等相关工程）"}, {"name": "新基建背景下数据中心产业发展：新基建包括5G基站建设等七大领域；数据中心向超大规模发展，需优化骨干网络；应加强统筹协调，各地因地制宜布局（热点城市保障基本需求，区域中心城市部署大中型数据中心 等"}, {"name": "云资源规划面临的挑战及趋势：多云和混合云环境（统一管理跨平台资源）、自动化和智能化（自动分配资源等）、弹性和可扩展性提升（快速调整资源）、绿色和可持续发展（注重能源效率等） 等"}]}, {"name": "笔记补缺 · 第 7 章", "children": [{"name": "信息网络系统一般体系框架组成：网络传输平台（负责数据传输，含传输、路由等设备）、网络和应用服务平台（负责网络管理和业务应用处理，含DNS等系统）、安全服务平台（负责安全防护，含加解密等） 等"}, {"name": "OSI 七层模型（自下而上）：层级核心功能关键技术/协议物理层定义物理硬件接口（机械、电气特性），传输原始比特流光纤、双绞线、无线信道、网卡将比特流组织为帧，实现MAC寻址、差错控制、流量控MAC地址 等"}, {"name": "TCP/IP 协议族层级（自上而下）：应用层（含Telnet等协议）、传输层（含TCP、UDP协议）、网络层（含IP等协议）、数据链路层（含ARP等协议）"}, {"name": "IPv4 与 IPv6协议对比：特性IPv4IPv6地址长度32位（点分十进制，如192.168.1.1）128位（冒分十六进制 等"}, {"name": "⭐网络传输媒介：有线（光纤、双绞线、同轴电缆等）、无线（长波、中波、短波、超短波、微波等）"}, {"name": "网络传输技术：基于光纤的SDH、PDH、DWDM等；基于同轴电缆的HFC；基于无线的Wi-Fi、DMC、VSAT、5G等"}, {"name": "路由类型：直连路由（自动获取）、静态路由（手动配置）、动态路由（如OSPF链路状态协议）"}, {"name": "交换技术：二层交换（基于MAC地址）、三层交换（兼具路由功能）"}, {"name": "有线接入技术：Modem、ADSL、HDSL、CableModem、PON（含EPON、GPON10G-PON、）；无线接入技术：Wi-Fi、蓝牙等"}, {"name": "常见网络拓扑结构：总线（所有节点连在总线，链路少但稳定性差）、星形/双星形（辐射点连接其他节点，经济性好，双星形提高安全性）、树状（星形扩展，用于接入网等）、环形（节点首尾相连，稳定性高） 等"}, {"name": "运营商网络架构：由全国骨干网、省级骨干网、城域网和接入网组成"}, {"name": "城域网三层架构：核心层（部署核心路由器）、汇聚层（部署汇聚交换机）、接入层（提供各类接入方式）"}, {"name": "企业广域网架构：中小型企业网较简单，大中型企业网一般分核心层、汇聚层、接入层"}, {"name": "主要广域网技术：MPLS（基于标签进行路由和转发，支持多种应用）、VPN（在公有网络构建专用网络，含隧道等技术）、VLAN（划分虚拟网段，隔离流量）、VXLAN（支持更多网段 等"}, {"name": "广域网规划主要内容：建设背景（明确规划原因和目标）、需求分析（汇总功能、业务等需求）、项目预算（含设备、线路等费用）、技术方向（考虑性能、成熟度等）、网络拓扑结构设计（物理和逻辑设计） 等"}, {"name": "局域网组成：计算机设备（服务器、工作站）、网络连接设备（网卡、交换机等）、网络传输介质（光纤等）"}, {"name": "局域网结构类型：多层级结构（大型局域网，分核心层、汇聚层、接入层）、二层结构（中型局域网，核心层-汇聚层）、星形结构（小规模局域网）"}, {"name": "⭐VLAN 划分方法：按端口（简单但用户移动需重新配置）、按MAC地址（用户移动无需重配置，适用于小型网）、基于网络层协议（跨越多个交换机，效率低）、根据IP组播（扩大到广域网，效率不高） 等"}, {"name": "4G 移动通信优势：高速率、高容量（下行最高100Mb/s）、网络频谱宽、智能性能高、兼容性好、通信质量高且安全"}, {"name": "4G 网络架构：EPC核心网（含MME、S-GW等）、E-UTRAN（eNB组成）、用户设备"}, {"name": "5G 网络架构：含用户设备、接入网、应用功能、数据网络及多种核心网功能（AMF、SMF等）"}, {"name": "无线局域网组成：无线接入点（AP，分瘦AP和胖AP）、无线控制器（AC，管理瘦AP）"}, {"name": "无线局域网架构：按AP与AC通信层级分二层和三层组网；按AC位置分直连和旁挂组网；按流量转发方式分直接转发和隧道转发"}, {"name": "无线网规划重点：无线频率规划（降低干扰，提高效率）、覆盖范围规划（结合物理环境和技术特性）、容量规划（测算用户和业务需求）、基站站址规划（考虑多因素选位）、组网规划（确定策略和方案）"}, {"name": "⭐网络管理五大功能（ISO 定义）：故障管理（检测和定位故障）、配置管理（优化网络运行）、性能管理（监测设备运行状况）、计费管理（记录资源使用）、安全管理（保障网络安全）"}, {"name": "网络管理系统架构：网元/网络层（含被管理设备，基于MIB和SNMP）、管理应用层（实现五大功能及附加模块）、表示层（提供人机交互界面）。"}, {"name": "网络安全重点：网络结构合理性、访问控制（部署设备和规则）、入侵防护（监控攻击）、安全审计（日志管理）"}, {"name": "网络安全设备和手段：防火墙（边界访问控制）、VLAN安全域划分、IDS/IPS（监控攻击）、SOC（日志管理分析）"}, {"name": "安全管理内容：安全组织和责任、风险管理、应急处理、容灾备份、系统上线和运维方案"}, {"name": "机房建设内容：机房装修、空调系统、电气系统、接地和防雷系统、消防系统、环境监控系统、节能降耗系统"}, {"name": "机房监控对象：动力设备、环境设施、消防设施、安防设施、网络设备等"}, {"name": "机房节能降耗措施：选址考虑节能、合理设计机房密封和气流组织、设备节能、智能调节制冷等。"}]}, {"name": "笔记补缺 · 第 8 章", "children": [{"name": "数据的定义：对客观事物的性质、状态，以及相互关系等进行记载的物理符号或物理符号的组合"}, {"name": "数据、信息、知识、智慧的关系：数据是信息的源泉，信息是知识的“子集或基石”，知识是智慧的基础和条件；从数据到信息到知识再到智慧，是从低级到高级的认识过程"}, {"name": "数据资源的特征：无形性与可复制性、非竞争性与弱排他性、时效性、依附性、垄断性"}, {"name": "数据资源的发展阶段：数据资源化（将原始数据开发为有序、有价值的数据资源）、数据资产化（形成可供应用或交易的数据产品）、数据资本化（赋予金融属性，实现社会化配置）"}, {"name": "数据资源规划的定义：对企事业单位或政府部门的数据从产生、获取，到处理、存储、传输和使用的全面规划，是信息化建设的基础工程"}, {"name": "数据资源规划的作用：提质增效、缓解“数据孤岛”问题、促进标准化与共享、推动市场化发展"}, {"name": "⭐数据架构的定义：数据管理的基础，能有效地存储和使用数据，对企业数据进行结构化、有序化治理，让数"}, {"name": "数据架构的目标：数据的存储和处理需求，设计满足企业当前和长期的数据需求的结构和规划，包括利用新兴技术、转换业务需求、管理复杂数据等"}, {"name": "⭐表现形式：二维矩阵（展示数据创建和使用）、数据流图（直观展示，可扩展至细层级）"}, {"name": "驱动因素：技术发展与进步、业务量快速增长、业务需求变化、法律法规变化"}, {"name": "集中式数据架构：数据集中存储和管理在中央数据仓库，特点是数据集中存储、处理集中、安全性高，适用于数据量较小场景"}, {"name": "分布式数据架构：数据分布式存储在多个节点，提高可靠性、可扩展性和高效性，适用于数据量大的场景"}, {"name": "数据湖架构：集中存储区，存储结构化、半结构化和非结构化原始数据，特点包括储存原始数据、无模式或灵活模式、可扩展等，组件含存储层、数据管理工具等"}, {"name": "云原生数据架构：在云环境下设计，利用云计算和容器化技术，采用微服务体系结构，目标是高可扩展性、高可用性等"}, {"name": "数据应用架构：基于微服务模式，通过数据API服务系统连接数据与应用程序，API包括WebAPI、RESTfulAPI等"}, {"name": "标准分类：指导标准（与标准制定、应用相关）、通用标准（数据类、服务类、管理与建设类）、专用标准（满足特定领域需求）"}, {"name": "通用标准中的数据类标准：包括元数据、分类与编码、数据内容等标准，用于规范数据采集、建库、共享等"}, {"name": "元数据的定义：关于数据的数据，是结构化数据，描述数据的内容、地址、时间覆盖范围等，是数据与用户间的桥梁"}, {"name": "元数据的结构：内容结构（构成元素及定义）、句法结构（格式及描述方式）、语义结构（元素描述方法）"}, {"name": "⭐数据元的组成：由对象类（事物集合）、特性（对象类共有的性质）、表示（值域、数据类型等组合）三部分组成"}, {"name": "数据元的命名规则：语义规则（含对象类、特性、表示术语）、句法规则（术语顺序）、唯一性规则（名称唯一）"}, {"name": "数据元定义的编写规范：具有唯一性、准确不含糊、阐述基本含义、用描述性短语或句子、简练等"}, {"name": "数据分类的基本原则：稳定性（基于最稳定本质特性）、系统性（按内在规律排列）、可扩充性（留有余地）、综合实用性（符合需求）、兼容性（遵循标准）"}, {"name": "数据编码的基本原则：唯一性（一码对应一对象）、匹配性（与分类体系匹配）、可扩充性（留备用码）、简洁性（结构简单）"}, {"name": "数据治理的定义：在管理数据资产过程中行使权力和管控，包括计划、监控和实施，确保数据按制度和最佳实践管理"}, {"name": "数据质量管理的原则：关注重要数据、覆盖全生命周期、注重预防、修正根因、依托治理、标准驱动等"}, {"name": "数据质量活动：定义高质量数据、制定战略、识别关键数据和业务规则、执行初始评估、确定改进方向、定义目标、开发和部署操作"}, {"name": "数据安全的定义：包括规划、建立与执行安全策略和过程，为数据资产提供身份验证、授权、访问和审计等保护"}, {"name": "数据安全要求来源：利益相关方需求、政府法规、特定业务关注点、合法访问需求、合同义务。"}, {"name": "数据安全的原则：协同合作、企业统筹、主动管理、明确责任、元数据驱动、减少接触以降低风险"}, {"name": "数据安全活动：识别需求、制定制度、定义细则、评估风险、实施控制和规程（涵盖访问管理、角色分配等）。"}]}, {"name": "笔记补缺 · 第 9 章", "children": [{"name": "信息安全的定义：信息系统（包括硬件、软件、数据、人、物理环境及其基础设施）受到保护，不受偶然的或者恶意的原因而遭到破坏、更改、泄露，系统连续、可靠、正常地运行，信息服务不中断 等"}, {"name": "信息安全的基本属性：保密性（信息为授权者享用）、完整性（信息传输过程未被非法篡改）、可用性（信息和系统随时为授权者服务）、可控性（管理者可实施必要控制）、不可否认性（信息行为可追溯）"}, {"name": "常见安全威胁类型：信息泄露、破坏信息的完整性、拒绝服务、非法使用、窃听、业务流分析、假冒、旁路控制、授权侵犯、特洛伊木马、陷阱门、抵赖、重放、计算机病毒、人员渎职、媒体废弃、物理侵入、窃取 等"}, {"name": "⭐信息安全规划的原则：系统性（整体、全面、体系化）、适用性（与企业环境融合衔接）、时效性（分短期、中长期、远景规划）、确定性（内容明确无歧义）、可行性（措施可落地）、易用性（各层级人员可操作） 等"}, {"name": "⭐信息安全组织体系组成：信息安全的最高管理层（治理者和执行管理者）、协调机构（最高管理层和各部门负责人）、内部组织（主管部门与配合部门）、外部联系（与消防部门等外部组织保持联系）"}, {"name": "身份认证技术：包括虚拟身份电子标识、静态密码、智能卡、短信密码、动态口令、USBKey、生物识别、双因素认证、Infogo认证、虹膜认证"}, {"name": "入侵检测系统：依照安全策略监视网络、系统运行状况，发现攻击企图等，分为实时入侵检测和事后入侵检测"}, {"name": "防病毒策略准则：拒绝访问能力、病毒检测能力、控制病毒传播的能力、清除能力、恢复能力、替代操作"}, {"name": "数据加密技术：分为对称加密（加密和解密用相同密钥，如DES算法）、非对称加密（用公钥加密、私钥解密，如RSA算法）；还包括链路加密、节点加密和端到端加密等"}, {"name": "安全培训与意识提升内容：基础知识培训、操作规范培训、模拟演练培训、持续宣传教育"}, {"name": "应急响应计划：包括制定应急响应策略、建立紧急联系渠道、制定应急响应流程、进行应急演练、建立应急响应报告和记录"}, {"name": "事后总结与改进步骤：收集数据和信息、分析和评估、制定改进措施、实施改进措施、监控和评估改进效果"}, {"name": "信息安全规划典型步骤（以 A 公司为例）：步骤一：现状调研与需求分析（明确战略目标、开展现状分析等）。o步骤二：总体架构与蓝图设计（构建总体架构和基础架构等）。o步骤三：项目规划与实施设计（分析差距 等"}]}, {"name": "笔记补缺 · 第 10 章", "children": [{"name": "云原生的定义（CNCF2018 年）：①基于容器、服务网格、微服务、不可变基础设施和声明式API构建的可弹性扩展的应用；②基于自动化技术构建具备高容错性、易管理和便于观察的松耦合系统 等"}, {"name": "云原生架构：基于云原生技术的一组架构原则和设计模式的集合，旨在最大化剥离云应用中的非业务代码部分，让云设施接管大量非功能特性（如弹性、韧性等），具备轻量、敏捷、高度自动化的特点"}, {"name": "⭐云原生代码组成：业务代码（实现业务逻辑）、三方软件（依赖的三方库）、处理非功能特性的代码（实现高可用等非功能性能力）"}, {"name": "云原生架构的关键变化：代码结构巨大变化（云服务简化开发）、非功能性特性大量委托（云解决分布式非功能性问题）、高度自动化的软件交付（容器标准化交付）"}, {"name": "可观测原则：主动通过日志、链路跟踪和度量等手段，使服务调用细节可见，助力关联分析和优化"}, {"name": "韧性原则：软件抵御依赖组件异常的能力，核心是提升平均无故障时间，包括服务异步化、限流降级等多种架构设计"}, {"name": "所有过程自动化原则：通过IaC、GitOps等实现软件交付和运维自动化，标准化过程并适应环境差异"}, {"name": "分布式事务模式：包括XA（强一致性但性能差）、基于消息的最终一致性（高性能但通用性有限）、TCC（侵入性强）、SAGA（补偿事务）、SEATA的AT模式（高性能但有场景限制）"}, {"name": "可观测架构模式：包括Logging（详细信息跟踪）、Tracing（调用链路跟踪）、Metrics（量化度量），需定义清晰的SLO"}, {"name": "事件驱动架构模式（EDA）：应用/组件间的集成模式，事件有Schema和QoS保障，适用于服务解耦、数据变化通知等场景"}, {"name": "云原生架构优势：高可扩展性（微服务独立部署扩展）、高可用性（分布部署实现负载均衡和容错）、灵活性（支持不同技术栈）、安全性（容器隔离减少漏洞风险）、成本效益（降低运维成本） 等"}, {"name": "⭐云原生建设规划实施路线图（5 个步骤）：微服务采用及运行环境容器云平台构建：构建基于Kubernetes的容器云平台，以12要素和DDDo等方法设计微服务 等"}, {"name": "⭐某快递公司云原生转型方案：引入云原生数据库（拆分在线与离线数据）、应用容器化（解决环境一致性问题）、微服务改造（按业务域拆分，降低维护难度）。架构确立"}, {"name": "架构组成：基础设施（裸金属服务器）、流量接入（云DNS及PrivateZone，借助Ingress实现域名转发）、平台层（基于Kubernetes的PaaS平台 等"}, {"name": "应用效益：成本方面（按需付费，节省运维成本）、稳定性方面（高SLA保障，数据异地备份）、效率方面（缩短持续集成流程，简化问题排查）、赋能业务方面（利用云上组件节省技术成本）。"}]}, {"name": "笔记补缺 · 第 11 章", "children": [{"name": "⭐IT 治理的驱动因素：确保IT投资有效性、IT价值弹性大、IT融入各领域、新兴技术带来机会、推动IT价值挖掘、需良好价值管理、管理层幅度有限、成熟组织的实践效果"}, {"name": "IT 治理的内涵：①组织上层管理的有机组成部分；②强调数字目标与组织战略一致；③保护利益相关者权益，管理风险等；④是一种制度和机制；⑤包含管理层、组织结构等多方面"}, {"name": "IT 治理的管理层次：最高管理层（证实战略一致性等）、执行管理层（制定IT目标等）、业务与服务执行层（提供信息和数据服务等）"}, {"name": "IT 治理体系的构成：IT定位、IT治理架构、IT治理内容、IT治理流程、IT治理效果（内外评价）"}, {"name": "⭐建立 IT 治理机制的原则：简单（明确责任和目标）、透明（程序正式且清晰）、适合（鼓励合适的人做决策）"}, {"name": "信息技术服务标准（ITSS）：GB/T34960.1《信息技术服务治理第1部分：通用要求》：规定IT治理模型和框架等，可用于建o立体系 等"}, {"name": "信息和技术治理框架（COBIT）：面向整个组织的信息和技术治理及管理框架，区分治理和管理，包含40项核心治理和管理目标。治理目标：评估、指导和监控（EDM），由董事会和执行管理层负责；"}, {"name": "IT 审计的主流定义（举例）：国际信息系统审计协会（ISACA）：获取并评价证据，判断计算机系统是否保证资产安全、数据完o整、有效利用资源及实现组织目标的过程。GB/T34690.4：根据IT审计标准 等"}, {"name": "IT 审计的范围：总体范围（据目的和成本确定）、组织范围（涉及的组织机构等）、物理范围（具体地点与边界）、逻辑范围（涉及的信息系统等）"}, {"name": "对 IT 审计人员的要求：职业道德（独立、客观等）、知识技能（IT专业知识等）、专业胜任能力（相应资格等）、利用外部专家服务（评价专家等）"}, {"name": "IT 审计依据与准则（国际举例）：信息系统审计准则（ISACA）、《内部控制——整体框架》（COSO）、《萨班斯法案》（SOX）、COBIT"}, {"name": "IT 审计依据与准则（国内举例）：法律法规（《审计法》等）、审计准则（《信息系统审计指南》等）、标准（GB/T34960.4等）"}, {"name": "IT 审计常用方法：访谈法（面对面交谈）、调查法（书面或口头收集资料）、检查法（审查记录和文件等）、观察法（实地察看）、测试法（跟踪业务检验系统）、程序代码检查法（审查程序指令）"}, {"name": "IT 审计技术：风险评估技术：风险识别（德尔菲法等）、风险分析（定性和定量）、风险评价（单因素和总体）、o风险应对（云计算等）。审计抽样技术：统计抽样（客观确定样本量等，如属性抽样 等"}, {"name": "⭐审计证据的特性：充分性（数量要求）、客观性（客观事实）、相关性（与审计事项相关）、可靠性（反映真实情况）、合法性（符合法定要求）。"}, {"name": "审计工作底稿分类：综合类（审计计划等）、业务类（符合性测试记录等）、备查类（对审计仅具备查作用）"}, {"name": "广义审计流程阶段：审计准备（明确目的等）、审计实施（调查并调整计划等）、审计终结（整理底稿等）、后续审计（检查纠正措施）"}, {"name": "审计准备阶段工作：明确审计目的及任务、组建审计项目组、搜集相关信息、编制审计计划等"}, {"name": "审计实施阶段工作：深入调查并调整审计计划、了解并初步评估IT内部控制、进行符合性测试、进行实质性测试等"}, {"name": "审计终结阶段工作：整理与复核审计工作底稿、整理审计证据、评价相关IT控制目标的实现、判断并报告审计发现、沟通审计结果、出具审计报告、归档管理等"}, {"name": "IT 内部控制审计内容：组织层面IT控制审计：对IT战略、组织、架构等进行审计。oIT一般控制审计：针对与应用系统、数据库等相关的策略和措施进行审计。o应用控制审计：针对业务流程层面的程序进行审计 等"}, {"name": "IT 专项审计内容（举例）：信息系统生命周期审计：对规划、设计、开发等进行审计。o网络与信息安全审计：围绕安全相关的组织、人员等，关注流程、制度执行等。o数据审计：定期分析、验证等数据安全管理相关的政策 等"}]}, {"name": "笔记补缺 · 第 12 章", "children": [{"name": "服务规划设计流程：客户结合服务目录提出服务级别需求，服务供方进行服务级别设计，形成服务级别协议、运营级别协议和支持合同"}, {"name": "服务目录的定义：服务供方为客户所提供服务的集中信息来源，定义了服务的全部种类和目标，确保客户了解服务范围、内容及细节"}, {"name": "⭐信息安全需求核心：机密性（仅授权访问）、完整性（防止未授权修改）、可用性（协议时间内可获取）"}, {"name": "服务级别协议（SLA）：服务供方与客户就服务质量、性能等达成的双方认可协定，是合法文档，包含当事人、条款等内容"}, {"name": "支持合同（UC）：服务供需双方签订的正式合同，含SLA内容及法律责任、权利和义务"}, {"name": "服务模式分类：远程服务：远程集中监控（实时监控系统，异常处理）、远程技术支持（电话等方式处理故障）。o现场服务：上门技术支持（远程无法解决时上门）、驻场技术支持（专人常驻现场响应需求）。o"}, {"name": "⭐主要岗位及职责：管理岗：管理服务需求及过程结果，建立与需方沟通机制，如服务总监、服务项目经理、质量经理。o技术支持岗：提供技术支持，需具备专业技术能力和响应能力，如主机工程师、网络工程师 等"}, {"name": "人员绩效方案设计：确定绩效指标、明确考核信息来源、制定计算方法、定义考核周期、设计考核策略"}, {"name": "服务台设计要点：设置专门沟通渠道、专人负责服务请求、整合服务过程并建立管理制度"}, {"name": "备件及备件库设计要点：备件响应方式和级别定义、备件供应商管理、备件出入库管理、备件可用性管理"}, {"name": "知识库设计要点：建立常见问题解决方案、确保知识可用可共享、具备知识增删改查功能等"}, {"name": "技术要素设计考量：技术研发（估算成本、编制预算）、发现问题的技术（制定监控指标及阈值表等）、解决问题的技术（制定标准操作流程等）"}, {"name": "供应商关系管理活动：供应商选择/推荐、审核及管理、供应商间协调、争议处理、支持合同管理"}, {"name": "增值服务原则：不影响现有协议内容、贴合客户需要、投入在可接受范围、有能力引申"}, {"name": "服务营销过程阶段：启动准备阶段（营销准备、营销计划）、调研交流阶段（需求调研、编写解决方案）、能力展示阶段（产品展示、持续沟通）、服务达成阶段（达成服务协议、持续服务）"}, {"name": "⭐服务成本构成：直接人力成本（劳动报酬、社保规费、福利）、直接非人力成本（办公费、差旅费、培训费、业务费、采购费、租赁费等）、间接人力成本（非项目组人员费用分摊） 等"}, {"name": "服务成本度量考虑因素：服务对象规模、单位工作量、调整因子（服务要求、能力、对象和业务特征）"}, {"name": "服务项目预算内容：识别收入项与开支项、划分执行阶段、形成预算表。"}, {"name": "服务项目核算目的：掌握收支及盈亏状态、调整资源分配、改进成本控制方法等"}, {"name": "衡量项目收益的指标：投入产出比、投资回报率、项目净产出、人均产出"}, {"name": "⭐服务终止阶段会议：服务终止计划编制会议（形成书面计划）、服务终止计划评审会议（明确责任和任务分配）、移交会议（移交文件、知识、技能、基线、模拟环境等）、经验交流会（表明项目正式结束 等"}, {"name": "资源回收内容：文件归档（项目文档保存）、财务资源回收（撤销项目账目编码）、人力资源回收（团队成员回归原部门）、基础设施资源回收（设备或工具回收）"}, {"name": "信息处置方式：信息转移和清除（按所有权处理信息资产）、存储介质清除或销毁（防止敏感信息泄露）"}, {"name": "服务测量目标：监视、测量并评审服务及管理目标完成情况，分析与计划的差距，为改进提供依据"}, {"name": "服务测量活动：服务人员测量（培训、绩效等）、服务资源测量（工具、服务台、备件库、知识库）、服务技术测量（研发成果等）、服务过程测量（服务级别分析等）"}, {"name": "⭐服务改进活动：服务改进设计（定义目标、识别输入等）、服务改进实施（人员、资源、技术、过程要素改进）、服务改进验证（检查项目、提交报告）。"}]}, {"name": "笔记补缺 · 第 13 章", "children": [{"name": "人力资源管理目标：①建立员工招聘和选择体系，获得符合组织需要的员工；②挖掘员工潜能，服务组织发展和员工事业需求；③留住有效员工，淘汰不符合需求的员工；④确保遵守人力资源相关法律法规等"}, {"name": "工作分析作用：支持招聘和选择员工、发展和评价员工、制定薪酬政策、优化组织与岗位设计"}, {"name": "工作分析过程：明确范围（确立目的、确定对象）、确定方法（确定信息类型等）、收集和分析信息（收集、分析、报告结果等）、评价方法（以收益等为标准评价）"}, {"name": "⭐岗位设计内容：工作内容设计（广度、深度、完整性、自主性、反馈性）、工作职责设计（责任、权利、方法、沟通机制）、工作关系设计（协作、监督关系）"}, {"name": "岗位设计方法：传统科学管理方法、人际关系方法、工作特征模型、高绩效工作体系"}, {"name": "戴尔和霍德的人力资源战略模式：诱因战略（控制成本、明确职责等）、投资战略（重视培训、储备人才等）、参与战略（鼓励员工参与管理等）"}, {"name": "巴伦和克雷普斯战略模式：内部劳动力市场战略（层级分明，内部晋升为主，提供工作保障）、高承诺战略（扁平化组织，基于成果的薪酬，保持合理流动率）、混合战略（结合内部晋升与成果导向考核）"}, {"name": "⭐人力资源供需失衡解决：需求超过供给（增加录用、提高员工效率等）；供给超过需求（减少工作时间、鼓励提前退休等）"}, {"name": "人力资源计划评价：考虑计划目标合理性（计划者熟悉程度等）、对比行动结果与计划"}, {"name": "招聘过程环节：招聘计划制订、招聘信息发布、应聘者申请、人员甄选与录用、招聘评估与反馈"}, {"name": "⭐常见招聘渠道：内部来源（内部公告，激励现有员工）；招聘广告（快速传播，成本低，可发布多岗位信息）；职业介绍机构（适合招聘量少、关键岗位急聘）；猎头组织（专注高级人才，接触在职优秀者） 等"}, {"name": "录用筛选方法：背景调查、录用测试（能力测试等）、建立录用标准（补偿性原则等）"}, {"name": "面试程序：面试前准备（明确目的等）、实施面试（了解申请人能力等）、评估面试结果（检查记录等）"}, {"name": "面试类型：非结构化面试、半结构化面试、结构化面试"}, {"name": "招聘效果评估维度：招聘周期、用人部门满意度、招聘成功率、招聘达成率、招聘成本"}, {"name": "员工培训步骤：评估培训需求、设定培训目标、设计培训项目、实施和评估培训"}, {"name": "培训类型：入职培训（消除新员工焦虑等）、员工在职培训（提升工作绩效等）"}, {"name": "培训内容分析：组织分析（确定组织范围内需求）、绩效分析（考察绩效偏离）、任务分析（确定所需技能等）"}, {"name": "⭐培训效果评估维度：反应（受训者对培训的感受）、学习效果（对内容的掌握程度）、行为变化（工作中应用所学的情况）、培训效果（对组织结果的积极影响）"}, {"name": "培训迁移影响因素：受训者特征（能力、个性、动机）、培训设计（学习目的、培训材料、内容、场地）、工作环境（管理者和同事支持、执行机会、技术支持、转化氛围）"}, {"name": "绩效改进步骤：分析考核结果找问题、制定改进方案、实施改进方案"}, {"name": "薪酬体系构成：外在薪酬（直接报酬如基本薪酬、绩效加酬；间接报酬如福利等）、内在薪酬（工作保障等）"}, {"name": "工作评价方法：非量化评价（工作排序法、工作分类法）、量化评价（因素比较法、点数法、海氏系统法）"}, {"name": "薪酬等级结构要素：薪酬等级数、目标薪酬、薪酬级差、薪酬幅度、薪酬重叠情况"}, {"name": "薪酬激励方式：操作人员（计件制）、销售业务人员（佣金制、底薪制等）、专业技术人员（加薪、非金钱奖励）、高级管理人员（基本薪酬、短期/长期奖励等）"}, {"name": "薪酬调整类型：薪酬水平调整（主动型、被动型；奖励性、生活指数性等）、薪酬结构调整（纵向等级调整、横向构成调整）"}, {"name": "职业道路要求：代表真实可能性、具有尝试性、灵活性、说明职位要求"}, {"name": "管理人员在职业规划中的责任：鼓励员工制定规划、评估目标现实性、辅导制定方案、跟踪并指导调整"}, {"name": "组织在职业规划中的责任：提供规划所需资源、提供培训、提供技能和在职培训"}, {"name": "组织在职业管理中的责任：为决策提供信息、更新信息、设计信息利用方法、监控评价过程。"}]}, {"name": "笔记补缺 · 第 14 章", "children": [{"name": "⭐标准化的基本原理：超前预防原理（从潜在问题中选取对象）、系统优化原理（从系统观点出发实现最优）、协商一致原理（标准建立在相关方协商基础上）、统一有度原理（在一定范围内统一特性） 等"}, {"name": "简化的原则和要求：压缩不必要多样化且防止过分压缩、以确定的时空范围为前提、保证满足一般需要、产品简化形成系列等"}, {"name": "产品系列化的内容：制定产品参数系列、编制产品系列型谱、开展产品的系列设计"}, {"name": "超前指标的预测对象：标准化对象的科学技术水平、需求量、生态指标、经济指标"}, {"name": "端到端流程的定义：从获取业务对象需求开始，到业务对象满意结束，以终为始、目标导向"}, {"name": "端到端流程的分级：组织级高阶流程（覆盖组织整体运作）、中阶流程（面向最终业务对象）、低阶流程（从属于中阶流程）"}, {"name": "组织流程的分类：战略流程（提供发展方向等）、运行流程（直接为业务对象创造价值）、支持流程（为运行流程提供支持）。"}, {"name": "保障流程管理有效执行的措施：理解流程是前提、做好变更后推广、新员工流程培训、找对执行负责人、流程审计及监控、固化到信息系统和制度中、流程文化宣导"}, {"name": "流程评价结果的应用：用于流程优化（明确优化方向）、绩效考核（反映管理水平）、过程控制（及时整改问题）、纠正措施（解决系统性问题）、战略调整（参考业务对象满意度关联结果）"}, {"name": "流程优化需求驱动因素：问题导向（如投诉、审计报告）、绩效导向（如目标对比、标杆分析）、变革导向（如战略调整、改革举措）"}, {"name": "项目化流程优化过程：包括立项、现状分析及诊断、目标流程及配套方案设计、IT方案设计与开发、新旧流程切换、项目关闭。"}]}, {"name": "笔记补缺 · 第 15 章", "children": [{"name": "⭐技术研发的目的：①通过研发成果提高系统服务效率和质量；②将相关技术应用到服务产品和工具中，丰富服务范围，推动组织服务发展"}, {"name": "技术研发的范围：与系统运行相关的技术研发：基础环境、硬件平台、安全技术等。o技术规范的研发：服务规范、服务提供规范。o发现与解决信息系统问题的技术研发：发现问题技术（监控、诊断工具 等"}, {"name": "技术研发的管理对象：研发团队、研发过程、研发成本、研发项目、研发绩效、研发风险"}, {"name": "技术研发的主要角色：技术研发决策负责人：承担技术研发总体决策，负责技术规划等。o技术研发需求负责人：负责需求调研和成果应用，提出研发需求等。o技术研发负责人：负责研发规划 等"}, {"name": "技术研发的管理过程：规划过程：确定研发目标、制定方案、分析可行性、形成立项报告等。o实施过程：制订实施计划，组织实施研发，产出成果。o监控过程：监控研发质量、成本和进度 等"}, {"name": "技术研发管理的条件：鼓励创新的环境、融入市场观念、明确研发策略"}, {"name": "各类研发管理内容：服务产品研发管理：包括定位（需方和业务拓展需求）、队伍（虚拟团队）、成果（服务目录等）。oIT服务规范研发管理：包括定位（服务产品化前提）、队伍（质量和技术专家） 等"}, {"name": "技术应用的管理要点：技术风险与机遇：分析风险并控制，识别有利和不利因素。o判断与选择：科学分析，识别困难及所需资源，分析实现条件。o技术验证：对高风险技术进行验证 等"}, {"name": "⭐SOP 标准操作规范的作用：保存技术经验、快速培训人员、树立服务形象、实现标准化作业等"}, {"name": "技术成果培训与知识转移：培训知识性成果（方法论）、工具类成果（监控工具），转移应急预案与解决方案手册"}, {"name": "技术成果演练或推演：定期演练应急预案（仿真演习）；推演（沙盘模拟，圆桌研讨改进）"}, {"name": "知识产权的定义：在科学技术、文学艺术等领域中，创造者对其创造性劳动成果依法享有的专有权，包括专利、商标、著作权等"}, {"name": "知识产权管理的需求：研发新技术、提高产品附加值、防范风险、提高经营效率"}, {"name": "知识产权管理机构职责：推进合规义务识别、提出合规建议、制定实施计划、统筹管理工作、参与重大项目布局等"}, {"name": "知识产权获取措施：制定获取计划、建立审核机制、管控专利质量、办理作品登记、确定商业秘密范围等"}, {"name": "知识产权维护要点：建立分类管理档案、处理权属变更与放弃、进行会计信息披露、分级管理等"}, {"name": "知识产权运用内容：实施和使用：调查实施场景，评估贡献，监控合规性。o许可和转让：制定方案，开展评估，履行审查程序。o投融资：开展尽职调查，评估风险和价值。o企业重组：合并/并购 等"}, {"name": "⭐知识产权管理评价内容：价值实现符合性、管理体系绩效、策划实施情况、合规监测结果、措施有效性等。"}]}, {"name": "笔记补缺 · 第 16 章", "children": [{"name": "软件配置管理工具：功能包括项目管理、版本管理和基线控制、增强的版本控制、流程控制和变更管理等，如Harvest、ClearCase等"}, {"name": "⭐自动化软件测试的四个阶段：自动化测试计划、设计、实施、执行。自动化测试常见工具主要有：单元测试工具、性能测试工具、功能测试工具。按照测试技术分类原则，自动化测试工具又可划分为白盒测试工具、黑盒测试工具 等"}, {"name": "研发测试环境部署步骤：硬件选取配置、操作系统安装配置、应用程序安装配置、数据库安装配置、测试工具和脚本准备"}, {"name": "研发测试环境维护要求：定期备份数据、更新软件和补丁、清理数据和日志、监控环境状态"}, {"name": "统一运维监控平台：整合多种资源，实现统一采集、监控、告警和展示，建设方式包括基于开源工具自主开发和定制商业化平台"}, {"name": "⭐操作自动化工具：Jenkins：持续集成自动化工具，支持自动构建、测试和部署，插件体系灵活。oChef：自动化IT工具，用于云计算等环境的部署和管理，支持多平台和大规模部署。o"}, {"name": "服务台工具：ServiceDeskPlus：集成IT服务管理、资产管理等功能，支持工作流自动化和多系统集成。oServiceHot：融入AI技术，提供自助服务门户，支持多种渠道提交请求 等"}, {"name": "备件管理功能：库存信息管理、备件维保服务生命周期管理、出入库审批流程、备件查询与追踪"}, {"name": "AIOps（智能运维）：利用大数据和AI技术，实现运维自动化和智能化，如嘉为蓝鲸智能运维解决方案、云智慧智能业务运维平台"}, {"name": "DevOps 工具：包括版本控制工具（如Git）、自动化构建工具（如Maven）、持续集成/交付工具（如Jenkins）等，提升软件交付速度和质量"}, {"name": "云管理工具：虚拟化云CloudOS工具：将硬件资源逻辑化，提升资源利用率。oCMP云管理工具：统一管理各类云资源和设备，包含资源管理 等"}, {"name": "⭐禅道：国产开源研发项目管理软件，集成产品、项目、质量管理等，支持敏捷、瀑布和看板模型"}, {"name": "Microsoft Project：协助项目经理制定计划、分配资源、跟踪进度等，支持多种视图和在线协作。项目管理工具的选择"}, {"name": "选择评估因素：团队规模、工作方式、业务需求、自定义和可扩展性、易用性、安全性、成本。"}]}, {"name": "笔记补缺 · 第 17 章", "children": [{"name": "项目的定义：为创造独特的产品、服务或成果而进行的临时性工作"}, {"name": "项目的临时性：有明确的起点和终点，项目可宣告结束的情况包括达成目标、无法达成目标等"}, {"name": "项目的独特性：即使元素相同，每个项目仍因需求、环境等不同而具备独特性"}, {"name": "有效项目管理的作用：达成业务目标、满足干系人期望、提高成功概率等"}, {"name": "项目管理不善的后果：超时、超支、质量低劣、范围失控等"}, {"name": "其他成功标准：完成效益管理计划、达到财务和非财务目标、干系人满意等"}, {"name": "⭐外部事业环境因素：市场条件、社会文化因素、监管环境、商业数据库、学术研究、行业标准、财务考虑物理环境"}, {"name": "治理框架：组织内行使职权的框架，包括规则、政策等"}, {"name": "管理要素：组织内部关键职能部门的组成部分，如部门、职权、职责等"}, {"name": "组织结构类型：常见类型有职能型、矩阵型（强/弱/均衡）、项目导向型等，各类型对项目的影响不同"}, {"name": "项目管理办公室（PMO）：对项目治理过程标准化，提供支持或直接管理项目，类型包括支持型、控制型、指令型。"}, {"name": "项目层面：领导团队、平衡制约因素、沟通协调"}, {"name": "行业、专业学科、跨领域层面：关注行业趋势、传递知识、宣传项目管理价值"}, {"name": "⭐创造价值的方式：提供新产品/服务、社会贡献、提高效率等"}]}, {"name": "笔记补缺 · 第 18 章", "children": [{"name": "发展起源：源于“智慧地球”概念，是应对城市人口增长、资源短缺等问题的对策，通过物联网、云计算等技术整合城市核心系统，提升城市运行效率和服务质量"}, {"name": "⭐政策环境：国家出台多项政策推动智慧城市发展，如《“十四五”国家信息化规划》《数字中国建设整体布局规划》等，强调分级分类推进、数据融合等"}, {"name": "社会环境：数字社会建设加快，互联网普及率高，智慧城市为居民、政府、企业提供便捷服务，得到社会各阶层支持"}, {"name": "技术环境：5G、物联网、大数据、云计算等技术不断优化，为智慧城市建设提供技术支撑"}, {"name": "涵盖领域：包括城市管理、应急管理、公共安全、基层治理、市场监管、市政管理、交通治理等。"}, {"name": "核心目标：通过信息技术创新治理模式，提高治理效率，优化政府、企业、社区等主体的协同能力"}, {"name": "基本原则：包括以人为本，增强用户体验；技术赋能，提升业务效率；规则重构，优化资源配置；多元创新，推进全局性转变；多方共建，提升城市竞争力等"}, {"name": "数字社会规划：聚焦公共服务、教育、医疗、社会治理、数字乡村等领域，推进社会数字化，提升居民生活便捷度和幸福感"}, {"name": "市场化生态：培育智慧城市相关市场业态，结合城市产业基础，促进技术创新、模式革新和管理创新"}, {"name": "人才队伍：保障主体组织单位、业务单位、创新领域等的人才需求，提升数字能力和融合创新能力"}, {"name": "核心业务场景：基于城市战略定位和特色，涵盖民生服务、城市治理、产业发展、生态宜居等领域，具有地域特色，可分为L1～L3三层业务架构"}, {"name": "结构组成：以应用系统为重点，结合业务和数据视角，设计应用域、应用组，明确新建、改造、利旧系统，涵盖民生服务、城市治理、产业发展等应用，实现系统集成和协同"}, {"name": "组成部分：包括城市总体数据模型（基础库、主题库、专题库等）、数据分布（政府数据、社会数据等宏观分布）、数据服务（数据交换共享、开发开放、交易等），支撑数据共享和业务协同"}, {"name": "⭐层级结构：包括感知层（物联感知、视频监控等）、数据层（数据汇聚、清洗、分析等）、平台层（共性平台、业务平台等）、应用层与展示层（面向用户的业务系统），遵循“集约建设、资源共享”原则"}]}, {"name": "笔记补缺 · 第 19 章", "children": [{"name": "国家相关政策：2012年科技部提出建设智慧园区，推广应用相关技术和产品；2017年科技部强调科技创新和制度创新双轮驱动；2020年国务院及国资委推动智慧园区与产城融合、国有企业数字化转型 等"}, {"name": "发展现状：区域分布：形成“东部沿海集聚、中部沿江联动、西部特色发展”的空间格局，环渤海、长三角、o珠三角为三大聚集区。建设特点：强调开放共建共享、服务均等化、发展特色化 等"}, {"name": "路径阶段：单项应用阶段（提升效率，体力替代）、平台化发展阶段（业务融合，数据价值挖掘）、全要素融合阶段（全要素聚合，场景智慧）"}, {"name": "政府投资类：由政府财政主导，适用于前期投资大、无明确商业价值的项目（如政务服务、公共安全等）"}, {"name": "政府和社会资本合作共建：如PPP模式，吸引社会资本，发挥双方优势，包括委托运营、BOT等多种运作方式"}, {"name": "招商引资：涉及产业定位（同步推动“城、产、学、研”融合）、招商目标（双向精准匹配）、优惠政策（智能推送）、服务价格（结合市场行情）、营销推广（定向筛选）、便捷运营（全流程线上服务）"}, {"name": "全程监管：包括信用体系打造（建立企业信用大数据管理等体系）、履约风险监测（引入区块链等技术，升级监测能力）"}, {"name": "资源赋能：涵盖园区资源规划（识别优劣势，动态感知）、资源分配（动态感知需求，调度资源）"}, {"name": "企业画像：基于企业全生命周期（注册、成长等），整合多源数据，刻画企业多维特征（注册资本、经营范围等）"}, {"name": "经营总览：整合企业经营、金融财政等数据，通过智能决策提供全局看板，预警风险，搭建信用评级模型"}, {"name": "智慧环保：构建智能化环境管理体系，包括环境监测（空气质量等指标）、节能减排（优化能源使用）、废物管理（分类回收）、环境预警（预测问题）"}, {"name": "智慧水务：提升水务管理效率，包括水资源环境评价预警（污染等级评估）、数据治理（监测指标采集）、管控应急一体化（监测预警、应急指挥）"}, {"name": "⭐综合安全：关注周界防范（入侵报警系统）、视频监控（实时监控、事后取证）、安全巡检（线上线下融合、AI辅助）"}, {"name": "生产经营配套：以云服务、“互联网+金融”等模式，统筹办公、能源、环保等配套，提升资源利用效率"}, {"name": "公共生活配套：涵盖园区内公共服务智能化、与城市资源融合、周边配套整合、一体化统筹规划"}, {"name": "精准集合营销：包括城市产业推介、园区企业展示、舆情治理、资讯精准推送"}, {"name": "各维度重点：产城融合：关注政务协同、专项治理等。o组织战略：包括战略管理、数字能力等。o运营管理：涉及招商管理、财务管理等。o产业服务：涵盖产业运行、营商环境等。o社群服务：包括培训服务 等"}, {"name": "基础设施集约化：统一规划建设，构建泛在感知网络，提供计算、存储等资源支撑"}, {"name": "运营管理精细化：整合多场景能力，实现系统信息交互、共享，形成高效运营管理体系"}, {"name": "园区服务平台化：围绕企业需求，打造全要素、全生命周期服务平台，提供数字化分析支持"}, {"name": "运维组织体系：成立运营管理中心，推动运维模式向统一、智能演进"}, {"name": "运维管理制度：建立涵盖设施、数据、人员等的各项管理制度，确保规范化"}, {"name": "运维考核指标：围绕交互、实施、结果质量建立指标，评价考核运维管理"}, {"name": "⭐主要应用：包括综合安防（集成传感器和数据采集子系统）、便捷通行（人员/车辆出入管理）、设施管理（设备状态监测、工单管理）、资产管理（包括档案管理、仓储管理、资产采购、维修、报废等记录） 等"}, {"name": "组成：提供数据湖（原始数据）、主题库（人员、设备等）、专题库（安防、能耗等），实现各异构系统数据集中管理，向上提供数据服务和计算能力接口"}, {"name": "建设内容：以数字孪生中枢为核心，实现用户、系统、信息交互，建设统一门户（内部门户和外部门户），提供多渠道访问和个性化服务。"}, {"name": "规划框架：“2-3-4”框架（2个所属空间、3个建设目标、4个基本特征）"}, {"name": "发展模式：产业生态创新、园区运营创新、标准体系创新，打造“一区多园”模式"}]}, {"name": "笔记补缺 · 第 20 章", "children": [{"name": "⭐产业发展现状：农村信息基础设施完善：2022年农村网民3.08亿，普及率61.9%。o县域差异化发展：各县立足特色 等"}, {"name": "问题及挑战：区域发展不平衡、标准化不足、人才和数字素养欠缺"}, {"name": "国外标准：ISO、ITU-T等在智慧农业、社区可持续发展等领域有相关研究；美国、英国、日本有各自模式"}, {"name": "国内标准：2022年《数字乡村标准体系建设指南》发布框架；农业农村部发布多项行业标准；多地成立地方标准化技术委员会并研制地方标准"}, {"name": "乡村新业态：智慧文旅、休闲农业、民宿经济、康养服务"}, {"name": "“互联网 + 医疗”：包括乡村医疗机构信息化、远程医疗，解决资源分布不均问题"}, {"name": "“互联网 + 养老”：提供居家养老、村社养老、医养结合等服务，提升老年人生活质量"}, {"name": "智慧党建：实现党务管理信息化、新媒体宣传、党员网络教育"}, {"name": "农业生态环境监测：涵盖土壤、氮磷流失、地膜残留、生物物种等监测"}, {"name": "山水林田湖草沙系统监测：建立自然资源数据库，监测治理水环境、林草等。"}, {"name": "农村人居环境及饮用水源监测：利用技术手段监测垃圾、污水、水质等"}, {"name": "提高治理精细化、智慧化水平：利用技术实现精准管理、法治治理、全流程治理"}, {"name": "新型基础设施技术：5G用于智慧农场等场景，无人机用于植保、灾害监测等"}, {"name": "⭐业务应用平台：包括生产管理、品牌营销、行业监管、公共服务数字化平台"}, {"name": "经验总结：激活数据价值、推进县乡一体、践行“最多跑一次”、调动群众自治、实现“数据治理”转型。"}]}, {"name": "笔记补缺 · 第 21 章", "children": [{"name": "技术突破应用：“5G+TSN/工业以太网+NB-IoT”等网络技术、多架构计算、人工智能、云边端协同等，为企业数字化转型提供工具和支撑"}, {"name": "基础设施升级：新型基础设施（信息、融合、创新类）和软性基础设施（智慧城市、国家大数据体系）为数字化转型提供保障"}, {"name": "国际方面：各国加速数字化转型政策布局，如德国构建产业生态、英国提供商业培训等"}, {"name": "财政金融方面：财政科技支出、创新补贴、税收优惠等缓解企业融资约束，降低创新成本，促进数字化转型"}, {"name": "自我提升驱动力：传统发展模式面临决策瓶颈、变革制约等问题，企业需通过数字化转型实现深层次变革，提升决策效率等"}, {"name": "关键场景：数字化管理（提升服务质量）、平台化设计（整合资源）、个性化定制（满足多样需求）、网络化协同（整合资源）、智能化生产（提高效率）、服务化延伸（拓展价值链）"}, {"name": "⭐组织：关注组织建设、转型战略、流程管理、变革管理 function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function renderText(s){
  // 口诀钩子标红：🔑后的引号内容
  return esc(s).replace(/(🔑[^"“]*["“][^"”]*["”])/g,'<span class="hook">$1</span>');
}
function build(node, depth){
  const wrap=document.createElement('div');
  wrap.className='node lv'+Math.min(depth,2)+(depth>2?' lv2deep':'');
  const label=document.createElement('div');
  label.className='label';
  const kids=node.children||[];
  label.innerHTML=renderText(node.name)+(kids.length?'<span class="n">('+kids.length+')</span>':'');
  wrap.appendChild(label);
  if(kids.length){
    label.classList.add('tog');
    const box=document.createElement('div');
    box.className='children';
    kids.forEach(k=>box.appendChild(build(k,depth+1)));
    wrap.appendChild(box);
    label.addEventListener('click',()=>wrap.classList.toggle('collapsed'));
    if(depth>=2) wrap.classList.add('collapsed'); // 默认收到章/卡片一级
  }
  wrap.dataset.text=node.name;
  return wrap;
}
const map=document.getElementById('map');
map.appendChild(build(DATA,0));
function setAll(node,expand,depth){
  if(node.classList&&node.classList.contains('node')){
    if(depth>=2) node.classList.toggle('collapsed',!expand);
    node.querySelectorAll(':scope > .children > .node').forEach(c=>setAll(c,expand,depth+1));
  }
}
function expandAll(yes){ setAll(map.firstChild,yes,0); }
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim(); if(!q)return;
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  const hit=[...document.querySelectorAll('.node')].find(n=>n.dataset.text&&n.dataset.text.includes(q));
  if(!hit){alert('没找到：'+q);return;}
  let p=hit; while(p){ if(p.classList&&p.classList.contains('node'))p.classList.remove('collapsed'); p=p.parentElement; }
  hit.querySelector('.label').classList.add('hl');
  hit.scrollIntoView({block:'center',inline:'center'});
});
</script>
