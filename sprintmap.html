是处理信息流。"}, {"name": "◇广义：涵盖组织内外人员、地点、事件信息，通过输入→处理→输出将数据转化为有价值信息，具备决策支持、协调控制、问题分析等功能，包含组织、管理、信息技术三维度。"}]}]}, {"name": "2.信息系统的特征", "children": [{"name": "●复杂性：多子系统（硬件、软件、数据、网络）相互关联。"}, {"name": "●动态性：需持续适应环境变化与业务需求。"}, {"name": "●可扩展性：支持灵活升级与重组。"}, {"name": "●易用性：用户操作便捷高效。"}, {"name": "●实时性：快速处理响应实时数据。"}, {"name": "●安全性：保障信息完整性、可用性、机密性。"}, {"name": "●可靠性：稳定运行，避免故障损失。"}, {"name": "●成本效益：投入产出比例合理。"}]}, {"name": "3.信息系统抽象模型", "children": [{"name": "☑管理模型：领域知识及问题处理模型（输入数据）。"}, {"name": "☑信息处理模型：信息获取、存储、传输、加工规则（加工处理）。"}, {"name": "☑系统实现条件：技术（计算机、通信技术）、人员、资源控制（技术环境）。"}]}, {"name": "4.信息系统生命周期", "children": [{"name": "（1）系统规划（可行性分析、项目开发计划）"}, {"name": "（2）系统分析（需求分析）"}, {"name": "（3）系统设计（概要设计、详细设计）"}, {"name": "（4）系统实施（编码、测试）"}, {"name": "（5）系统运行与维护", "children": []}]}, {"name": "5.信息系统的结构", "children": [{"name": "（1）物理结构", "children": [{"name": "◆集中式：资源集中配置（如早期单机系统），资源利用率高但扩展性差、脆弱性强。"}, {"name": "◆分布式：通过网络共享资源（主流模式），扩展性好、故障局部化，但管理协调复杂。"}, {"name": "（2）逻辑结构（通用五层架构）"}, {"name": "◇基础设施层：感知设备、网络传输设备、存储设备。"}, {"name": "◇资源管理层：操作系统、数据库管理系统。"}, {"name": "◇中间件层：提供数据传输共享服务（如 GIS 中间件、交易中间件）。"}, {"name": "◇业务逻辑层：业务流程驱动引擎（如工作流引擎）。"}, {"name": "◇应用表现层：用户交互界面（UI）。"}]}]}]}, {"name": "（三）信息系统发展（诺兰模型）", "children": [{"name": "1.初始阶段", "children": [{"name": "☑特点：计算机作为办公设备，少数人使用（如财务部门）。"}]}, {"name": "2.传播阶段", "children": [{"name": "☑特点：数据处理能力提升，但数据冗余、不一致问题显现。"}]}, {"name": "3.控制阶段", "children": [{"name": "☑特点：建立计算机管理组织，应用数据库技术，转向数据管理。"}]}, {"name": "4.集成阶段", "children": [{"name": "☑特点：建立集中式数据库，硬件投入激增。"}]}, {"name": "5.数据管理阶段", "children": [{"name": "☑特点：统一数据平台，实现资源整合与共享。"}]}, {"name": "6.成熟阶段", "children": [{"name": "☑特点：满足各层次需求，支持高效决策，整合内外部资源。"}]}]}]}, {"name": "二、信息技术及其发展", "children": [{"name": "（一）计算机软硬件", "children": [{"name": "1.计算机硬件", "children": [{"name": "◇冯·诺依曼结构：控制器、运算器、存储器、输入设备、输出设备五部分，现代集成于中央处理器（CPU）。"}]}, {"name": "2.计算机软件", "children": [{"name": "（1）系统软件：为计算机提供基础服务（如操作系统、数据库、中间件）。"}, {"name": "（2）应用软件：解决特定问题（如财务软件、图像处理软件），分专用型与通用型。"}]}]}, {"name": "（二）计算机网络", "children": [{"name": "1.基本组成", "children": [{"name": "（1）网络硬件：集线器、交换机、路由器、防火墙等。"}, {"name": "（2）网络协议", "children": [{"name": "◆OSI 模型：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层。"}, {"name": "◆TCP/IP 模型：网络接口层→网际层→传输层→应用层（含 IP、TCP、HTTP 等协议）。"}]}, {"name": "（3）性能指标", "children": [{"name": "●速率（比特率）、带宽、吞吐量、时延、往返时间（RTT）、利用率。"}]}, {"name": "（4）非性能指标", "children": [{"name": "●费用、标准化、可靠性、可扩展性、易管理性。"}]}]}, {"name": "2.软件定义网络（SDN）", "children": [{"name": "◇架构："}, {"name": "○数据平面（交换机等硬件）"}, {"name": "○控制平面（SDN 控制器）"}, {"name": "○应用平面（网络应用）"}, {"name": "◇接口：南向（OpenFlow 协议）、北向（应用编程）、东西向（控制器间通信）。"}]}, {"name": "3.第五代移动通信技术（5G）", "children": [{"name": "◇特点：高速率、低时延、大连接。"}, {"name": "◇应用场景："}, {"name": "◆增强移动宽带（eMBB）"}, {"name": "◆超高可靠低时延通信（uRLLC）"}, {"name": "◆海量机器类通信（mMTC）"}]}]}, {"name": "（三）数据存储和数据库", "children": [{"name": "1.数据存储技术", "children": [{"name": "（1）架构五层", "children": [{"name": "●存储介质（机械硬盘、固态硬盘、磁带）"}, {"name": "●组网方式（IP 组网、FC 组网）"}, {"name": "●存储类型（文件存储、块存储、对象存储）"}, {"name": "●存储架构（集中式、分布式、存储集群）"}, {"name": "●连接方式（SAN、NAS、DAS）"}]}, {"name": "（2）存储模式对比", "children": [{"name": "表头：架构｜特点｜适用场景"}, {"name": "DAS｜直连主机，难共享｜中小组织服务器"}, {"name": "NAS｜文件级共享，易管理｜部门文档共享"}, {"name": "SAN｜块级高速网络，扩展性强｜大型数据库、数据中心"}]}]}, {"name": "2.数据结构模型", "children": [{"name": "◆层次模型：树形结构，一对多关联。"}, {"name": "◆网状模型：有向图结构，支持多对多关联。"}, {"name": "◆关系模型：二维表结构（主流），标准化程度高。"}]}, {"name": "3.常用数据库类型", "children": [{"name": "表头：类型｜优点｜缺点"}, {"name": "关系型｜易理解、易维护、使用方便｜扩展难、关联查询性能低"}, {"name": "非关系型｜高并发、易扩展、弱结构化｜事务支持弱、通用性差"}]}, {"name": "4.数据仓库", "children": [{"name": "◇体系结构："}, {"name": "○数据源→ETL（抽取、转换、加载）→存储管理→OLAP 服务器→前端工具（报表、数据挖掘）。"}, {"name": "◇OLAP 类型：ROLAP（基于关系数据库）、MOLAP（基于多维数据库）、HOLAP（混合型）。"}]}]}, {"name": "（四）信息安全", "children": [{"name": "1.信息安全基础", "children": [{"name": "（1）定义：保护信息的保密性、完整性、可用性、可控性、不可否认性。"}, {"name": "（2）层次：设备安全→数据安全→内容安全→行为安全。"}]}, {"name": "2.信息安全技术和措施", "children": [{"name": "●身份认证：静态密码、生物识别、公钥基础设施（PKI）。"}, {"name": "●访问控制：自主访问控制、基于角色的访问控制。"}, {"name": "●入侵检测系统：实时监控网络攻击行为。"}, {"name": "●防火墙：隔离内外部网络，过滤数据包。"}, {"name": "●网闸：物理隔离网络，阻断直接连接。"}, {"name": "●防病毒：基于规则库检测恶意代码。"}, {"name": "●数据加密：对称加密（DES）、非对称加密（RSA）。"}]}, {"name": "3.网络安全态势感知", "children": [{"name": "◇流程：数据采集→特征提取→态势评估→可视化。"}, {"name": "◇目标：实时监测、威胁预警、攻击溯源。"}]}]}, {"name": "（五）信息技术发展趋势", "children": [{"name": "●软件：“软件定义一切”，操作系统、数据库、AI 框架持续创新。"}, {"name": "●硬件：超高速、小型化、智能化、低功耗。"}, {"name": "●网络：5G 支撑物联网与工业互联网。"}, {"name": "●存储：云存储普及，存算分离架构演进。"}, {"name": "●安全：可信计算、标准化、集成化发展。"}]}]}, {"name": "三、新一代信息技术及其发展", "children": [{"name": "（一）物联网（IoT）", "children": [{"name": "1.定义", "children": [{"name": "◇通过传感设备按协议连接物品至互联网，实现智能识别与管理，支持物物互联（T2T）、人物互联（H2T）、人人互联（H2H）。"}]}, {"name": "2.特点", "children": [{"name": "●感知识别普适化●异构设备互联化●终端规模化●管理智能化●应用链条化"}]}, {"name": "3.技术架构", "children": [{"name": "◆感知层：传感器、RFID（射频识别）、GPS。"}, {"name": "◆网络层：互联网、云计算平台。"}, {"name": "◆应用层：智能家居、智慧城市、工业自动化。"}]}, {"name": "4.应用场景", "children": [{"name": "◇智能家居（远程控制设备）◇智慧城市（交通、环境监测）◇工业自动化（预测性维护）"}]}]}, {"name": "（二）区块链", "children": [{"name": "1.定义", "children": [{"name": "◇按时间顺序链接数据区块的分布式账本，通过密码学保障不可篡改。"}]}, {"name": "2.特点", "children": [{"name": "●多中心化●多方维护●时序数据●不可篡改"}]}, {"name": "3.关键技术", "children": [{"name": "◆分布式账本：去中心化记录交易。"}, {"name": "◆加密算法：哈希算法（SHA256）、非对称加密（RSA）。"}, {"name": "◆共识机制：工作量证明（PoW）、权益证明（PoS）。"}]}, {"name": "4.应用场景", "children": [{"name": "◇金融（跨境支付）◇供应链（溯源）◇公共服务（选举投票）"}]}]}, {"name": "（三）云计算", "children": [{"name": "1.定义", "children": [{"name": "◇通过网络提供按需计算的共享资源池（服务器、存储、应用），实现“快速、按需、弹性”服务。"}]}, {"name": "2.服务模式", "children": [{"name": "◆基础设施即服务（IaaS）：提供虚拟化计算资源。"}, {"name": "◆平台即服务（PaaS）：提供开发环境。"}, {"name": "◆软件即服务（SaaS）：提供应用软件。"}]}, {"name": "3.关键技术", "children": [{"name": "●虚拟化：分割硬件资源（如容器技术）。"}, {"name": "●云存储：分布式文件系统（如 HDFS）。"}, {"name": "●多租户管理：基于属性的访问控制（ABE）。"}]}, {"name": "4.发展趋势", "children": [{"name": "◇垂直行业渗透◇多云混合架构◇生态建设"}]}]}, {"name": "（四）大数据", "children": [{"name": "1.定义", "children": [{"name": "◇海量、高增长、多样化的信息资产，需新型处理模式支撑决策。"}]}, {"name": "2.特征（5V）", "children": [{"name": "●数据量大（Volume）●类型多样（Variety）●价值密度低（Value）●速度快（Velocity）"}, {"name": "●真实性（Veracity）"}]}, {"name": "3.技术架构", "children": [{"name": "◆数据获取：分布式爬取、数据清洗。"}, {"name": "◆分布式处理：Hadoop（离线）、Spark（快速）、Storm（实时）。"}, {"name": "◆数据管理：MPP 数据库、数据安全。"}, {"name": "◆应用服务：可视化、行业分析（如金融风控）。"}]}]}, {"name": "（五）人工智能（AI）", "children": [{"name": "1.定义", "children": [{"name": "◇模拟人类智能的计算系统，核心为数据驱动的决策。"}]}, {"name": "2.特点", "children": [{"name": "●人类设计服务人类●感知环境并反应●人机互补协作"}]}, {"name": "3.关键技术", "children": [{"name": "◆机器学习：从数据中自动学习模型（如深度学习）。"}, {"name": "◆自然语言处理（NLP）：机器翻译、情感分析。"}, {"name": "◆计算机视觉（CV）：图像识别、自动驾驶。"}, {"name": "◆知识图谱：结构化语义网络（如反欺诈分析）。"}]}, {"name": "4.发展趋势", "children": [{"name": "◇人机混合智能◇自主智能系统◇多学科交叉"}]}]}, {"name": "（六）边缘计算", "children": [{"name": "1.定义", "children": [{"name": "◇在数据源近端处理计算，减少云端传输延迟。"}]}, {"name": "2.特点", "children": [{"name": "●联接性●数据第一入口●环境约束性●分布式"}]}, {"name": "3.应用场景", "children": [{"name": "◇智慧园区（实时数据处理）◇工业物联网（OPC UA 协议）◇视频监控（边缘分析）"}]}]}, {"name": "（七）数字孪生", "children": [{"name": "1.定义", "children": [{"name": "◇物理实体的虚拟镜像，通过实时数据模拟状态、预测行为。"}]}, {"name": "2.应用层级", "children": [{"name": "◆产品：全生命周期管理（如飞机发动机监控）。"}, {"name": "◆产业链：供应链优化、服务型制造。"}, {"name": "◆城市：构建“数字镜像”，支持智慧决策。"}]}, {"name": "3.发展阶段", "children": [{"name": "◇技术准备（1960—2000 年）→概念产生（2002—2010 年）→领先应用（2010—2020年）→深度扩展（2020—2030 年）"}]}]}, {"name": "（八）新一代信息技术融合趋势", "children": [{"name": "●新基建核心："}, {"name": "◇信息基础设施（5G、AI、数据中心）"}, {"name": "◇融合基础设施（智能交通、智慧能源）"}, {"name": "◇创新基础设施（科研平台）"}, {"name": "●技术协同：物联网采集数据→云计算处理→人工智能分析→区块链保障安全。"}, {"name": "●产业影响：驱动数字经济，支撑社会智能化转型。"}]}]}]}, {"name": "第2章数字中国与数智化发展", "children": [{"name": "一、数字化转型", "children": [{"name": "（一）定义与驱动因素", "children": [{"name": "1.数字化转型内涵", "children": [{"name": "●定义：在数字化转换（技术应用）和数字化升级（流程优化）基础上，触及组织核心业务，以构建新型数字化商业模式为目标的高层次转型。"}, {"name": "○本质：系统性重构组织活动、流程、业务模式及员工能力，需深度融合信息技术与业务战略。"}]}, {"name": "2.驱动因素", "children": [{"name": "（1）生产力飞升：第四次科技革命"}, {"name": "◆科学范式演进："}, {"name": "◇第一范式（经验范式）：基于观察归纳，具盲目性。"}, {"name": "◇第二范式（理论范式）：理论概括，弱实用性。"}, {"name": "◇第三范式（模拟范式）：数据模型定量分析。"}, {"name": "◇第四范式（数据密集型）：数据驱动决策，自动化挖掘经验与理论（如 AI 自优化）。"}, {"name": "（2）生产要素变化：数据要素诞生"}, {"name": "◆数据成为与土地、劳动力、资本并列的生产要素。"}, {"name": "◆价值路径：数据→信息→知识→智慧，技术（AI/区块链）凸显数据经济价值。"}, {"name": "（3）信息传播效率突破：社会互联网新格局"}, {"name": "◆特征：永生性（信息不可灭）、无限性（病毒式传播）、即时性（零时延）、方向性（精准触达）。"}, {"name": "（4）社会“智慧主体”规模扩容", "children": [{"name": "◆主体扩展：从自然人延伸至互联网账号、自动驾驶汽车、智能设备等。"}, {"name": "◆影响：劳动密集型消退，智力密集型强化，自然人转向复杂服务领域（情感/风险应对）。"}]}]}]}, {"name": "（二）基本原理", "children": [{"name": "1.传统发展模式瓶颈", "children": [{"name": "●决策瓶颈：层级结构降低决策效率。"}, {"name": "●变革制约：组织文化/技术现状阻碍系统性变革。"}, {"name": "●知识资产流失：传统知识管理依赖人员稳定性。"}, {"name": "●需求响应延迟：标准化模式抑制个性化需求满足。"}]}, {"name": "2.数字化转型路径", "children": [{"name": "（1）能力因子定义与数字化封装", "children": [{"name": "○将组织能力结构化（能力域→能力子域→能力项），模块化封装人员、技术、资源、流程。"}, {"name": "○目标：实现“智能+”（如数字装备、数字化管理单元）。"}]}, {"name": "（2）基于“互联网+”的调度与决策", "children": [{"name": "○难点："}, {"name": "◆业务与 IT 融合需双向理解。"}, {"name": "◆数字决策需持续优化与文化适应。"}]}, {"name": "（3）转型控制", "children": [{"name": "○借鉴信息化与工业化融合实践，持续优化转型过程。"}]}]}]}, {"name": "（三）数字化转型国家标准（GB/T 43439）", "children": [{"name": "1.模型框架", "children": [{"name": "●能力域：组织、技术、数据、资源（基础能力）；数字化运营、生产、服务（业务能力）。"}, {"name": "●成熟度等级：一级（探索）→五级（生态创新），共 5 级（详见表）。等级 特征描述一级 具备转型意识，局部业务探索数字化。二级 规划基础能力，初步数据应用。三级 系统集成，关键业务效率提升。四级 数据驱动智能体验。五级 数据优化创新，构建生态价值。"}]}]}]}, {"name": "二、数字中国", "children": [{"name": "（一）起源与发展", "children": [{"name": "1.战略演进", "children": [{"name": "●2015 年：习近平首次提出“数字中国”概念。"}, {"name": "●“十三五”至“十四五”：纳入国家规划，出台《数字中国建设整体布局规划》。"}, {"name": "●目标："}, {"name": "◆2025 年：数字基础设施高效联通，数据要素价值释放。"}, {"name": "◆2035 年：数字化水平全球领先。"}]}, {"name": "2.挑战", "children": [{"name": "●外部：技术垄断、国际规则竞争。"}, {"name": "●内部：系统性不足、治理体系待优化。"}]}]}, {"name": "（二）内涵与外延", "children": [{"name": "●从学术概念（地理信息系统）升级为国家战略（如“数字福建”示范）。"}, {"name": "●外延：覆盖经济、政治、文化、社会、生态全方位数字化。"}]}, {"name": "（三）主要内容（“2522”框架）", "children": [{"name": "1.夯实两大基础", "children": [{"name": "（1）数字基础设施：5G/千兆光网、算力中心梯次布局。"}, {"name": "（2）数据资源体系：国家数据管理机制、公共数据开放。"}]}, {"name": "2.五位一体融合", "children": [{"name": "●数字经济：数字产业化（云计算/物联网）、产业数字化（农业/工业融合）。"}, {"name": "●数字政务：“一网通办”、线上线下协同。"}, {"name": "●数字文化：网络文化产品、文化数字化（国家文化大数据）。"}, {"name": "●数字社会：智慧教育/医疗、数字乡村。"}, {"name": "●数字生态：智慧环保、绿色生活。"}]}, {"name": "3.强化两大能力", "children": [{"name": "●数字技术创新：关键核心技术攻关、产学研融合。"}, {"name": "●数字安全屏障：网络安全法规、数据分级保护。"}]}, {"name": "4.优化两个环境", "children": [{"name": "●国内治理：数字规则体系（立法/标准）、网络生态治理。"}, {"name": "●国际合作：“数字丝绸之路”、参与跨境数据规则制定。"}]}]}]}, {"name": "三、数字经济", "children": [{"name": "（一）新技术经济范式", "children": [{"name": "1.结构要素", "children": [{"name": "●驱动力：智能技术群（云计算/AI/5G）融合触发经济变革。"}, {"name": "●新结构：网络效应、数据要素、产用关系重构。"}, {"name": "●价值创造：疫情加速生产关系重建（如远程医疗/教育）。"}, {"name": "●经济增长：技术→经济→价值→增长的正反馈闭环。"}]}]}, {"name": "（二）主要内容构成", "children": [{"name": "1.数字产业化", "children": [{"name": "●范围：电子信息制造、软件、互联网等基础产业。"}, {"name": "●发展重点："}, {"name": "◆云计算：混合云、安全创新。"}, {"name": "◆物联网：传感器/高精度定位。"}, {"name": "◆工业互联网：标识解析体系。"}]}, {"name": "2.产业数字化", "children": [{"name": "●特征：数字科技变革工具、数据为要素、平台为载体。"}, {"name": "●企业核心：数据资产运营（盘活内外部数据价值）。"}, {"name": "●“六链融合”战略：产业链为核心，联动创新链/供应链/资金链/政策链/要素链。"}]}, {"name": "3.数字化治理", "children": [{"name": "●内涵三层："}, {"name": "◆对数据的治理（产权/安全）。"}, {"name": "◆用数字技术治理（大数据赋能决策）。"}, {"name": "◆对数字空间的治理（线上经济活动规范）。"}]}, {"name": "4.数据价值化", "children": [{"name": "●“三化”框架："}, {"name": "◆资源化（数据采集→清洗→整合）。"}, {"name": "◆资产化（流通交易释放经济价值）。"}, {"name": "◆资本化（信贷融资/证券化）。"}]}]}]}, {"name": "四、数字政府", "children": [{"name": "（一）数字新特征", "children": [{"name": "●协同化：跨层级/地域/部门业务协同。"}, {"name": "●云端化：政务上云集约建设。"}, {"name": "●智能化：AI 提升治理精度。"}, {"name": "●关键词：共享（数据互通）、便利（利企便民）。"}]}, {"name": "（二）主要内容", "children": [{"name": "1.“一网通办”", "children": [{"name": "●模式：线上大厅集成服务，信息共享简化流程（如电子证照库）。"}, {"name": "●支撑：数据自动比对替代人工审批。"}]}, {"name": "2.“跨省通办”", "children": [{"name": "●模式分类："}, {"name": "○全程网办（全流程线上）。"}, {"name": "○代收代办（异地收件，属地办理）。"}, {"name": "○多地联办（一地受理，系统协同）。"}]}, {"name": "3.“一网统管”", "children": [{"name": "●核心：城市事件牵引，网格化管理。"}, {"name": "●能力：态势感知、智能预警、联动处置。"}]}]}, {"name": "（三）能力体系", "children": [{"name": "●经济调节（大数据监测）"}, {"name": "●市场监管（智慧监管）"}, {"name": "●社会管理（矛盾化解数字化）"}, {"name": "●公共服务（全国一体化政务平台）"}, {"name": "●生态保护（数字孪生流域）"}, {"name": "●决策支持（数据辅助）"}]}]}, {"name": "五、数字社会", "children": [{"name": "（一）数字民生", "children": [{"name": "●普惠：消除资源不均衡（如远程教育）。"}, {"name": "●赋能：“互联网+医疗/养老”提升服务效能。"}, {"name": "●场景：智慧图书馆、在线法院。"}]}, {"name": "（二）智慧城市", "children": [{"name": "1.发展阶段", "children": [{"name": "●从信息化应用→数字关系决策→主动服务。"}]}, {"name": "2.核心能力要素", "children": [{"name": "●数据治理：全生命周期管理。"}, {"name": "●数字孪生：物理世界虚拟映射。"}, {"name": "●边际决策：执行端快速响应。"}, {"name": "●多元融合：服务可编排集成。"}, {"name": "●态势感知：社会状态预测。"}]}]}, {"name": "（三）数字乡村", "children": [{"name": "●重点任务：信息基建（网络覆盖）、农村电商、生态保护信息化。"}, {"name": "●目标：2035 年消除城乡“数字鸿沟”。"}]}, {"name": "（四）数字生活", "children": [{"name": "●工具数字化：智能设备普及（如智能手机）。"}, {"name": "●方式数字化：远程办公/在线消费。"}, {"name": "●内容数字化：信息消费为主流。"}]}]}, {"name": "六、数字生态", "children": [{"name": "（一）数据要素市场", "children": [{"name": "1.市场化配置逻辑", "children": [{"name": "●基础：数据产权/交易机制/定价规则。"}, {"name": "●产业链环节："}, {"name": "◆采集（准确性）→存储（安全性）→流通（合规性）→应用（价值转化）。"}]}, {"name": "2.政策保障", "children": [{"name": "●建立数据产权制度、交易平台、安全保护立法。"}]}]}, {"name": "（二）网络安全保护", "children": [{"name": "1.挑战网络霸权、数据泄露、攻击溯源难。", "children": []}, {"name": "2.举措", "children": [{"name": "（1）健全法规（《网络安全法》《数据安全法》）。"}, {"name": "（2）关键信息基础设施防护。"}, {"name": "（3）威胁监测预警能力。"}, {"name": "（4）技术产业融合（教育/创新）。"}, {"name": "（5）国际合作参与规则制定。"}]}]}]}, {"name": "七、数智化发展", "children": [{"name": "（一）科学范式与科技革命", "children": [{"name": "●第四范式（数据密集型）：机器学习驱动大规模数据分析（如社会运行模式挖掘）。"}, {"name": "●科技革命定位：AI 为产业变革核心驱动力（习近平指示）。"}]}, {"name": "（二）数字新空间（三元空间）", "children": [{"name": "●物理空间：万物互联数据基础。"}, {"name": "●社会空间：社群行为数据沉淀。"}, {"name": "●数字空间：映射并优化现实（如智慧城市决策）。"}]}, {"name": "（三）数字营商环境", "children": [{"name": "●评价指标："}, {"name": "◆数字支撑（5G/电子支付）。"}, {"name": "◆数据安全与开放。"}, {"name": "◆市场规则（平台责任/消费者保护）。"}]}, {"name": "（四）数智化新业态新模式", "children": [{"name": "1.政策支持 15 个重点方向（在线教育/互联网医疗/灵活就业）。", "children": []}, {"name": "2.发展瓶颈", "children": [{"name": "●监管滞后（传统“按行划片”不适配）。"}, {"name": "●中小微企业“不敢转”（投入高/周期长）。"}, {"name": "●灵活就业保障不足。"}]}]}]}]}, {"name": "第3章系统科学与哲学方法论", "children": [{"name": "一、矛盾论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.矛盾法则（对立统一规律）", "children": [{"name": "（1）核心内容：矛盾法则（即对立统一规律）是唯物辩证法最根本的规律，体现为一切事物均由矛盾双方构成统一体；矛盾双方既相互排斥又相互联系（斗争与统一），共同推动事物运动和发展。"}, {"name": "（2）实质与核心：作为自然和社会的根本规律，它也是认识的根本规律，强调矛盾是事物发展的内在动力。"}]}, {"name": "2.唯物辩证法和形而上学的对立", "children": [{"name": "（1）形而上学（唯心论）：长期占据统治地位，认为事物孤立不变，变化仅源于外力推动（如数量增减或场所变更），忽略内部矛盾。"}, {"name": "（2）唯物辩证法：主张从事物内部及相互关系研究发展，内因（内部矛盾性）是根本原因，外因（外部联系）是条件，外因通过内因起作用。"}]}, {"name": "3.矛盾的普遍性和特殊性", "children": [{"name": "（1）普遍性：矛盾存在于一切客观事物和主观思维过程中，贯穿始终（绝对性）。"}, {"name": "●含义一：矛盾普遍存在于所有运动形式（简单或复杂）、客观现象或思想现象。"}, {"name": "●含义二：矛盾存在于每一事物过程的始终，差异即矛盾的初始阶段（量变阶段）。"}, {"name": "（2）特殊性：矛盾着的事物及其侧面各有特点（相对性），主要表现在："}, {"name": "●运动形式特殊性：特殊矛盾构成事物本质，区分不同事物。"}, {"name": "●发展过程特殊性：由根本矛盾（规定非根本矛盾）和非根本矛盾（影响根本矛盾解决）决定阶段性特点。"}, {"name": "●矛盾地位特殊性：事物性质由主要矛盾方面（支配地位）决定。"}]}, {"name": "4.主要矛盾、主要的矛盾方面和矛盾的诸方面的同一性", "children": [{"name": "（1）主要矛盾：在矛盾体系中起领导作用，规定和影响其他矛盾（次要矛盾）的存在与发展。"}, {"name": "（2）矛盾的主要方面：在矛盾中起主导作用，决定事物性质。"}, {"name": "（3）同一性：矛盾双方互为存在前提，共处统一体；依据条件向对立面转化（如矛盾缓和或激化）。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●分析社会矛盾：指导人分析并解决社会矛盾，促成事物转化（如改变社会结构）。"}, {"name": "●日常应用：用矛盾观点（全面、联系、发展）观察事物，避免主观主义，实现科学思维；捕捉、把握、剖析矛盾，推动实践创新。"}, {"name": "●系统规划本质：是分析并解决矛盾的过程，例如在信息系统规划中解决："}, {"name": "○需求与资源的矛盾：有限资源满足变化需求（如优化资源配置）。"}, {"name": "○敏态与稳态的矛盾：系统稳定性（支持日常业务）与灵活性（适应变化）的平衡。"}, {"name": "○安全与效率的矛盾：保障信息安全同时保持高效运行（如引入加密技术）。"}, {"name": "○文化与技术的矛盾：调和组织文化与管理模式与新技术的冲突（如培训与文化适配）。"}, {"name": "●实例：迭代式开发模式（如软件工程）符合“抓住主要矛盾”方针；设计最小原型解决核心问题，避免后续代价高昂的失败。"}]}]}, {"name": "二、实践论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.实践与认识的关系", "children": [{"name": "（1）实践来源：实践是认识的来源、动力、目的和检验标准（实践包括生产活动、阶级斗争、政治生活等社会活动）。"}, {"name": "（2）认识规律：实践→认识→再实践→再认识循环反复（无穷过程），实现认识深化。"}]}, {"name": "2.认识过程的两次飞跃", "children": [{"name": "（1）第一次飞跃（感性到理性）：在实践基础上，通过去粗取精、去伪存真、由此及彼、由表及里，从感性认识上升到理性认识。"}, {"name": "（2）第二次飞跃（理性到实践）：理性认识返回实践验证，更关键；正确认识促进发展，错误认识阻碍发展。"}]}, {"name": "3.真理的辩证性", "children": [{"name": "（1）相对真理与绝对真理：真理是辩证运动的发展过程，实践是检验真理的唯一标准（纠正理论不完全性或错误）。"}, {"name": "（2）不完全性：许多理论真理不完全，需通过实践验证和修正。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●实践性原则：以实际问题为导向，注重经验积累；确保规划系统可操作、易实施，并在使用中持续优化。"}, {"name": "●关键方面："}, {"name": "○避免惯向思维：立足实际问题，避免经验主义或教条主义（如细致查勘需求，结合感性认识与理性分析）。"}, {"name": "○持续迭代：遵循“认知→实践”循环多次完成（如用版本与变更控制管理规划演进）。"}, {"name": "○实验问题解决：用原型法（小实验环境）快速验证优化（如在规划阶段处理未确认问题）。"}, {"name": "●应用实例：系统规划依赖最佳实践（通过实践得来），提升认知质量和成功率。"}]}]}, {"name": "三、系统论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.系统论概述", "children": [{"name": "（1）定义：研究系统结构、特点、行为、动态、原则、规律及联系，并数学描述功能；基本思想是将对象视为整体系统（整体观念）。"}, {"name": "（2）任务：从整体出发研究系统与要素关系，把握本质以实现最优目标。"}]}, {"name": "2.系统八大基本原理", "children": [{"name": "（1）系统整体性原理：要素组成系统后具有新性质（整体功能不等于要素简单加和），要素间相互作用（线性或非线性）形成整体质的规定性。"}, {"name": "（2）系统层次性原理：要素差异（结合方式）形成等级秩序（如套箱结构），高层次包含低层次，不同层次发挥不同功能（如大脑三层次：原始脑、边缘系统、新皮层）。"}, {"name": "（3）系统开放性原理：系统与环境交换物质、能量、信息（开放是发展前提）；内因是变化根据，外因是条件（通过交互实现可能性转化）。"}, {"name": "（4）系统目的性原理：系统发展趋向预定状态（异因同果），不受条件变化影响。"}, {"name": "（5）系统突变性原理：系统通过失稳进入新状态（质变基本形式），包括要素突变（如基因突变）和系统层级突变。"}, {"name": "（6）系统稳定性原理：开放系统自我调节能力（动态稳定），负反馈机制消除偏离（局部不稳定可成为演化积极因素）。"}, {"name": "（7）系统自组织原理：开放系统在非线性作用下自发从无序到有序（如万物自发运动）；自组织相对，受整体制约。"}, {"name": "（8）系统相似性原理：系统存在同构和同态共性（结构或演化相似），源于世界物质统一性；相似有条件，差异绝对（包括功能或关系相似）。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●整体视角：从全局思考系统组成、输入输出、交互（如将事件涉及要素拆解理清），用数学模型推演优先级。"}, {"name": "●应用实例：IT 服务规划设计遵循“总体设计→详细设计→实现验证”流程；"}, {"name": "○步骤：识别服务需求→设计服务目录→制定服务方案（含模式、级别、人员等）→评估成本→设计协议。"}, {"name": "○工具：活动结构图（如图 3-1）确保目的明确、重点突出。"}, {"name": "●设计原则：早期注重可拓展性、最小原子性、耦合性，以支持健康演进和快速响应变化。"}]}]}, {"name": "四、信息论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.信息论概述", "children": [{"name": "（1）定义：运用概率论与数理统计研究信息、信息熵、通信系统等问题；分狭义信息论（通信技术）和广义信息论（信息科学）。"}, {"name": "（2）信息内涵：广义定义为物质相互作用中表征外部情况的普遍属性（再现系统特性）。"}]}, {"name": "2.核心概念", "children": [{"name": "（1）基本要素："}, {"name": "●信号：消息载体（物理量）。"}, {"name": "●信息量：信息多少的量度。"}, {"name": "●信源：消息来源（如自然物体）。"}, {"name": "●信宿：信息接收者（人或机器）。"}, {"name": "●信道：信源与信宿间传递通道。"}, {"name": "●信道容量：传输信息的速度与量。"}, {"name": "●编码：将信息变为信号（信源编码表达消息，信道编码转换信号）。"}, {"name": "●译码：信号还原为信息（编码逆过程）。"}, {"name": "（2）信息方法：运用信息观点分析系统信息流程（普适性），特点包括撇开具体运动形态抽象为信息过程，说明主客体信息交换方式。"}]}, {"name": "3.信息特性", "children": [{"name": "●传递性：信息可传输（如烽火传信、网络无延迟）。"}, {"name": "●共享性：信息可交换共享（有条件，如专利技术需规则）。"}, {"name": "●依附性和可处理性：信息依附载体展示（如红绿灯），并可更改处理（如照片美颜）。"}, {"name": "●价值相对性：价值因人因时而异（如造纸术从技术变为文化遗产）。"}, {"name": "●时效性：信息仅在特定时间段有效（如红绿灯状态）。"}, {"name": "●真伪性：信息不一定反映真实（如烽火戏诸侯典故）。"}]}, {"name": "4.信息技术革命", "children": [{"name": "●第一次：语言文字创造（信息存在形式）。"}, {"name": "●第二次：造纸印刷技术（知识大量生产）。"}, {"name": "●第三次：电报电话等（信息传递变革）。"}, {"name": "●第四次：计算机与通信技术（处理速度提升）。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●信息核心作用：抓住信息特征（如共享性、真伪性）指导高效规划（如数据安全权限管理）。"}, {"name": "●需求分析应用：因价值相对性，需抽丝剥茧抓核心痛点；因依附性，需特定方式处理信息。"}, {"name": "●编码平衡：在准确性与简洁性间找平衡（添加冗余信息抗噪），简化流程提高易用性。"}, {"name": "●数学方法：信息论数学模型用于信息系统实现（如优化数据传输）。"}]}]}, {"name": "五、控制论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.控制论概述", "children": [{"name": "（1）定义：研究动物和机器中控制与通信的科学（扩展至社会经济领域）。"}, {"name": "（2）控制系统组成："}, {"name": "●控制部分：传感器（采集信息）、控制器（加工信息产生控制信号）、执行器（放大控制作用）。"}, {"name": "●被控对象：施加控制的目标系统。"}]}, {"name": "2.控制类型", "children": [{"name": "（1）开环控制系统：控制信号不依赖输出（主观控制），适用于先验知识明确系统（结构简单）。"}, {"name": "（2）闭环控制系统（反馈控制）：控制信号依赖输出（客观控制），通过误差信号（实际输出与期望输出比较）调整；"}, {"name": "●负反馈：误差减少，系统稳定（基本形式）。"}, {"name": "●正反馈：误差增大，特殊情况下有用。"}, {"name": "（3）反馈特征：增强稳定性、鲁棒性（抗参数变化）、抗干扰能力和响应性能。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●研究对象：工业系统、信息系统等（如综合自动化系统）。"}, {"name": "●应用系统类型："}, {"name": "（1）综合自动化系统：集成控制、优化、调度等（如计算机集成制造系统），追求整体最优，以人为中心。"}, {"name": "（2）计算机集成制造系统（CIMS）："}, {"name": "◆组成：自动化设计系统（CAD/CAM）、自动化制造系统、质量保障系统、管理决策系统。"}, {"name": "◆支撑：分布式数据库和网络。"}, {"name": "◆效益：通过信息集成提升质量、设备利用率及决策科学性（如库存控制优化）。"}, {"name": "（3）网络化控制系统（NCS）："}, {"name": "◆特点：分布式实时反馈（控制器、传感器、执行器为网络节点），数据采集非等周期，受网络调度影响。"}, {"name": "◆挑战：传导时延（导致不稳定）、数据包丢失（路径不唯一）。"}]}]}, {"name": "六、耗散结构理论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.耗散结构概述", "children": [{"name": "（1）定义：开放系统远离平衡态时，通过物质能量交换从无序转变为有序结构（如普里戈金理论）。"}, {"name": "（2）熵变方程：系统熵变 ds=dis（内部熵增，≥0）+des（外部熵流，可负）；负熵流（des<0）抵消熵增，推动有序演化。"}]}, {"name": "2.形成条件", "children": [{"name": "（1）开放性：系统与环境交换物质、能量、信息（负熵流入抵消正熵）。"}, {"name": "（2）远离平衡态：系统各部分差异大（非均匀），避免平衡态（无变化）。"}, {"name": "（3）非线性耦合：非线性相互作用促成有序（线性系统无法形成耗散结构）。"}, {"name": "（4）涨落现象：随机微小偏差（触发器），仅在远离平衡态时促发新结构。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●系统性质：认识耗散结构特征（如抗熵能力），指导系统优化（如提升稳定性）。"}, {"name": "●应用实例："}, {"name": "（1）物流网络：通过熵流“流入”（如优化策略）形成耗散结构，提升资源协调和效率。"}, {"name": "（2）企业管理信息系统：避免封闭系统（低水平有序），需增强抗熵能力（完善功能、及时输入信息），应对内外干扰（内部噪声如技术老化，外部正熵如信息过载）。"}]}]}, {"name": "七、协同论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.协同论概述", "children": [{"name": "（1）定义：研究系统从无序到有序的协同机理（如哈肯理论），核心是“序参量”支配子系统行为。"}, {"name": "（2）协同效应：子系统协同行为产生超越个体的整体聚合作用。"}]}, {"name": "2.三大原理", "children": [{"name": "（1）不稳定原理：模式形成意味旧状态不稳定（媒介新旧结构演替）。"}, {"name": "（2）支配原理："}, {"name": "●慢变量（不稳定模）：弛豫时间长，代表演化主导。"}, {"name": "●快变量（稳定模）：迅速衰减，受慢变量支配。"}, {"name": "（3）序参量原理：序参量指示新结构形成（宏观参量），主宰系统演化；通过绝热消去法求解序参量方程。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●自组织系统视角：信息系统作为子系统（硬件、软件等）协同的整体，优化协作提升性能。"}, {"name": "●协同作用表现："}, {"name": "○自适应能力：根据环境自动调整（如云计算资源分配）。"}, {"name": "○自我修复能力：故障时自动恢复（如分布式存储容错）。"}, {"name": "○自我进化能力：通过学习提升性能（如 AI 优化）。"}, {"name": "●应用实例：机器识别模式（大数据分析）发挥协同作用，提高系统智能化水平。"}]}]}, {"name": "八、突变论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.突变论概述", "children": [{"name": "（1）定义：研究连续渐变引起突变的现象（如托姆理论），用数学模型描述预测。"}, {"name": "（2）数学基础：奇点理论（描述突变）和分岔理论（研究状态转变）。"}]}, {"name": "2.质变路径", "children": [{"name": "（1）哲学意义：质变可通过飞跃或渐变实现，控制条件决定转化方式（中间态稳定则渐变）。"}, {"name": "（2）与微积分关系：补充非连续变化研究（如状态突然大幅变化）。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●思想体系：为系统规划提供稳定性分析框架（如奇点预测行为）。"}, {"name": "●算法支撑：解决非线性问题（如模型训练分岔），优化过程提高精度。"}, {"name": "●应用领域：人工智能（训练过程优化）、系统稳定性建模。"}]}]}, {"name": "九、复杂系统论", "children": [{"name": "（一）主要思想", "children": [{"name": "1.复杂系统论概述", "children": [{"name": "（1）定义：基于复杂性科学（如钱学森巨系统理论），修正还原论，承认世界多样性、无序性及非线性。"}, {"name": "（2）核心原因：局部互动不可测（整体大于部分之和），单元组合呈现新特性。"}]}, {"name": "2.原则与特性", "children": [{"name": "（1）反馈原则：观测系统向好性的手段（非线性测量）。"}, {"name": "（2）异质性原则：异质主体提供稳定性（均匀系统反应剧烈）。"}, {"name": "（3）随机性原则：接受随机性（如引入错误）获得整体最优解（非局部最优）。"}]}]}, {"name": "（二）在系统规划与管理中的应用", "children": [{"name": "●扩展方向："}, {"name": "○整体视角：考虑多层次子系统相互作用（如分析内部结构与外部环境）。"}, {"name": "○动态演化：关注历史、现状及趋势（制定适应性方案）。"}, {"name": "○非线性思维：分析反馈机制（预测系统行为）。"}, {"name": "○多样性原则：鼓励策略融合（提升稳定性）。"}, {"name": "○适应性策略：根据变化调整（如灵活响应需求）。"}, {"name": "●工具支持：计算机仿真（如数学模型）揭示演化规律。"}]}]}]}]}, {"name": "② 考前必背 30 页（第 4-17 章 · 252 组问答）", "children": [{"name": "第 4 章信息系统规划", "children": [{"name": "问：信息系统规划的关键价值与意义", "children": [{"name": "答：（1）确立组织关键数字能力目标（2）明确组织数字能力建设路径（3）确保数字能力建设认识上的一致性（4）具象数字能力建设关键任务（5）明确数字能力标准与控制措施（6）统筹部署与管理相关建设资源"}]}, {"name": "问：信息系统规划的主要内容？", "children": [{"name": "答：（1）信息系统发展战略（2）主要系统及框架（3）组织体系优化（4）技术体系定义（5）任务体系部署（6）资源体系调度（7）保障体系设定"}]}, {"name": "问：任务体系部署的主要过程？", "children": [{"name": "答：（1）任务拆解（2）明确目标（3）匹配组织（4）制定策略（5）定义计划（6）监控实施"}]}, {"name": "问：资源体系调度的内容？", "children": [{"name": "答：（1）资源识别与评估（2）资源关系与控制（3）资源分配与调度（4）资源风险与优化"}]}, {"name": "问：保障体系的内容？", "children": [{"name": "答：（1）组织保障（2）人员保障（3）技术保障（4）资源保障（5）数据保障（6）安全保障"}]}, {"name": "问：信息系统规划的工作要点？", "children": [{"name": "答：（1）内外部需求挖掘（2）场景化模型分析（3）深度诊断与评估（4）整体与专项规划（5）持续改进"}]}, {"name": "问：内部需求挖掘的主要工作任务？", "children": [{"name": "答：（1）理解组织战略（2）熟悉业务流程（3）收集用户需求（4）评估现有系统（5）感知数字环境"}]}, {"name": "问：内部需求挖掘的注意事项？", "children": [{"name": "答：（1）以原始信息获取为主（2）避免直接给出解决方案（3）及时开展引导性培训（4）谨慎信息交叉传递（5）关注隐性需求的推演"}]}, {"name": "问：外部需求挖掘的主要工作任务？", "children": [{"name": "答：（1）国家战略导入（2）行业趋势分析（3）技术趋势研究（4）竞争环境分析（5）客户期望调研（6）标准与规范引用"}]}, {"name": "问：外部需求挖掘的注意事项？", "children": [{"name": "答：（1）国家战略与政策引用（2）定性内容转定量对比（3）避免信息安全事件"}]}, {"name": "问：场景模型的主要组成部分？", "children": [{"name": "答：（1）场景定义（2）角色分析（3）业务分析（4）数据分析（5）技术分析（6）组织分析（7）风险分析（8）政策与法律分析"}]}, {"name": "问：场景化模型分析的关键价值？", "children": [{"name": "答：（1）提高规划决策的科学性和实践性（2）确保规划与组织发展的衔接（3）降低规划风险和成本（4）促进信息系统规划的共识和沟通"}]}, {"name": "问：深度诊断与评估的内容？", "children": [{"name": "答：（1）成熟度与需求控制（2）诊断与评估模型确立（3）诊断与评估实施"}]}, {"name": "问：整体与专项规划阶段的工作内容？", "children": [{"name": "答：（1）需求整合与确认（2）整体规划（3）专项规划（4）一致性检查"}]}, {"name": "问：需求整合的维度？", "children": [{"name": "答：（1）业务领域维需求整合（2）能力建设维需求整合（3）技术发展维需求整合"}]}, {"name": "问：整体规划重点关注的内容？", "children": [{"name": "答：（1）确保信息系统与组织战略目标的一致性（2）提高信息系统的协同性和一体化程度（3）优化资源配置和投资回报"}]}, {"name": "问：专项规划的内容？", "children": [{"name": "答：（1）应用系统规划（2）网络环境规划（3）云服务规划（4）数据中心规划（5）信息安全规划（6）云原生系统规划"}]}, {"name": "问：专项规划重点关注的内容？", "children": [{"name": "答：（1）需要清晰明确信息系统的管理和使用主体（2）强调单项领域的规划系统性（3）技术路线和技术属性需要进一步明确和强化（4）需要配套更加细致的实施路径或计划"}]}, {"name": "问：持续改进需要关注的内容？", "children": [{"name": "答：（1）持续跟踪组织的战略（2）感知技术的发展创新（3）关注数据管理和信息安全（4）注重用户体验和用户参与（5）建立一个监测和评估机制"}]}, {"name": "问：信息系统规划的常用方法？", "children": [{"name": "答：（1）战略目标集转移法（2）企业信息系统规划法（3）关键成功因素法（4）价值链分析法（5）Zachman 框架"}]}, {"name": "问：战略目标集转移法中信息系统战略规划过程的步骤？", "children": [{"name": "答：（1）识别和解释组织战略集（2）进一步解释和验证组织战略集"}]}, {"name": "问：企业信息系统规划法的基本步骤？", "children": [{"name": "答：（1）定义管理目标（2）定义管理功能（3）定义数据类（4）定义信息结构"}]}, {"name": "问：关键成功因素的主要特征？", "children": [{"name": "答：（1）内部型 CSF（2）外部型 CSF（3）监控型 CSF（4）建立型 CSF"}]}, {"name": "问：关键成功因素 CSF 的实施步骤？", "children": [{"name": "答：（1）确定组织的战略目标（2）识别组织的所有成功因素（3）确定组织的关键成功因素（4）识别各关键成功因素的绩效指标和标准以及测量绩效的数据"}]}, {"name": "问：价值链分析法应用的基本步骤？", "children": [{"name": "答：（1）识别组织价值链（2）确定关键价值增加环节（3）确定关键价值减少环节（4）明确信息技术对关键价值环节的支持"}]}, {"name": "问：Zachman 框架的横向维度？", "children": [{"name": "答：（1）what（数据）（2）How（功能）（3）Where（网络）（4）who（人员）（5）When（时间）（6）why（动机）"}]}, {"name": "问：Zachman 框架的纵向维度？", "children": [{"name": "答：（1）规划者关注范围模型（2）所有者关注企业模型（3）设计者关注系统模型（4）构造者关注技术模型（5）集成者关注详细模型（6）使用者关注功能模型"}]}, {"name": "问：采用 Zachman 框架进行信息系统规划的一般步骤？", "children": [{"name": "答：（1）确定组织的愿景和原则（2）现状描述分析（3）目标架构定义（4）差距与改进点分析（5）制订实施计划（6）持续改进优化"}]}]}, {"name": "第 5 章应用系统规划", "children": [{"name": "问：应用系统规划的主要内容？", "children": [{"name": "答：（1）生命周期选择（2）体系结构定义（3）接口定义（4）数据定义（5）构件定义"}]}, {"name": "问：指导用户界面定义活动的基本原则？", "children": [{"name": "答：（1）置用户于控制之下（2）减少用户的记忆负担（3）保持界面一致"}]}, {"name": "问：构件定义的典型任务？", "children": [{"name": "答：（1）标识出所有与问题域对应的类（2）确定所有与基础设施域对应的类（3）细化所有不需要作为可复用构件的类（4）说明持久数据源并确定管理数据源所需要的类（5）开发并且细化类或构件的行为表示（6）细化部署图以提供额外的实现细节（7）考虑每个构件级定义表示，并且时刻考虑其他可选方案"}]}, {"name": "问：应用系统规划的主要过程？", "children": [{"name": "答：（1）初步调研（2）可行性研究（3）详细调研（4）系统分析（5）系统设计"}]}, {"name": "问：初步调研的具体内容？", "children": [{"name": "答：（1）组织概况（2）组织环境（3）现行系统概况（4）各方面对新系统的态度（5）系统研制工作的资源情况"}]}, {"name": "问：可行性研究的方面？", "children": [{"name": "答：（1）经济可行性分析（2）技术可行性分析（3）社会可行性分析（4）管理可行性分析"}]}, {"name": "问：应用系统可行性研究的步骤？", "children": [{"name": "答：（1）复查系统目标和规模（2）研究目前正在使用的系统（3）导出新系统的高层逻辑模型（4）重新定义问题（5）导出和评价供选择的方案（6）推荐一个方案并说明理由（7）草拟开发计划（8）书写文档并提交审查"}]}, {"name": "问：可行性研究报告的主要内容？", "children": [{"name": "答：（1）建设任务的提出（2）系统的目标（3）初步调研概况（4）初步实施方案与比较（5）可行性研究（6）结论"}]}, {"name": "问：详细调研的内容？", "children": [{"name": "答：（1）收集信息（2）系统需求建模（3）需求的优先级划分（4）构建系统原型，检验可行性并发现问题（5）产生和评估候选方案（6）和管理部门一起复查各种建议"}]}, {"name": "问：系统分析的过程？", "children": [{"name": "答：（1）问题分析阶段（2）需求分析阶段（3）需求定义阶段"}]}, {"name": "问：评价与衡量系统设计目标实现程度的主要指标？", "children": [{"name": "答：（1）系统的可靠性（2）系统的可变更性（3）系统的效率（4）系统的通用性（5）系统的工作质量"}]}, {"name": "问：系统设计的主要内容？", "children": [{"name": "答：（1）系统总体结构设计（2）处理流程设计（3）代码设计（4）人机界面设计（5）输出设计（6）输入设计（7）数据库设计（8）安全保密设计（9）系统物理配置方案设计（10）编写系统设计说明书"}]}, {"name": "问：应用系统组合法(APA)的过程步骤？", "children": [{"name": "答：（1）应用系统清单（2）评估应用系统（3）分析应用系统组合（4）制定优化策略（5）实施优化计划（6）监测和评估"}]}, {"name": "问：ADM 全生命周期模型的阶段？", "children": [{"name": "答：（1）预备阶段（2）需求管理（3）架构愿景（4）业务架构（5）信息系统架构（应用和数据）（6）技术架构（7）机会和解决方案（8）迁移规划（9）实施治理（10）架构变更治理"}]}, {"name": "问：SOA 的主要适用场景？", "children": [{"name": "答：（1）组织级应用集成（2）业务流程管理（3）系统扩展和重用（4）云计算和微服务架构（5）跨平台集成"}]}, {"name": "问：软件工厂的建设方法？", "children": [{"name": "答：（1）组织建设（2）资源部署（3）业务管理（4）体系保障"}]}, {"name": "问：软件项目交付的具体内容？", "children": [{"name": "答：（1）发布管理（2）安全性检查（3）事件响应计划"}]}, {"name": "问：软件发布后运营阶段的具体内容？", "children": [{"name": "答：（1）安全监控（2）安全运营（3）风险评估（4）应急响应（5）升级与变更管理（6）服务与技术支持（7）运营反馈"}]}]}, {"name": "第 6 章云资源规划", "children": [{"name": "问：云资源规划的重要性和目标？", "children": [{"name": "答：（1）提高效率（2）降低成本（3）确保可扩展性（4）提高可靠性和弹性（5）支持业务需求"}]}, {"name": "问：云资源规划的关键要素？", "children": [{"name": "答：（1）业务需求分析（2）资源评估和规划（3）预算管理（4）安全和合规性（5）弹性和可扩展性（6）性能优化（7）监控和管理"}]}, {"name": "问：云资源规划的基本流程？", "children": [{"name": "答：（1）需求收集（2）资源评估和规划（3）预算管理（4）设计与实施（5）持续优化"}]}, {"name": "问：云计算架构的要素？", "children": [{"name": "答：（1）服务类型：公有云，私有云，混合云（2）服务模式：Iass，Pass，Saas，Fass（3）内部特征：虚拟化、弹性扩展、自动化管理、多租户支持、资源编排和管理（4）外部特征：可靠性和可用性、安全性、网络连接性、成本效益"}]}, {"name": "问：计算资源规划的范围？", "children": [{"name": "答：（1）硬件资源规划（2）虚拟化（3）容器化（4）弹性扩展和负载均衡（5）容量规划和预测（6）资源管理和调度"}]}, {"name": "问：常用的计算资源规划方法和技术？", "children": [{"name": "答：（1）容量规划（2）性能优化（3）负载均衡（4）弹性伸缩（5）虚拟化和容器化（6）自动化管理（7）云资源管理"}]}, {"name": "问：计算资源规划的关键步骤？", "children": [{"name": "答：（1）需求分析（2）容量规划（3）云服务选择（4）虚拟化策略（5）安全性考虑（6）成本效益分析（7）持续监控和维护"}]}, {"name": "问：存储资源规划的定义和范围？", "children": [{"name": "答：（1）存储类型选择（2）存储容量规划（3）数据备份和冗余（4）存储性能优化（5）数据安全和隔离（6）存储管理和调度"}]}, {"name": "问：存储资源规划的一般步骤？", "children": [{"name": "答：（1）收集需求（2）分析和评估存储需求（3）技术选择（4）架构设计（5）安全规划（6）容量规划（7）性能优化（8）管理和监控（9）定期评估和调整"}]}, {"name": "问：云数据中心的要素？", "children": [{"name": "答：（1）面向服务（2）资源池化（3）高效智能（4）按需供给（5）低碳环保"}]}]}, {"name": "第 7 章网络环境规划", "children": [{"name": "问：信息网络系统一般体系模型包括哪些内容？", "children": [{"name": "答：（1）网络传输平台（2）网络和应用服务平台（3）安全服务平台（4）网络管理和维护平台（5）环境系统"}]}, {"name": "问：广域网规划的主要内容？", "children": [{"name": "答：（1）建设背景（2）需求分析（3）项目预算（4）技术方向（5）网络拓扑结构设计（6）IP 地址等逻辑资源规划"}]}, {"name": "问：局域网规划重点关注的内容？", "children": [{"name": "答：（1）VLAN 划分（2）VLAN 编号（3）VLAN 间路由设计（4）STP 设计（5）DHCP 设计"}]}, {"name": "问：无线网规划应重点关注的内容？", "children": [{"name": "答：（1）无线频率规划（2）无线传输覆盖范围规划（3）无线传输容量规划（4）无线基站站址规划（5）无线组网规划"}]}, {"name": "问：网络整体规划的重点事项？", "children": [{"name": "答：（1）网络管理维护（2）网络安全（3）机房建设（4）综合布线（5）监控系统（6）节能降耗"}]}, {"name": "问：网络管理的功能？", "children": [{"name": "答：（1）故障管理（2）配置管理（3）性能管理（4）计费管理（5）安全管理"}]}, {"name": "问：网络安全管理的重点内容？", "children": [{"name": "答：（1）安全组织和责任（2）风险管理工作机制（3）应急处理工作机制（4）容灾备份工作机制（5）制定系统上线、切换办法及安全运维方案"}]}]}, {"name": "第 8 章数据资源规划", "children": [{"name": "问：数据资源规划的作用？", "children": [{"name": "答：（1）提质增效（2）缓解“数据孤岛”问题（3）标准化与共享（4）市场化发展"}]}, {"name": "问：数据资源规划的方法？", "children": [{"name": "答：（1）基于稳定信息过程的方法（2）基于稳定信息结构的方法（3）基于指标能力的方法"}]}, {"name": "问：基于稳定信息过程的方法的核心步骤？", "children": [{"name": "答：（1）定义职能域（2）各职能域业务分析（3）各职能域数据分析（4）建立领域的数据资源管理基础标准（5）建立信息系统功能模型（6）建立信息系统数据模型（7）建立关联模型"}]}, {"name": "问：基于稳定信息过程的方法的内容？", "children": [{"name": "答：（1）可行性分析（2）确定目标和范围（3）准备（4）业务活动研究（5）建立业务逻辑模型（6）导出并建立数据模型（7）建立管理标准（8）设计主题数据库（9）数据的分布分析（10）制定方案（11）审核、评价方案"}]}, {"name": "问：基于稳定信息过程的方法规划过程中需注意的问题？", "children": [{"name": "答：（1）数据资源规划的开发方法，必须来自最高层的策划（2）数据资源规划的基础是建立业务模型和数据模型（3）数据资源规划的核心是模型分析（4）数据资源规划的重点是建立主题数据库（5）系统建设要与管理体制相互适应"}]}, {"name": "问：基于稳定信息结构的数据资源规划方法的步骤？", "children": [{"name": "答：（1）确定目标与系统边界（2）获取初始数据集（3）建立核心数据集（4）完善目标数据集（5）建立信息模型"}]}, {"name": "问：建立核心数据集的步骤？", "children": [{"name": "答：（1）数据项审查（2）主题审查（3）功能审查（4）任务审查（5）核心数据集审查"}]}, {"name": "问：基于指标能力的数据资源规划步骤？", "children": [{"name": "答：（1）决策评估收集（2）支撑指标分析（3）指标体系构建（4）建立指标数据模型并分析数据集（5）数据子集融合（6）核心数据集的一致性检验（7）核心数据集评价（8）完善目标数据集（9）完成数据资源规划"}]}, {"name": "问：数据标准化的内容？", "children": [{"name": "答：（1）建立数据标准体系（2）元数据标准化（3）数据元标准化（4）数据分类与编码标准化"}]}, {"name": "问：数据标准的分类？", "children": [{"name": "答：（1）指导标准（2）通用标准（3）专用标准"}]}, {"name": "问：元数据的作用？", "children": [{"name": "答：（1）描述（2）定位（3）寻找或发掘（4）评价（5）选择"}]}, {"name": "问：数据治理的活动？", "children": [{"name": "答：（1）规划组织的数据治理（2）制定数据治理战略（3）实施数据治理（4）嵌入数据治理"}]}, {"name": "问：数据质量的活动？", "children": [{"name": "答：（1）定义高质量数据（2）定义数据质量战略（3）识别关键数据和业务规则（4）执行初始数据质量评估（5）识别改进方向并确定优先排序（6）定义数据质量改进目标（7）开发和部署数据质量操作"}]}, {"name": "问：数据安全的活动？", "children": [{"name": "答：（1）识别数据安全需求（2）制定数据安全制度（3）定义数据安全细则（4）评估当前安全风险（5）实施控制和规程"}]}]}, {"name": "第 9 章信息安全规划", "children": [{"name": "问：信息安全的基本属性？", "children": [{"name": "答：（1）保密性（2）完整性（3）可用性（4）可控性（5）不可否认性"}]}, {"name": "问：信息安全规划的注意事项？", "children": [{"name": "答：（1）追求有效益的安全（2）信息安全战略的校准（3）基于业务的风险理解（4）识别出合规性要求"}]}, {"name": "问：信息安全规划的主要内容？", "children": [{"name": "答：（1）关注利益相关方的安全诉求（2）信息安全组织体系规划（3）信息安全管理体系规划（4）信息安全技术体系规划（5）信息安全运营体系规划"}]}]}, {"name": "第 10 章云原生系统规划", "children": [{"name": "问：云原生架构的设计原则？", "children": [{"name": "答：（1）服务化（2）弹性（3）可观测（4）韧性（5）所有过程自动化（6）零信任（7）架构持续演进"}]}, {"name": "问：云原生架构规划实施路线图的步骤？", "children": [{"name": "答：（1）微服务采用及运行环境容器云平台构建（2）服务管理和治理（3）持续交付及安全（4）自服务敏捷响应基础设施（5）增强生产环境韧性和安全性"}]}]}, {"name": "第 11 章信息系统治理", "children": [{"name": "问：IT 治理的主要目标？", "children": [{"name": "答：（1）与业务目标一致（2）有效利用信息与数据资源（3）风险管理"}]}, {"name": "问：IT 治理的核心内容？", "children": [{"name": "答：（1）组织职责（2）战略匹配（3）资源管理（4）价值交付（5）风险管理（6）绩效管理"}]}, {"name": "问：IT 治理活动的主要任务？", "children": [{"name": "答：（1）全局统筹（2）价值导向（3）机制保障（4）创新发展（5）文化助推"}]}, {"name": "问：IT 审计流程的阶段？", "children": [{"name": "答：（1）审计准备（2）审计实施（3）审计终结（4）后续审计"}]}]}, {"name": "第 12 章信息系统服务管理", "children": [{"name": "问：信息系统服务管理的主要活动？", "children": [{"name": "答：（1）服务战略规划（2）服务设计实现（3）服务运营提升（4）服务退役终止（5）持续改进与监督"}]}, {"name": "问：服务战略规划的主要活动？", "children": [{"name": "答：（1）规划设计活动（2）服务目录管理（3）服务需求识别（4）服务级别设计"}]}, {"name": "问：服务目录管理的步骤", "children": [{"name": "答：（1）成立管理小组（2）列举服务清单（3）确定服务类别与编码（4）编制服务详述（5）评审并发布服务目录（6）完善服务目录"}]}, {"name": "问：客户对信息系统服务的需求？", "children": [{"name": "答：（1）可用性需求（2）连续性需求（3）服务能力需求（4）信息安全需求（5）价格需求（6）服务报告需求"}]}, {"name": "问：可用性的相关指标？", "children": [{"name": "答：（1）平均无故障时间(MTBF)=系统运行时间÷系统在运行时间的故障次数（2）平均故障修复时间(MTTR)=系统故障耗时÷故障次数（3）平均故障间隔(MTBSI)=平均无故障时间+平均故障修复时间"}]}, {"name": "问：典型服务报告的内容？", "children": [{"name": "答：（1）按照既定服务水平目标衡量的服务绩效（2）主要工作的绩效报告（3）工作的特点和工作量信息（4）某段时间的趋势信息（5）报告中要包含未来计划工作的信息"}]}, {"name": "问：SLA、OLA、UC 的定义？", "children": [{"name": "答：（1）服务级别协议(SLA)是在一定成本控制下，为保障服务的性能和可靠性，服务供方与客户间定义的一种双方认可的协定（2）运营级别协议(OLA)是与某个内部信息服务部门就某项信息系统服务所签订的后台协议（3）支持合同(UC)是指服务供需双方签订的有关服务实施的正式合同"}]}, {"name": "问：服务设计实现的主要活动？", "children": [{"name": "答：（1）服务模式设计（2）人员要素设计（3）资源要素设计（4）技术要素设计（5）过程要素设计"}]}, {"name": "问：信息系统服务模式的设计考虑因素？", "children": [{"name": "答：（1）选择的服务模式与客户可用性、连续性、安全性等方面的服务需求相一致（2）服务供方的人员和资源配置与所设计的服务模式相匹配（3）服务供方具备同时提供多种服务模式的能力，能够根据客户需求的变化，及时对服务模式进行调整"}]}, {"name": "问：人员要素设计的内容？", "children": [{"name": "答：（1）人员岗位和职责设计（2）人员绩效方案设计（3）人员培训方案设计"}]}, {"name": "问：人员要素设计的目标？", "children": [{"name": "答：（1）确保服务团队组织架构与服务需求和服务模式相适应（2）确保配置的服务人员数量能同时满足服务和成本两方面的需求（3）确保服务人员的能力持续满足服务的需求（4）保持服务人员稳定的工作状态（5）保持服务人员的连续性"}]}, {"name": "问：信息系统服务团队的主要岗位？", "children": [{"name": "答：（1）管理岗（2）技术支持岗（3）操作岗"}]}, {"name": "问：人员绩效方案设计的活动？", "children": [{"name": "答：（1）确定绩效指标（2）明确考核信息来源（3）制定绩效指标计算方法（4）定义绩效考核周期（5）设计绩效考核策略"}]}, {"name": "问：人员培训方案设计的活动？", "children": [{"name": "答：（1）培训需求分析（2）培训内容设计（3）培训实施过程设计（4）培训效果评价方法设计"}]}, {"name": "问：资源要素设计的内容？", "children": [{"name": "答：（1）服务工具（2）服务台（3）备件库（4）知识库"}]}, {"name": "问：常见的信息系统服务工具？", "children": [{"name": "答：（1）监控类工具（2）过程管理类工具（3）其他工具"}]}, {"name": "问：服务台设计的注意事项？", "children": [{"name": "答：（1）设置专门的沟通渠道作为与需方的联络点（2）设定专人负责服务请求的处理（3）针对沟通渠道整合服务过程，建立管理制度"}]}, {"name": "问：备件库设计的注意事项？", "children": [{"name": "答：（1）备件响应方式和级别定义，能够满足 SLA 所约定的备件支持（2）备件供应商管理，能够规范备件的采购过程，对供应商进行选择和评价（3）备件出入库管理，能够对入库备件进行标识，规范备件的使用和核销，备件物品的账务管理（4）备件可用性管理，能够定期对备件状态进行检测，以确保其功能满足运行维护需求"}]}, {"name": "问：知识库设计的注意事项？", "children": [{"name": "答：（1）针对常见问题的描述、分析和解决方法建立知识库（2）确保整个组织内的知识是可用的、可共享的（3）选择一种合适的知识管理策略（4）知识库具备知识的添加、更新和查询功能（5）针对知识管理要求制定相关管理制度，并进行知识生命周期管理"}]}, {"name": "问：技术要素设计的内容？", "children": [{"name": "答：（1）技术研发（2）发现问题的技术（3）解决问题的技术"}]}, {"name": "问：发现问题的技术？", "children": [{"name": "答：（1）制订监控指标及阈值表（2）制订测试环境建设计划"}]}, {"name": "问：解决问题的技术？", "children": [{"name": "答：（1）制订技术活动标准操作流程（2）制订应急预案（3）完成知识转移"}]}, {"name": "问：信息系统服务管理过程有哪些？", "children": [{"name": "答：（1）服务级别管理过程（2）服务报告管理过程（3）事件管理过程（4）问题管理过程（5）配置管理过程（6）变更管理过程（7）发布管理过程（8）信息安全管理过程"}]}, {"name": "问：服务级别管理过程设计的主要活动？", "children": [{"name": "答：（1）建立服务目录，签订服务级别协议（2）建立 SLA 考核评估机制，包括SLA 完成情况、达成率等（3）制定改进及跟踪验证机制"}]}, {"name": "问：服务级别管理的关键指标？", "children": [{"name": "答：（1）服务目录定义的完整性（2）签订服务级别协议文件的规范性（3）SLA考核评估机制的有效性和完整性"}]}, {"name": "问：服务报告管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与服务报告过程一致的活动，包括建立、审批、分发、归档等（2）制订服务报告计划，包括提交方式、时间、需方接收对象等（3）建立服务报告模板，包括格式、提纲等"}]}, {"name": "问：服务报告管理的关键指标？", "children": [{"name": "答：（1）服务报告过程的完整性（2）服务报告的及时性、准确性"}]}, {"name": "问：事件管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与事件管理过程一致的活动，包括事件受理、分类分级、初步支持、调查诊断、解决、进度监控与跟踪、关闭等（2）建立事件分类、分级机制（3）建立事件升级机制（4）建立事件满意度调查机制（5）建立事件解决评估机制，包括事件及时解决率、事件平均解决时间等"}]}, {"name": "问：事件管理的关键指标？", "children": [{"name": "答：（1）事件管理过程的完整性、有效性（2）事件解决评估机制的有效性"}]}, {"name": "问：问题管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与问题管理过程一致的活动，包括问题建立、分类、调查和诊断、解决、错误评估、关闭等（2）建立问题分类管理机制，包括问题的影响范围、重要程度、紧急程度并确定优先级（3）建立问题导入知识库机制（4）建立问题解决评估机制，包括问题解决率、问题平均解决时间等"}]}, {"name": "问：问题管理的关键指标？", "children": [{"name": "答：（1）问题管理过程的完整性（2）问题解决评估机制的有效性"}]}, {"name": "问：配置管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与配置管理过程一致的活动，包括识别、记录、更新和审计等（2）建立配置数据库管理机制（3）建立配置项审计机制"}]}, {"name": "问：配置管理的关键指标？", "children": [{"name": "答：（1）配置管理过程的完整性（2）配置数据的准确、完整、有效、可用、可追溯（3）配置项审计机制的有效性"}]}, {"name": "问：变更管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与变更管理过程一致的活动，包括请求、评估、审核、实施、确认和回顾等（2）建立变更类型和范围的管理机制（3）建立变更过程和结果的评估机制，包括未经批准的变更数量及占比、不同类型的变更数量及占比、不成功的变更数量及占比、取消的变更数量及占比、变更关联的配置数"}]}, {"name": "问：变更管理的关键指标？", "children": [{"name": "答：（1）变更管理过程的完整性（2）变更记录的完整性"}]}, {"name": "问：发布管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与发布管理过程一致的活动，包括规划、设计、建设、配置和测试等（2）建立发布类型和范围的管理机制（3）制定完整的方案，包括发布计划、回退方案、发布记录等（4）建立发布过程和结果的评估机制，包括发布成功率、发布及时率、是否更新配置管理数据库等"}]}, {"name": "问：发布管理的关键指标？", "children": [{"name": "答：（1）发布管理过程的完整性（2）发布过程记录的完整性、准确性"}]}, {"name": "问：信息安全管理过程设计的主要活动？", "children": [{"name": "答：（1）确定与信息安全管理过程一致的活动，包括识别、评估、处置和改进等（2）建立与信息系统服务要求一致的信息安全策略、方针和措施"}]}, {"name": "问：信息安全管理的关键指标？", "children": [{"name": "答：（1）信息的保密性（2）信息的可用性（3）信息的完整性"}]}, {"name": "问：服务运营提升的主要活动？", "children": [{"name": "答：（1）业务关系管理（2）服务营销管理（3）服务成本度量（4）服务项目预算、核算和结算（5）服务外包收益"}]}, {"name": "问：业务关系管理的内容？", "children": [{"name": "答：（1）客户关系管理（2）供应商关系管理（3）第三方关系管理"}]}, {"name": "问：客户关系管理的内容？", "children": [{"name": "答：（1）服务并管理好客户需求（2）培养客户对服务更积极的评价和应用（3）与客户建立长期和有效的业务关系（4）实现共赢发展"}]}, {"name": "问：客户关系管理的活动？", "children": [{"name": "答：（1）定期沟通（2）日常沟通（3）高层拜访（4）投诉管理（5）表扬管理（6）满意度调查（7）增值服务"}]}, {"name": "问：增值服务的原则？", "children": [{"name": "答：（1）不能影响现有协议约定的服务内容（2）增值服务需贴和客户需求（3）增值服务的投入在可接受范围内（4）本身有能力对增值服务的内容进行引申"}]}, {"name": "问：供应商关系管理的目标？", "children": [{"name": "答：（1）与供应商建立互信、有效的协作关系（2）整合资源，共同开拓保持客户（3）与供应商建立长期、紧密的业务关系（4）实现与供应商的合作共赢"}]}, {"name": "问：供应商关系管理的活动？", "children": [{"name": "答：（1）供应商的选择/推荐（2）供应商审核及管理（3）供应商间的协调（4）争议处理（5）支持合同管理"}]}, {"name": "问：供应商关系管理可能存在的风险和控制措施？", "children": [{"name": "答：（1）可能出现利益及责任分配问题，需签署明确有效的支持合同，避免留有产生争议的空间，及时识别潜在争议并有效处理；（2）多供应商之间可能存在配合问题，需建立良好的供应商协作及沟通机制；（3）供应商组织变动或业务发生变更，需定期对供应商情况进行审核及评估，积极识别可能的风险并提前预防，建立多供应商竞争及备份机制，及时向客户传递相关信息；（4）多级分包可能对服务质量及业务持续性保障造成挑战，需与分包商明确知识产权及相关信息安全要求，约定审核条款，对整个服务保障链条进行定期审核及评估，保持与客户的紧密沟通，对供应商限定分包内容；（5）供应商不配合，需签署明确有效的支持合同，选择有效的供应商，定期对供应商进行评估审核，争取供应商高层支持和配合，加强与供应商协作沟通"}]}, {"name": "问：第三方关系管理的活动？", "children": [{"name": "答：（1）定期沟通（2）日常沟通（3）信息收集分享（4）第三方关系协调（5）配合支持第三方工作"}]}, {"name": "问：第三方关系管理可能存在的风险和控制措施？", "children": [{"name": "答：（1）沟通不顺畅，需建立良好的第三方协作沟通机制；（2）未能提前识别并约定所有可能的情况，出现利益及责任分配问题，需与第三方界定工作的协作机制，避免留有产生争议的空间"}]}, {"name": "问：IT 服务营销过程？", "children": [{"name": "答：（1）启动准备阶段：营销准备、营销计划（2）调研交流阶段：做好需求调研、写好解决方案（3）能力展示阶段：做好产品展示、保持持续沟通（4）服务达成阶段：达成服务协议、做好持续服务"}]}, {"name": "问：服务成本度量应考虑因素？", "children": [{"name": "答：（1）服务对象规模（2）单位工作量（3）调整因子"}]}, {"name": "问：项目预算的制定步骤？", "children": [{"name": "答：（1）识别项目预算收入项与开支项（2）划分 IT 服务项目执行阶段（3）形成预算表"}]}, {"name": "问：IT 服务项目核算的主要内容？", "children": [{"name": "答：（1）编制核算记录表（2）组织资源使用情况核算（3）核算分析与总结"}]}, {"name": "问：衡量项目效益的指标？", "children": [{"name": "答：（1）项目投入产出比。R=K/IN=1:N其中，R 为投入产出比，K 为项目投资总额，IN 为项目收入总额；（2）项目投资回报率=项目利润/项目投资总额；（3）项目净产出是指项目的净利润产出总额，净利润需要在收入的基础上扣除所有开支；（4）人均产出。单位人均产出=净利润总额/人员数量"}]}, {"name": "问：IT 服务外包给企业带来的收益？", "children": [{"name": "答：（1）成本效益（2）效率提升（3）降低风险（4）专注于主营业务（5）管理简单（6）提升满意度"}]}, {"name": "问：服务退役终止阶段供需双方沟通的会议形式？", "children": [{"name": "答：（1）服务终止计划编制会议（2）服务终止计划评审会议（3）移交会议（4）经验交流会"}]}, {"name": "问：服务终止计划评审过程中的注意事项？", "children": [{"name": "答：（1）参会人员共同评审服务终止计划，明确服务终止过程中的各方责任（2）确定在服务终止过程中所涉及的所有任务的分配（3）明确在服务终止阶段需要通知或联系的第三方（4）确定移交会议可能涉及的部门、人员及议程（5）服务终止计划需获得供需双方高层的批准，并取得各利益相关方的接受"}]}, {"name": "问：服务移交的内容？", "children": [{"name": "答：（1）文件信息移交可包括服务使用手册、服务指南、服务维护技术相关文档等（2）知识移交可包括服务相关维护知识、服务的问题解决方案等（3）技能移交可包括服务提供技能、服务维护技能、服务改善技能、服务问题发现技能等（4）基线移交可包括服务运营环境的服务组件的状态及相关属性和设置（5）模拟环境移交可包括服务模拟环境的服务组件及相关环境组成要素"}]}, {"name": "问：服务退役终止过程中所面临的风险？", "children": [{"name": "答：（1）数据风险（2）业务连续性风险（3）法律法规风险（4）信息安全风险"}]}, {"name": "问：服务退役终止过程中资源回收的主要工作？", "children": [{"name": "答：（1）文件归档（2）财务资源回收（3）人力资源回收（4）基础设施资源回收"}]}, {"name": "问：信息转移和清除的具体过程？", "children": [{"name": "答：（1）确定要转移或清除的信息资产，列出要转移或清除的信息资产清单（2）制定信息资产的处理方式和处理流程，如果包含敏感或涉密信息，应按照国家相关部门的规定进行转移和清除（3）按照信息资产处理方式和流程对信息资产进行转移和清除，监控实施过程中出现的意外情况，并记录信息转移和清除的过程，包括参与的人员、转移和清除的方式以及目前信息所处的位置等"}]}, {"name": "问：存储介质清除或销毁的具体过程？", "children": [{"name": "答：（1）确定要清除或销毁的介质，列出要清除或销毁的存储介质清单（2）根据存储介质承载信息的敏感程度制定对存储介质的处理方案，包括数据清除和存储介质销毁等，如存储介质包含敏感信息，应按照国家相关部门的规定进行处理（3）严格按照存储介质处理方案对存储介质进行清除或销毁，监督介质处理过程中的风险，记录清除或销毁的过程，检查是否有残余信息等"}]}, {"name": "问：持续改进与监督环节的主要活动？", "children": [{"name": "答：（1）服务风险管理（2）服务测量（3）服务质量管理（4）服务回顾（5）服务改进"}]}, {"name": "问：服务测量活动的价值？", "children": [{"name": "答：（1）验证之前所做的决策是否正确，所做的工作是否有效果（2）目前的服务在成本、质量、有效性等方面是否比之前有所改进（3）证明服务改进活动的必要性，并向管理层争取必要的资源，以支持服务改进（4）指导服务改进活动的方向和目标"}]}, {"name": "问：服务测量的活动？", "children": [{"name": "答：（1）服务人员测量（2）服务资源测量（3）服务技术测量（4）服务过程测量"}]}, {"name": "问：服务人员测量的活动？", "children": [{"name": "答：（1）识别备份工程师对项目的满足度和可用性（2）测量人员招聘需求匹配率（3）收集培训的应用情况，如培训覆盖率、满意度及评价（4）人员能力测量，如识别并收集考评团队内部最新的人员技能、资历认证等（5）服务工作量测量，如根据来电量进行服务台人员配比预测等（6）岗位职责更新情况，如识别最新组织结构变化等（7）人员绩效考核分配机制测量，如关注分配比例的合理性（8）实时监控团队工作状态，如关注员工异动隐患等"}]}, {"name": "问：服务资源测量的内容？", "children": [{"name": "答：（1）IT 服务运维工具（2）服务台（3）备件库（4）知识库"}]}, {"name": "问：IT 服务运维工具的测量活动？", "children": [{"name": "答：（1）测量工具的功能与服务管理过程是否有效匹配（2）周期性识别相关工具的使用手册是否有效并进行相关验证（3）监视 IT 服务运维工具的健康状态"}]}, {"name": "问：服务台的关键测量指标？", "children": [{"name": "答：（1）接听率=服务台人员响应的电话总数量/用户呼叫服务台的总数量×100%（2）派单准确率=服务台人员首次派单得到解决的事件或服务请求总数量/事件或服务请求总的数量×100%（3）录单率=接收用户呼叫并做记录的事件或服务请求总数量/服务台接到的所有用户呼叫总数量×100%（4）平均通话时间=用户呼叫持续总时间/事件或服务请求总数量×100%"}]}, {"name": "问：备件库的测量活动？", "children": [{"name": "答：（1）盘点备件资产（2）统计备件损坏率（3）统计备件命中率（4）统计备件复用率"}]}, {"name": "问：知识库的测量内容？", "children": [{"name": "答：（1）收集知识的积累数量（2）知识的利用率（3）知识的更新率（4）知识的完整性（5）各类知识的比重（6）知识新增数量与事件、问题发生数量的对比关系"}]}, {"name": "问：服务技术测量的内容？", "children": [{"name": "答：（1）识别研发规划（2）识别研发成果（3）技术手册及 SOP 统计（4）应急预案实施统计（5）监控点和阈值统计"}]}, {"name": "问：服务过程测量的层次？", "children": [{"name": "答：（1）服务管控（2）服务执行"}]}, {"name": "问：服务管控测量的内容？", "children": [{"name": "答：（1）服务 SLA 达成率分析（2）重大事件分析（MTTR、服务效率）（3）人员绩效分析"}]}, {"name": "问：服务执行测量的内容？", "children": [{"name": "答：（1）事件统计分析（2）问题统计分析（3）变更与发布统计分析（4）配置统计分析"}]}, {"name": "问：服务质量的特性？", "children": [{"name": "答：（1）安全性：可用性、完整性、保密性（2）可靠性：完备性、连续性、稳定性、有效性、可追溯性（3）响应性：及时性、互动性（4）有形性：可视性、合规性、专业性（5）友好性：主动性、灵活性、礼貌性"}]}, {"name": "问：服务质量管理的活动？", "children": [{"name": "答：（1）服务质量策划（2）服务质量检查（3）服务质量改进"}]}, {"name": "问：服务质量策划的内容？", "children": [{"name": "答：（1）确定服务质量的目标（2）确定服务质量管理的活动（3）确定服务质量管理相关的职责和权限（4）确定时间安排（5）确定质量策划文件"}]}, {"name": "问：常见的质量实施和检查活动？", "children": [{"name": "答：（1）满意度调查（2）项目质量保证工作（3）内审（4）管理评审（5）日常检查（6）质量文化培训"}]}, {"name": "问：四级服务回顾机制？", "children": [{"name": "答：（1）针对重大事件、特殊事件的沟通，包括服务内容变更、客户投诉等（2）项目月度例会，向客户汇报当月服务情况，包括服务量、SLA 达成率，当月重大事件等内容（3）项目季度回顾，向客户汇报当季项目运营情况，包括服务数据分析、SLA 达成率、客户满意度、服务改进计划等内容（4）合作年度回顾，回顾项目的整体实施交付情况"}]}, {"name": "问：与客户回顾的内容？", "children": [{"name": "答：（1）服务合同执行情况（2）服务目标达成情况（3）服务绩效、成果（4）满意度调查（5）服务范围、工作量（6）客户业务需求的变化（7）服务中存在的问题及行动计划（8）上一次会议中制订的行动计划的进展汇报"}]}, {"name": "问：与团队内部回顾的内容？", "children": [{"name": "答：（1）上周期工作计划回顾（2）本周期内遇到的特殊或疑难工单（3）讨论本周期内未解决的工单（4）各小组工作简报（5）本周期的问题回顾（6）本周期内的工程师 KPI 总结（7）下周期工作计划安排"}]}, {"name": "问：服务改进的主要活动？", "children": [{"name": "答：（1）服务改进设计（2）服务改进实施（3）服务改进验证"}]}, {"name": "问：服务改进设计的主要内容？", "children": [{"name": "答：（1）定义服务改进目标（2）识别服务改进输入（3）制订服务改进计划（4）确认服务改进职责"}]}, {"name": "问：定义服务改进目标的注意事项？", "children": [{"name": "答：（1）改进目标应与服务目标相一致（2）改进目标应是现实可行并是可测定的（3）改进目标是进行改进项目或活动回顾的重要依据"}]}, {"name": "问：服务改进计划的内容？", "children": [{"name": "答：（1）文档介绍：包括文档简介、文档目的（2）服务改进活动基本信息：包括服务改进活动名称、改进活动负责人、改进活动团队成员、计划活动起止时间、主要预期成果（3）服务改进描述：包括服务改进动机、服务改进目标、涉及范围（4）服务改进方案：包括总体方案和进度安排、各阶段具体活动、预算和资源安排（5）角色和职责：包括角色、职责、活动（6）服务改进回顾：包括主要衡量标准、改进回顾团队、时间安排"}]}, {"name": "问：服务改进实施中人员要素的改进内容？", "children": [{"name": "答：（1）改善人员管理体制（2）提高 IT 人员素质（3）调整人员储备比例（4）调整人员和岗位结构"}]}, {"name": "问：服务改进实施中资源要素的改进内容？", "children": [{"name": "答：（1）保障各类资源对业务的完整覆盖和支撑作用（2）持续完善 IT 工具（3）持续优化服务台管理制度（4）知识库管理制度改进（5）备件库管理制度改进"}]}, {"name": "问：服务改进实施中技术要素的改进内容？", "children": [{"name": "答：（1）技术研发计划重新规划及改进（2）技术成果优化改进（3）完善技术文档（4）改进应急预案（5）更新监控指标及阈值"}]}, {"name": "问：服务改进实施中过程要素的改进内容？", "children": [{"name": "答：（1）完善现有过程（2）建立新的服务管理过程（3）调整过程考核指标（4）提升对外服务形象（5）提供新的服务（6）为业务部门提供管理报表"}]}, {"name": "问：服务改进验证的具体过程？", "children": [{"name": "答：（1）系统规划与管理师组织服务交付部门，按服务改进计划中所列项目对项目指标完成情况进行检查（2）对于未达标的项目，组织相关部门进行原因分析，制定改进措施（3）形成书面统计分析及改进报告，分别提报主管领导及监督部门（4）服务质量监督部门按照相关规定实施过程考核"}]}]}, {"name": "第 13 章人员管理", "children": [{"name": "问：人力资源管理的内容？", "children": [{"name": "答：（1）规划（2）招聘（3）维护（4）提升（5）评价"}]}, {"name": "问：工作分析的作用？", "children": [{"name": "答：（1）招聘和选择员工（2）发展和评价员工（3）薪酬政策（4）组织与岗位设计"}]}, {"name": "问：工作分析的步骤？", "children": [{"name": "答：（1）明确工作分析范围（2）确定工作分析方法（3）工作信息收集和分析（4）评价工作分析方法"}]}, {"name": "问：工作分析的核心流程？", "children": [{"name": "答：（1）明确工作分析对象（2）选择收集工作分析信息的人员（3）编制工作说明书（4）工作分析的评价"}]}, {"name": "问：岗位设计的主要内容？", "children": [{"name": "答：（1）工作内容设计（2）工作职责设计（3）工作关系设计"}]}, {"name": "问：人力资源需求超过供给的解决方法？", "children": [{"name": "答：（1）增加录用的数量（2）提高每位员工的生产率或延长他们的工作时间"}]}, {"name": "问：人力资源供给超过需求的解决方法？", "children": [{"name": "答：（1）减少加班数量或工作时间（2）鼓励员工提前退休（3）减少新进员工的数量（4）让组织的供货商等上游合作伙伴以比较低廉的费率使用自己闲置的人力资源和生产设备（5）辞退"}]}, {"name": "问：人力资源计划的组成？", "children": [{"name": "答：（1）供给报表（2）需求报表（3）人力报表"}]}, {"name": "问：人力资源计划评价的比较项？", "children": [{"name": "答：（1）实际的人员招聘数量与预测的人员需求量；（2）工作效率的实际水平与预测水平；（3）实际的和预测的人员流动率；（4）实际执行的行动方案与计划的行动方案；（5）实施计划的行动方案的实际结果与预期结果；（6）人力费用的实际成本与人力费用预算；（7）行动方案的实际成本与行动方案的预算；（8）行动方案的成本与收益"}]}, {"name": "问：招聘活动的步骤？", "children": [{"name": "答：（1）招聘计划制订（2）招聘信息发布（3）应聘者申请（4）人员甄选与录用（5）招聘评估与反馈"}]}, {"name": "问：招聘计划的内容？", "children": [{"name": "答：（1）招聘的岗位、人员需求量、每个岗位的具体要求（2）招聘信息发布的时间、方式、渠道与范围（3）招聘对象的来源与范围（4）招聘方法（5）招聘测试的实施部门（6）招聘预算（7）招聘结束时间与新员工到位时间"}]}, {"name": "问：招聘评估的内容？", "children": [{"name": "答：（1）招聘周期（2）招聘完成率（3）招聘成本（4）用人单位满意率（5）录用人员评估"}]}, {"name": "问：招聘面试的程序？", "children": [{"name": "答：（1）面试前的准备（2）实施面试（3）评估面试结果"}]}, {"name": "问：招聘效果的评估维度？", "children": [{"name": "答：（1）招聘周期（2）用人部门满意度（3）招聘成功率（4）招聘达成率（5）招聘成本（6）试用期离职率（7）人才库建立（8）新员工满意度（9）外部渠道依赖性"}]}, {"name": "问：员工培训的基本步骤？", "children": [{"name": "答：（1）评估组织开展员工培训的需求（2）设定员工培训的目标（3）设计培训项目（4）培训的实施和评估"}]}, {"name": "问：绩效管理的环节？", "children": [{"name": "答：（1）绩效计划（2）绩效实施与监控（3）绩效考核（4）绩效反馈面谈"}]}, {"name": "问：绩效改进过程的步骤？", "children": [{"name": "答：（1）分析员工的绩效考核结果，找出员工绩效中存在的问题（2）针对存在的问题，制定合理的绩效改进方案，并确保能够有效实施，如个性化的培训等（3）实施已制定的绩效改进方案，尽可能为员工的绩效改进提供知识、技能等方面的帮助"}]}]}, {"name": "第 14 章规范与过程管理", "children": [{"name": "问：基于岗位职责的流程规划工作路径？", "children": [{"name": "答：（1）流程管理部门先确定每个部门的代表性岗位（2）流程管理部门与每个代表性岗位进行工作访谈（3）分解出主要工作并评价其重要度（4）流程管理部门梳理出工作中包含的流程及其关键控制要点（5）与各部门负责人访谈，补充和完善访谈结果（6）汇总各部门的流程信息，完成流程清单和流程框架等"}]}, {"name": "问：基于业务模型的流程规划工作路径？", "children": [{"name": "答：（1）流程管理部门根据组织业务绘制业务模式简易模型（2）流程管理部门进行模型分解（3）流程管理部门与流程干系人就模型与现有的流程进行关联对接（4）无法对接的部门，由流程管理部门与代表岗位人员进行工作访谈（5）完成流程清单和流程总图"}]}, {"name": "问：保障流程管理有效执行可参考的措施？", "children": [{"name": "答：（1）理解流程是执行流程的前提（2）做好流程变更后的推广（3）新员工入职流程制度培训（4）找对流程执行负责人（5）流程审计及监控（6）把流程固化到信息系统中（7）把流程固化到制度中（8）流程文化宣导"}]}, {"name": "问：流程稽查的基本实施步骤？", "children": [{"name": "答：（1）理解流程的目的、目标及管理原则（2）确定流程稽查的关键点（3）确定稽查方法（4）设计稽查线路与实施计划（5）开展流程稽查（6）提交流程稽查报告（7）跟进流程稽查问题整改"}]}, {"name": "问：流程效率的典型指标？", "children": [{"name": "答：（1）处理时间（2）投入产出比（3）增值时间比例（4）质量成本"}]}, {"name": "问：流程绩效评估结果分析的内容？", "children": [{"name": "答：（1）与流程绩效目标对比分析（2）在组织内部做横向比较（3）与同行业的主要竞争对手进行流程绩效对比分析（4）对流程绩效评估结果的稳定性进行分析"}]}, {"name": "问：流程审计的流程？", "children": [{"name": "答：（1）制订计划（2）确定审计范围（3）流程初步调研（4）编制检查表（5）制订审计实施计划（6）召开首次会议（7）现场审计（8）补充审计（9）编制审计报告（10）召开末次会议（11）改进追踪"}]}, {"name": "问：流程检查结果的应用？", "children": [{"name": "答：（1）流程优化（2）绩效考核（3）过程控制（4）纠正措施（5）战略调整"}]}]}, {"name": "第 15 章技术与研发管理", "children": [{"name": "问：技术研发的范围？", "children": [{"name": "答：（1）与系统运行相关的技术研发（2）技术规范的研发（3）发现信息系统中存在问题的技术和解决问题相关技术的研发（4）运行维护工具研发（5）IT服务产品研发"}]}, {"name": "问：技术研发管理对象主要包括？", "children": [{"name": "答：（1）研发团队（2）研发过程（3）研发成本（4）研发项目（5）研发绩效（6）研发风险"}]}, {"name": "问：技术研发管理的角色？", "children": [{"name": "答：（1）技术研发决策负责人（2）技术研发需求负责人（3）技术研发负责人（4）质量管理负责人（5）财务负责人"}]}, {"name": "问：技术研发的管理过程？", "children": [{"name": "答：（1）规划过程（2）实施过程（3）监控过程（4）应用过程"}]}, {"name": "问：技术研发管理要点有？", "children": [{"name": "答：（1）服务产品研发管理（2）IT 服务规范研发管理（3）服务工具研发管理（4）发现问题的技术和解决问题的技术研发管理（5）新技术研究管理"}]}, {"name": "问：服务产品研发管理的主要内容？", "children": [{"name": "答：（1）服务产品研发的定位（2）服务产品研发队伍（3）服务产品的研发成果"}]}, {"name": "问：IT 服务规范研发管理的内容？", "children": [{"name": "答：（1）IT 服务规范的研发定位（2）IT 服务规范的研发队伍（3）IT 服务规范的研发过程（4）IT 服务规范的研发环境（5）IT 服务规范研发的产出物"}]}, {"name": "问：服务工具研发管理的内容？", "children": [{"name": "答：（1）服务工具研发的定位（2）服务工具的研发队伍（3）服务工具的研发过程（4）服务工具研发环境（5）服务工具研发的产出物"}]}, {"name": "问：服务工具研发的产出物？", "children": [{"name": "答：（1）工具发布包、工具使用手册等，能够提供给最终用户进行安装、配置、使用（2）工具介绍文档，能够提供给潜在用户了解运维工具的特性，作为选择工具的依据（3）服务工具的需求文档、设计文档和源代码，能够提供给后续开发者进行升级开发和维护"}]}, {"name": "问：发现问题的技术和解决问题的技术研发管理的内容？", "children": [{"name": "答：（1）发现问题和解决问题相关技术研发的定位（2）发现问题和解决问题相关技术的研发队伍（3）发现问题和解决问题相关技术的研发过程（4）发现问题和解决问题相关技术的研发环境（5）发现问题和解决问题相关技术研发的产出物"}]}, {"name": "问：发现问题和解决问题相关技术研发的产出物？", "children": [{"name": "答：（1）具备问题诊断分析功能和有助于问题解决的软硬件工具（2）故障分析诊断技术文档和相关技术资料（3）故障诊断作业指导书（4）知识案例库（5）解决问题操作手册"}]}, {"name": "问：新技术研究管理的内容？", "children": [{"name": "答：（1）新技术研究的定位（2）新技术的研究队伍（3）新技术的研究过程（4）新技术的研究环境（5）新技术研究的产出物"}]}, {"name": "问：新技术研究的产出物？", "children": [{"name": "答：（1）应用前景分析报告（2）技术文档（3）培训教材"}]}, {"name": "问：技术研发应用的管理要点？", "children": [{"name": "答：（1）技术风险与机遇（2）判断与选择（3）技术验证（4）技术决策（5）技术应用（6）技术实现跟踪管理"}]}, {"name": "问：技术研发应用的主要应用？", "children": [{"name": "答：（1）知识转移（2）应急响应预案的制定与演练（3）SOP 标准操作规范（4）技术手册发布（5）搭建测试环境（6）对技术成果进行培训与知识转移（7）对技术成果的内容进行演练或推演（8）对技术成果进行优化改进"}]}, {"name": "问：知识转移的内容？", "children": [{"name": "答：（1）历史运维资料（2）基础架构资料（3）应用系统资料（4）业务资料"}]}, {"name": "问：应急预案与演练的情形？", "children": [{"name": "答：（1）自然灾害引起的对 IT 系统的灾难性破坏（2）网络通信设备、通信线路故障导致 IT 系统的重大故障（3）电源电路以及机房等基础设施故障导致 IT系统的重大故障（4）IT 系统数据库、系统和存储、中间件故障导致的重大系统性故障（5）IT 系统发生网络攻击破坏、计算机病毒传播或被利用从事违法犯罪活动等引发的重大安全突发事件（6）应用系统发生重大故障（7）组织认为应采取应急机制的其他 IT 系统重大突发事件"}]}, {"name": "问：应急演练的原则？", "children": [{"name": "答：（1）结合实际、合理定位（2）着眼实战、讲求实效（3）精心组织、确保安全（4）统筹规划、厉行节约"}]}, {"name": "问：SOP 的作用？", "children": [{"name": "答：（1）将企业积累下来的技术和经验记录在标准文件中，以免因技术人员的流动而使技术流失（2）使操作人员经过短期培训，快速掌握较为先进合理的操作技术（3）树立良好的服务形象，取得客户信赖与满意（4）SOP 是贯彻标准化作业的具体体现，实现服务管理规范化、服务流程条理化、标准化、操作的形象化、简单化（5）SOP 是系统规划与管理师最基本、最有效的技术管理手段"}]}, {"name": "问：SOP 的编写原则？", "children": [{"name": "答：（1）在人力、财力、物力等资源允许的范围内可以做到（2）IT 服务人员都能看懂，且每个人的理解都相同（3）效率最高和成本最低，并识别出关键风险点（4）SOP 正式发布前要经过测试与评价环节（5）可以根据业务与技术发展需求，实现快速迭代"}]}, {"name": "问：技术手册发布的流程？", "children": [{"name": "答：（1）审核（2）存档（3）发放"}]}, {"name": "问：对技术成果进行培训与知识转移的具体内容？", "children": [{"name": "答：（1）知识性研发成果培训（2）工具类研发成果培训（3）应急预案与解决方案手册的知识转移"}]}, {"name": "问：对技术成果的内容进行演练或推演的具体内容？", "children": [{"name": "答：（1）演练。定期对应急预案、灾备方案进行仿真演习，必要时需要所有相关方参加，并投入充足的资源（2）推演。通过沙盘或模拟的方式，对可能发生的情况进行研讨。根据多方的圆桌会议，最终对技术研究成果给予改进建议与评价"}]}, {"name": "问：组织知识产权管理的指导原则？", "children": [{"name": "答：（1）战略导向（2）领导重视（3）全员参与（4）全程管理"}]}, {"name": "问：知识产权管理的主要过程？", "children": [{"name": "答：（1）知识产权获取（2）知识产权的维护（3）知识产权运用（4）知识产权保护（5）知识产权合规管理"}]}, {"name": "问：知识产权获取的措施？", "children": [{"name": "答：（1）根据知识产权目标，制订不同类型知识产权的获取计划，明确获取的方式或途径（2）建立必要的审核机制或工作流程（3）确保专利质量得到管控（4）适时办理作品登记，明确职务作品、委托作品、合作作品等著作权及与著作权有关的权利的权属，保留作品创作过程的记录，保障作品作者的署名权（5）通过遴选、密级划分等方式确定商业秘密的范围、保密事项等，应明确商业秘密的接触范围、流转要求和存证方式"}]}, {"name": "问：知识产权维护的注意事项？", "children": [{"name": "答：（1）建立知识产权分类管理档案，进行日常维护（2）知识产权权属变更与放弃（3）进行知识产权相关会计信息披露（4）建立知识产权会计核算档案，有条件的组织定期对知识产权的成本和知识产权的产出效益进行核算（5）对涉及知识产权的产品和/或服务的资料加以保管，包括宣传、广告、促销、包装、说明书等（6）对知识产权进行分级管理（7）保留有关知识产权维护的成文信息，并实施有效的管理"}]}, {"name": "问：知识产权的运用？", "children": [{"name": "答：（1）实施和使用（2）许可和转让（3）投融资（4）企业重组（5）标准化"}]}, {"name": "问：知识产权保护中风险管理的内容？", "children": [{"name": "答：（1）采取措施，避免或降低生产经营活动中所涉及的设备、软件、作品和/或作品元素侵犯他人知识产权的风险（2）定期监控产品及工艺可能涉及他人知识产权的状况，分析可能发生的纠纷及其对组织的损害程度，提出防范与应对预案（3）应将知识产权纳入组织风险管理范围，对知识产权风险进行识别、分析和监测，采取相应风险控制措施（4）建立涉密人员、涉密载体、涉密设备、涉密区域、涉密信息的管理要求，按要求开展商业秘密管理工作（5）对外信息披露前，开展必要的知识产权合规、保密审查，并保留成文信息（6）组织结合风险发生的时间、频次、影响因素及后果等方面开展知识产权风险分析，并根据可能造成的影响及其后果的严重程度，将风险进行相应的分级，对不同级别的风险采取适当的方式加以预防和应对"}]}, {"name": "问：知识产权保护中争议处理的内容？", "children": [{"name": "答：（1）及时发现和监控知识产权被侵犯的情况，适时提出应对方案，运用自力救济、行政和司法救济等途径保护知识产权（2）在处理知识产权纠纷时，评估通过协商、诉讼、仲裁、调解等不同处理方式对组织的影响，选取适宜的争议解决方式"}]}, {"name": "问：知识产权评价的内容？", "children": [{"name": "答：（1）知识产权价值实现的符合性（2）知识产权合规管理体系的绩效和有效性（3）策划是否得到有效实施（4）知识产权合规的监测结果（5）应对风险和机遇所采取措施的有效性（6）外部供方的绩效（7）知识产权合规管理体系改进的需求"}]}]}, {"name": "第 16 章资源与工具管理", "children": [{"name": "问：研发测试环境的构成？", "children": [{"name": "答：（1）开发机器的获取（2）网络配置（3）基本工具（4）代码的获取和配置"}]}, {"name": "问：配置管理工具的功能模块？", "children": [{"name": "答：（1）项目管理（2）基线管理（3）流程控制（4）配置审核（5）统计查询（6）资源维护"}]}, {"name": "问：配置管理工具的主要功能？", "children": [{"name": "答：（1）项目管理（2）版本管理和基线控制（3）增强的版本控制（4）流程控制和变更管理（5）资源维护（6）过程自动化（7）管理项目的整个生命周期（8）与主流开发环境的集成"}]}, {"name": "问：软件自动化测试的阶段？", "children": [{"name": "答：（1）自动化测试计划（2）自动化测试设计（3）自动化测试实施（4）自动化测试执行"}]}, {"name": "问：测试管理工具的主要功能？", "children": [{"name": "答：（1）测试计划管理（2）测试用例管理（3）测试任务执行（4）缺陷记录跟踪（5）报告和分析（6）团队协作（7）集成其他工具"}]}, {"name": "问：测试管理工具的核心？", "children": [{"name": "答：（1）测试用例库（2）缺陷库"}]}, {"name": "问：围绕测试用例的管理内容？", "children": [{"name": "答：（1）测试用例管理（2）测试套件管理（3）测试执行结果"}]}, {"name": "问：围绕缺陷的管理内容？", "children": [{"name": "答：（1）缺陷记录（2）缺陷跟踪（3）分析报告"}]}, {"name": "问：研发测试环境搭建和维护的原则？", "children": [{"name": "答：（1）可重现性（2）可协作性（3）与生产环境相似性（4）自动化环境管理（5）灵活性（6）环境隔离性（7）可维护性"}]}, {"name": "问：研发测试环境部署所需的环境？", "children": [{"name": "答：（1）硬件环境（2）操作系统环境（3）应用程序环境（4）数据库环境"}]}, {"name": "问：研发测试环境部署的步骤？", "children": [{"name": "答：（1）硬件设备的选取和配置（2）操作系统的安装和配置（3）应用程序的安装和配置（4）数据库的安装和配置（5）测试工具和脚本的准备"}]}, {"name": "问：研发测试环境维护的要求？", "children": [{"name": "答：（1）定期备份研发测试环境数据（2）定期更新研发测试环境软件和补丁（3）定期清理研发测试环境数据和日志（4）监控研发测试环境状态"}]}, {"name": "问：监控工具的种类？", "children": [{"name": "答：（1）IT 基础设施监控（2）性能监控（3）业务运营监控"}]}, {"name": "问：统一运维监控体系的模块？", "children": [{"name": "答：（1）数据采集（2）数据检测（3）告警管理（4）故障管理（5）视图管理（6）监控管理"}]}, {"name": "问：核心的 ITSM 流程？", "children": [{"name": "答：（1）服务请求管理（2）事件管理（3）问题管理（4）变更管理"}]}, {"name": "问：备品备件管理的常见功能？", "children": [{"name": "答：（1）库存信息管理（2）备件维保服务生命周期管理（3）出入库审批流程（4）备件查询与追踪"}]}, {"name": "问：选择项目管理工具的考虑因素？", "children": [{"name": "答：（1）团队规模（2）业务需求（3）易用性（4）安全性（5）成本"}]}]}, {"name": "第 17 章信息系统项目管理", "children": [{"name": "问：开发生命周期的类型？", "children": [{"name": "答：（1）预测型（计划驱动型）（2）迭代型（3）增量型（4）适应型（敏捷型）（5）混合型"}]}, {"name": "问：项目管理的过程组？", "children": [{"name": "答：（1）启动过程组（2）规划过程组（3）执行过程组（4）监控过程组（5）收尾过程组"}]}]}]}, {"name": "③ 实践篇 · 考前必背 10 页（69 条速记）", "children": [{"name": "1、智慧城市共性基础类能力要素包括：数字战略、全周期管理、ICT 资源、数据、技术服务、信息安全。", "children": []}, {"name": "2、智慧城市的发展关注焦点：城市治理、惠民服务、生态宜居、产业发展、区域协同 🔑口诀\"市民生产区\"", "children": []}, {"name": "3、智慧城市的发展规划要点：", "children": [{"name": "（1）承接城市战略；"}, {"name": "（2）确立规划原则；"}, {"name": "（3）明确目标愿景；"}, {"name": "（4）业务与技术融合规划；"}, {"name": "（5）数字基础设施规划；"}, {"name": "（6）组织与保障体系规划。"}]}, {"name": "4、智慧城市发展规划可以参考的基本原则： 🔑口诀\"元芳能择人\"", "children": [{"name": "（1）以人为本，增强用户体验；"}, {"name": "（2）技术赋能，提升业务效率；"}, {"name": "（3）规则重构，优化资源配置；"}, {"name": "（4）多元创新，推进全局性转变；"}, {"name": "（5）多方共建，提升城市竞争力。"}]}, {"name": "5、智慧城市发展规划的基本要求：", "children": [{"name": "（1）明确各阶段的主要任务、建设内容及建设成果；"}, {"name": "（2）具有明确性、可衡量性、可达成性，并有明确时限，同时应与城市自身的数字化发展设想和其他城市规划目标相匹配；"}, {"name": "（3）总体目标以近期为准，应明确规划期完成后在政务、经济、社会、文化、生态文明等领域所取得的宏观成效，具体目标应就以上方面分领域描述应取得的具体成效；"}, {"name": "（4）规划目标应展望中远期达成成效和愿景，较总体目标更为宏观；"}, {"name": "（5）目标设定应充分衔接城市战略及智慧城市指导思想等内容；"}, {"name": "（6）建立指标体系，实现对智慧城市建设效果的量化。"}]}, {"name": "6、智慧城市关注的业务与技术融合内容：数字政府、数字社会、数字经济。", "children": []}, {"name": "7、数字政府规划内容：一网协同、一网统管、一网通办。", "children": []}, {"name": "8、智慧城市组织与保障体系规划的内容：组织体系、市场化生态、人才队伍、信息安全。 🔑口诀\"主场人权\"", "children": []}, {"name": "9、智慧城市组织体系规划步骤：", "children": [{"name": "（1）需要识别所有参与相关工作的主体，并从中找出主要组织单位，并基于此定义所有参与主体的角色与职责；"}, {"name": "（2）定义主导组织单位的相关责任分工，需要包括领导与协调、业务与项目管理、技术创新与决策、数据资源与安全等；"}, {"name": "（3）明确相关职责的承担部门或主体，并确保相关职责能够到人，必要时，技术创新与决策部分可以使用社会化力量进行承担；"}, {"name": "（4）明确主体组织单位外的其他组织单位角色与职责，这部分尽量能够到人，至少要与相关组织的内部架构进行匹配和融合；"}, {"name": "（5）所有单位的角色职责融合一体化。"}]}, {"name": "10、智慧城市组织体系规划注意事项：", "children": [{"name": "（1）不要忽略主体组织外的其他组织与群体；"}, {"name": "（2）避免相关职责没有得到有效宣贯；"}, {"name": "（3）所有责任体系要明确，确保基于组织架构等能够直接或间接实现所有任务或活动责任到人；"}, {"name": "（4）各类角色职责之间不要缺乏一体化融合。"}]}, {"name": "11、智慧城市市场化生态的注意事项：", "children": [{"name": "（1）把市场化生态作为一项工作内容考虑；"}, {"name": "（2）充分挖掘智慧城市发展与建设过程中，能够衍生的经济新模式、市场新业态；"}, {"name": "（3）考虑城市信息技术及其服务产业的发展基础，给出利用智慧城市建设促进相关产业发展的方法；"}, {"name": "（4）尽量确保相关市场化生态覆盖模式革新、技术创新和管理创新；"}, {"name": "（5）明确城市基于市场化生态的创新机制、措施和模式等。"}]}, {"name": "12、智慧城市人才保障体系规划的注意事项：", "children": [{"name": "（1）确保智慧城市主体组织单位相关人才体系与人才容量的有效性；"}, {"name": "（2）特定业务主体单位，相关业务人员的数字能力；"}, {"name": "（3）领军、标杆等创新人才的打造，以及其带头和影响力建设；"}, {"name": "（4）信息数字技术人才对智慧城市业务的认知与融合创新能力；"}, {"name": "（5）城市社会化智慧城市人才建设与发展情况。"}]}, {"name": "13、智慧城市信息安全保障措施规划的注意事项：", "children": [{"name": "（1）全面落实信息安全责任制，全力保障任何安全风险和安全事件都有对应的人负责；"}, {"name": "（2）系统分析信息安全体系的完整性和有效性，保障管理体系的管理活动得到合理安全；"}, {"name": "（3）在重视网络安全、数据安全和系统安全的基础上，需要把终端安全的重要性提高到新的高度；"}, {"name": "（4）确保安全工具的有效性；"}, {"name": "（5）强化网络行为审计和运维审计等，保障各类攻防的有效性。"}]}, {"name": "14、智慧城市总体架构的内容：业务架构、数据架构、应用架构、技术架构、安全体系、标准体系、产业体系 🔑口诀\"产业用数全标记\"", "children": []}, {"name": "15、城市总体数据架构主要包括：城市总体数据模型、数据分布、数据服务。", "children": []}, {"name": "16、智慧园区投资模式主要有：政府投资类、平台公司类、政府和社会资本合作共建。", "children": []}, {"name": "17、智慧园区的发展关注焦点：招引建设、经济监测、园区运行、公共安全、产城融合、绿色园区、关键评价指标 🔑口诀\"招经园安/融绿评\"", "children": []}, {"name": "18、智慧园区评价指标维度：产城融合、组织战略、运营管理、产业服务、社群服务、绿色环保、安全应急、运行管理、信息与应用。", "children": []}, {"name": "19、智慧园区的发展规划要点：", "children": [{"name": "（1）数智化转型提升；"}, {"name": "（2）建设发展可持续；"}, {"name": "（3）技术与制度创新；"}, {"name": "（4）运维与运营体系。"}]}, {"name": "20、智慧园区数智化转型提升的方面：", "children": [{"name": "（1）基础设施集约化；"}, {"name": "（2）运营管理精细化；"}, {"name": "（3）园区服务平台化；"}, {"name": "（4）产业发展数字化。"}]}, {"name": "21、智慧园区的总体参考架构：应用架构、数据架构、交互体系。", "children": []}, {"name": "22、智慧园区应用架构包含：", "children": [{"name": "（1）综合安防；（2）便捷通行；（3）设施管理；（4）资产管理；（5）能耗管理；（6）环境管理；（7）智能运营中心。"}]}, {"name": "23、数字乡村发展的关注焦点：", "children": [{"name": "（1）数字经济；（2）数字服务；（3）数字治理；（4）数字生态；（5）文化资源数字化。"}]}, {"name": "24、数字乡村发展规划的要点：", "children": [{"name": "（1）加强乡村数字基础建设；"}, {"name": "（2）推动数字治理体系建设；"}, {"name": "（3）加快城乡教育一体化建设；"}, {"name": "（4）坚持数字经济发展为导向；"}, {"name": "（5）关键技术与数字乡村应用的深度融合。"}]}, {"name": "25、乡村数字经济内容包含：", "children": [{"name": "（1）农业数字化（2）乡村电子商务（3）乡村普惠金融（4）乡村新业态."}]}, {"name": "26、乡村数字服务内容包含：", "children": [{"name": "（1）“互联网+政务”（2）“互联网+医疗”（3）“互联网+养老”"}]}, {"name": "27、加快城乡教育一体化建设的主要内容：", "children": [{"name": "（1）推进乡村教育信息化；"}, {"name": "（2）搭建乡村数字资源的共享平台；"}, {"name": "（3）培育新型数字农民为主的人才。"}]}, {"name": "28、坚持数字经济发展为导向的主要内容：", "children": [{"name": "（1）畅通资源“进程下乡”渠道；"}, {"name": "（2）创新科技成果转化下乡机制；"}, {"name": "（3）积极发展农村数字经济新业态。"}]}, {"name": "29、关键技术与数字乡村应用深度融合的主要内容： 🔑口诀\"全新感应\"", "children": [{"name": "（1）新型基础设施技术；"}, {"name": "（2）数字乡村信息感知技术；"}, {"name": "（3）数字乡村智能化应用技术；"}, {"name": "（4）数字乡村数据安全共享与传输技术。"}]}, {"name": "30、信息系统架构设计包含：业务架构、总体架构、数据架构、运营与服务架构。", "children": []}, {"name": "31、数字乡村信息系统总体参考架构的组成：", "children": [{"name": "（1）业务场景；（2）技术支撑；（3）数据能力；（4）基础设施；（5）运营管理；（6）标准与安全。"}]}, {"name": "32、数字乡村运营与服务架构组成部分：运营指导中心、运营主体、运营对象、运营服务保障、运营安全保障。", "children": []}, {"name": "33、转型驱动力包括：时代演进驱动力、技术资源驱动力、政策金融驱动力、升级发展驱动力。", "children": []}, {"name": "34、时代驱动企业开展数字化转型的关键动力：消费重塑、产业调整、劳动供给、绿色低碳、发展格局。", "children": []}, {"name": "35、企业数字化转型的关注焦点：", "children": [{"name": "（1）客户中心；（2）数智赋能；（3）敏捷组织；（4）新型文化。"}]}, {"name": "36、企业数字化转型的发展规划要点：", "children": [{"name": "（1）管控规划活动；（2）定义数字化蓝图；（3）明确数字化发展需求；（4）制定解决方案与路径计划；（5）确保保障措施有效性；（6）规划建设数字人才。"}]}, {"name": "37、数字化转型规划活动管控的方面：", "children": [{"name": "（1）组织；（2）宣教；（3）目标；（4）过程；（5）成果。"}]}, {"name": "38、定义数字化蓝图对企业的要求：", "children": [{"name": "（1）目标长远；（2）战略高度；（3）拥抱数字；（4）顺势而为。"}]}, {"name": "39、企业数字化转型规划诊断评估的步骤：", "children": [{"name": "（1）基于企业业务特征、行业特点和职能设施等，分析并确立企业所需的能力域、能力子域，乃至能力分项；"}, {"name": "（2）定义各能力领域的成熟度标尺；"}, {"name": "（3）结合企业的发展导向、行业特点和标准与实践等，明确各能力领域的权重体系；"}, {"name": "（4）编制诊断评估的调研表单、调研问题、调研计划等，根据计划实施调研活动，并对企业各能力域进行量化评价；"}, {"name": "（5）针对重点领域，召开研讨活动；"}, {"name": "（6）对企业各领域能力成熟度进行分析，在明确长短板的基础上，洞察形成这种能力分布的深层次原因；"}, {"name": "（7）逐项分析企业所处整体等级和高一等级不满足成熟度标尺细化要求的情况和程度。"}]}, {"name": "40、数字人才建设的关键控制点：", "children": [{"name": "（1）部门壁垒；（2）个性化需求；（3）持续推进 🔑口诀\"推个门\""}]}, {"name": "41、数字化转型业务分析框架图的层次：", "children": [{"name": "（1）能力主线业务架构；（2）全域业务架构；（3）企业级价值链 🔑口诀\"全能练\""}]}, {"name": "42、智能制造的发展关注焦点：", "children": [{"name": "（1）智能制造人才培养；（2）数字化研发设计；（3）生产过程智能化；（4）设备数字化管理；（5）智能物流；（6）智慧安全与环保；（7）智慧能源管理 🔑口诀\"数字人生无智慧\""}]}, {"name": "43、智能制造规划活动的要点：", "children": [{"name": "（1）诊断评估；（2）均衡部署；（3）突破重点；（4）人才保障 🔑口诀\"不点真人\""}]}, {"name": "44、智能制造规划管理的要点：", "children": [{"name": "（1）多元参与；（2）知识传递；（3）目标控制；（4）实践借鉴 🔑口诀\"多地标间\""}]}, {"name": "45、智能制造生命周期的活动：", "children": [{"name": "（1）设计；（2）生产；（3）物流；（4）销售；（5）服务 🔑口诀\"计生留校服\""}]}, {"name": "46、智能制造的智能特征：", "children": [{"name": "（1）资源要素；（2）互联互通；（3）融合共享；（4）系统集成；（5）新兴业态 🔑口诀\"心系同工资\""}]}, {"name": "47、智能制造的实施路径：", "children": [{"name": "（1）第一阶段的由缺到全；（2）第二阶段的由全到通；（3）第三阶段的由通到智 🔑口诀\"缺到全，全到通，通到智\""}]}, {"name": "48、新型消费系统的发展关注焦点：", "children": [{"name": "（1）新零售业态；（2）“互联网+”服务；（3）共享型消费；（4）兴趣消费 🔑口诀\"新户共消\""}]}, {"name": "49、新型消费系统的规划要点：", "children": [{"name": "（1）需求分析；（2）用户体验；3 精准营销；（4）效益分析；（5）关键要素 🔑口诀\"需用营销书\""}]}, {"name": "50、新型消费系统规划需求分析的注意事项： 🔑口诀\"钱因细分贵适用\"", "children": [{"name": "（1）需要具备一定的前瞻性，充分预测用户的需求发展；"}, {"name": "（2）强调对隐性需求的分析；"}, {"name": "（3）消费场景尽可能细化；"}, {"name": "（4）充分考虑地域发展和文化的差异；"}, {"name": "（5）强化对消费群体的归集；"}, {"name": "（6）预留充足的需求变革适应能力；"}, {"name": "（7）考虑消费者对消费入口工具的使用。"}]}, {"name": "51、新型消费系统规划用户体验的注意事项：", "children": [{"name": "（1）建立用户体验反馈群体或虚拟组织，从使用中获得体验反馈；"}, {"name": "（2）策划用户体验的发布策略，逐步引导用户的体验；"}, {"name": "（3）关注人体工程相关的知识应用，保障体验的顺畅性；"}, {"name": "（4）充分考虑各类终端的特征特点，与体验融为一体；"}, {"name": "（5）强化视觉优化，确保静动态页面的美感及一致性。"}]}, {"name": "52、新型消费系统规划精准营销的注意事项：", "children": [{"name": "（1）注重联合营销接口的支撑能力，便于后期与其他平台的联合拓展；"}, {"name": "（2）在营销相关模块中，部署流量计量等功能，乃至流量计费模型；"}, {"name": "（3）对国家相关法律法规、标准的遵循，包括互联网广告、程序化营销；"}, {"name": "（4）关注细节数据沉淀以及数据关联的标注；"}]}, {"name": "53、新型消费系统规划成功的关键要素：", "children": [{"name": "（1）获客导流；（2）促活锁客；3 变现留客；（4）精准运营。"}]}, {"name": "54、新型消费场景下系统架构设计需要考虑的方面：", "children": [{"name": "（1）处理大量用户请求能力；（2）大量数据处理分析能力；（3）数据安全和隐私保护能力；（4）实时响应和交互能力；（5）多终端支持能力 🔑口诀\"球叔按时钟\""}]}, {"name": "55、保障新型消费系统安全和稳定性的主要措施：", "children": [{"name": "（1）数据加密和身份认证；（2）防火墙和入侵检测系统；（3）安全培训和意识教育；（4）系统备份和容灾；（5）监控和日志记录。"}]}, {"name": "56、新型消费系统可扩展性和灵活设计的考虑因素：", "children": [{"name": "（1）模块化设计；（2）基于云计算的架构；（3）自动化运维和部署；（4）开放式接口和标准化协议；（5）统一数据管理和分析平台。"}]}, {"name": "57、中国特色社会主义法律体系，是以宪法为统帅，以法律为主干，以行政法规、地方性法规为重要组成部分，", "children": []}, {"name": "58、我国法律体系中的法律法规包括法律，法律解释，行政法规，地方性法规、自治条例和单行条例以及规章等。", "children": []}, {"name": "59、根据《中华人民共和国标准化法》国家标准分为强制性标准、推荐性标准。行业标准、地方标准是推荐性标准。强制性标准必须执行。国家鼓励采用推荐性标准。", "children": []}, {"name": "60、强制性国家标准的代号为“GB”，推荐性国家标准的代号为“GB/T”，国家标准样品的代号为“GSB”，指导性技术文件的代号为“GB/Z”。", "children": []}, {"name": "61、国家标准的编号由国家标准的代号、国家标准发布的顺序号和国家标准发布的年份号构成。国家标准样品的编号由国家标准样品的代号、分类目录号、发布顺序号、复制批次号和发布年份号构成。", "children": []}, {"name": "62、标准名称由三种元素组成：", "children": [{"name": "（1）引导元素（可选）：表示文件所属的领域；（2）主体元素（必备）：表示文件所涉及的标准化对象；（3）补充元素（可选）：表示标准化对象的特殊方面。"}]}, {"name": "63、ISO 标准为例，该标准每 5 年复审一次。我国在《国家标准管理办法》中规定国家标准实施 5 年内需要进行复审，即国家标准有效期一般为 5 年。企业标准应定期复审，复审周期一般不超过 3 年。", "children": []}, {"name": "64、ITIL 的 2011 年版本使用 5 个主要书面指导文件，分别论述了 IT 服务的服务战略、服务设计、服务转换、服务运营和服务的持续改进。涉及 4 个职能：服务台、运营管理、应用管理、技术管理；26 个流程：事件管理、事态管理、请求履行、问题管理、资产与配置管理、变更管理、发布与部署管理、服务级别管理、连续性管理、可用性管理、容量管理、IT 服务财务管理、信息安全管理、服务报告、业务关系管理、供应商管理、知识管理、服务目录管理、战略制定、需求管理、服务组合管理、变更评估、设计协作管理、服务验证与测试、转换规划与支持、访问管理。", "children": []}, {"name": "65、IT 服务 PPTR：人员（People）、过程（Process）、技术（Technology）、资源（Resource）。", "children": []}, {"name": "66、IT 服务生命周期 PIOIS：规划设计（Planning&Design）、部署实施（Implementing）、服务运营（Operation）、持续改进（Improvement）和监督管理（Supervision） 🔑口诀\"技师服务改监督\"", "children": []}, {"name": "67、ITSS5.0 的主要内容包括通用标准、保障标准、基础服务标准、技术创新服务标准、数字化转型服务标准、业务融合标准。", "children": []}, {"name": "68、服务管控类标准分为：治理、服务管理和监理三个子域。", "children": []}, {"name": "69、技术创新服务标准主要包括：智能化服务、数据服务、数字内容处理服务、区块链服务。", "children": []}]}]};
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function renderText(s){
  return esc(s).replace(/(🔑[^"“]*["“][^"”]*["”])/g,'<span class="hook">$1</span>');
}
function build(node, depth){
  const wrap=document.createElement('div');
  wrap.className='node lv'+Math.min(depth,2)+(depth>2?' lv2deep':'');
  const label=document.createElement('div');
  label.className='label';
  const kids=node.children||[];
  label.innerHTML=renderText(node.name)+(kids.length?'<span class="n">('+kids.length+')</span>':'');
  wrap.appendChild(label);
  if(kids.length){
    label.classList.add('tog');
    const box=document.createElement('div');
    box.className='children';
    kids.forEach(k=>box.appendChild(build(k,depth+1)));
    wrap.appendChild(box);
    label.addEventListener('click',()=>wrap.classList.toggle('collapsed'));
    if(depth>=2) wrap.classList.add('collapsed');
  }
  wrap.dataset.text=node.name;
  return wrap;
}
const map=document.getElementById('map');
map.appendChild(build(DATA,0));
function setAll(node,expand,depth){
  if(node.classList&&node.classList.contains('node')){
    if(depth>=2) node.classList.toggle('collapsed',!expand);
    node.querySelectorAll(':scope > .children > .node').forEach(c=>setAll(c,expand,depth+1));
  }
}
function expandAll(yes){ setAll(map.firstChild,yes,0); }
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim(); if(!q)return;
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  const hit=[...document.querySelectorAll('.node')].find(n=>n.dataset.text&&n.dataset.text.includes(q));
  if(!hit){alert('没找到：'+q);return;}
  let p=hit; while(p){ if(p.classList&&p.classList.contains('node'))p.classList.remove('collapsed'); p=p.parentElement; }
  hit.querySelector('.label').classList.add('hl');
  hit.scrollIntoView({block:'center',inline:'center'});
});
</script>
